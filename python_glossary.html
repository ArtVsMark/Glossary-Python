', 'world']\n# filter с функцией\ndef is_odd(n): return n % 2 != 0\nodds = list(filter(is_odd, range(10)))\nprint(odds)  # → [1, 3, 5, 7, 9]\n# filter ленивый\nf = filter(lambda x: x > 2, [1,2,3,4])\nprint(next(f))  # → 3\n# Отбор непустых словарей\ndata = [{'a':1}, {}, {'b':2}]\nnon_empty_d = list(filter(None, data))\nprint(non_empty_d)  # → [{'a':1},{'b':2}]\n# filter + map\nresult = list(map(lambda x: x**2, filter(lambda x: x%2==0, range(6))))\nprint(result)  # → [0, 4, 16]","version":null,"docs":"https://docs.python.org/3/"},{"id":"reduce","name":"reduce()","group":"Функции","subcat":"функциональное","cg":"op","description":"Сворачивает итерируемый объект в одно значение, последовательно применяя функцию. Из модуля functools.","syntax":"from functools import reduce\nreduce(func, iterable[, initializer])","examples":"from functools import reduce\nresult = reduce(lambda a, b: a + b, [1,2,3,4,5])\nprint(result)  # → 15\nproduct = reduce(lambda a, b: a * b, [1,2,3,4,5])\nprint(product)  # → 120\nmaximum = reduce(lambda a, b: a if a > b else b, [3,1,4,1,5,9])\nprint(maximum)  # → 9\nwords = ['Hello', ' ', 'World']\nsentence = reduce(lambda a, b: a + b, words)\nprint(sentence)  # → Hello  World\n# С начальным значением\ntotal = reduce(lambda a, b: a + b, [1,2,3], 100)\nprint(total)  # → 106\n# Подсчёт вхождений\nfrom collections import Counter\nnums = [1,1,2,3,1]\nresult2 = reduce(lambda acc, x: acc + (1 if x==1 else 0), nums, 0)\nprint(result2)  # → 3","version":null,"docs":"https://docs.python.org/3/"},{"id":"sorted-с-key","name":"sorted() с key=","group":"Функции","subcat":"функциональное","cg":"op","description":"Возвращает новый отсортированный список. key= задаёт функцию для ключа сортировки. reverse= — обратный порядок.","syntax":"sorted(iterable, key=None, reverse=False)","examples":"words = ['banana', 'apple', 'cherry', 'kiwi']\nprint(sorted(words))  # → алфавит\nprint(sorted(words, key=len))  # → по длине\nprint(sorted(words, key=len, reverse=True))  # → ['banana', 'cherry', 'apple', 'kiwi']\n# key=str.lower — регистронезависимо\nmixed = ['Banana', 'apple', 'Cherry']\nprint(sorted(mixed, key=str.lower))  # → ['apple', 'Banana', 'Cherry']\n# Сортировка кортежей\npairs = [(2,'b'),(1,'a'),(3,'c')]\nprint(sorted(pairs))  # → [(1,'a'),(2,'b'),(3,'c')]\nprint(sorted(pairs, key=lambda p: p[1]))  # → по буквам\n# Словари по значению\nd = {'a':3,'b':1,'c':2}\nprint(sorted(d, key=d.get))  # → ['b','c','a']\n# Вторичный ключ\nstudents = [('Alice',85),('Bob',90),('Carol',85)]\nprint(sorted(students, key=lambda s: (-s[1], s[0])))  # → Bob, Alice, Carol\nnums = [3,-1,4,-1,5,-9]\nprint(sorted(nums, key=abs))  # → [-1,-1,3,4,5,-9]","version":null,"docs":"https://docs.python.org/3/"},{"id":"абстрактные-классы","name":"Абстрактные классы","group":"ООП","subcat":"ABC","cg":"oop","description":"abc.ABC и @abstractmethod запрещают создание экземпляров класса без реализации всех абстрактных методов.","syntax":"from abc import ABC, abstractmethod\nclass Shape(ABC):\n    @abstractmethod\n    def area(self): ...","examples":"from abc import ABC, abstractmethod\nclass Shape(ABC):\n    @abstractmethod\n    def area(self) -> float:\n        pass\n    @abstractmethod\n    def perimeter(self) -> float:\n        pass\nclass Circle(Shape):\n    def __init__(self, r):\n        self.r = r\n    def area(self):\n        import math\n        return math.pi * self.r**2\n    def perimeter(self):\n        import math\n        return 2 * math.pi * self.r\nprint(round(Circle(5).area(), 2))  # → 78.54\n# TypeError при попытке создать экземпляр ABC\ntry:\n    Shape()\nexcept TypeError as e:\n    print(e)  # → Can't instantiate abstract class Shape...\nclass Animal(ABC):\n    @abstractmethod\n    def speak(self) -> str:\n        pass\n    def describe(self):\n        return f'I say: {self.speak()}'\nclass Dog(Animal):\n    def speak(self):\n        return 'Woof!'\nprint(Dog().describe())  # → I say: Woof!\n# Абстрактное свойство\nclass Base(ABC):\n    @property\n    @abstractmethod\n    def name(self) -> str:\n        pass\nclass Concrete(Base):\n    @property\n    def name(self):\n        return 'Concrete'\nprint(Concrete().name)  # → Concrete\n# ABCMeta без ABC\nfrom abc import ABCMeta\nclass Interface(metaclass=ABCMeta):\n    @abstractmethod\n    def process(self): pass\nclass Impl(Interface):\n    def process(self): return 'done'\nprint(Impl().process())  # → done\n# isinstance с ABC\nprint(isinstance(Dog(), Animal))  # → True\nprint(issubclass(Dog, Animal))    # → True","version":null,"docs":"https://docs.python.org/3/reference/datamodel.html"},{"id":"property","name":"@property","group":"ООП","subcat":"property","cg":"oop","description":"Превращает метод в атрибут (геттер). @x.setter — сеттер. @x.deleter — делитер. Вычисляемые атрибуты.","syntax":"@property\ndef x(self): return self._x","examples":"class Circle:\n    def __init__(self, r):\n        self._r = r\n    @property\n    def radius(self):\n        return self._r\n    @radius.setter\n    def radius(self, value):\n        if value < 0:\n            raise ValueError('radius must be >= 0')\n        self._r = value\nc = Circle(5)\nprint(c.radius)  # → 5\nc.radius = 10\nprint(c.radius)  # → 10\nclass Celsius:\n    def __init__(self, temp):\n        self.temperature = temp\n    @property\n    def fahrenheit(self):\n        return self.temperature * 9/5 + 32\nc = Celsius(100)\nprint(c.fahrenheit)  # → 212.0\nclass Person:\n    def __init__(self, first, last):\n        self.first = first\n        self.last = last\n    @property\n    def full_name(self):\n        return f'{self.first} {self.last}'\n    @full_name.setter\n    def full_name(self, name):\n        self.first, self.last = name.split()\np = Person('John', 'Doe')\nprint(p.full_name)  # → John Doe\np.full_name = 'Jane Smith'\nprint(p.first)  # → Jane\nclass Square:\n    def __init__(self, side):\n        self._side = side\n    @property\n    def side(self):\n        return self._side\n    @side.setter\n    def side(self, v):\n        self._side = v\n    @property\n    def area(self):\n        return self._side ** 2\n    @property\n    def perimeter(self):\n        return 4 * self._side\ns = Square(5)\nprint(s.area)      # → 25\nprint(s.perimeter) # → 20\nclass BankAccount:\n    def __init__(self, balance):\n        self._balance = balance\n    @property\n    def balance(self):\n        return self._balance\n    @balance.setter\n    def balance(self, amount):\n        if amount < 0:\n            raise ValueError('Balance cannot be negative')\n        self._balance = amount\nacc = BankAccount(100)\nprint(acc.balance)  # → 100\n# @property.deleter\nclass Profile:\n    def __init__(self):\n        self._avatar = 'default.png'\n    @property\n    def avatar(self):\n        return self._avatar\n    @avatar.deleter\n    def avatar(self):\n        self._avatar = 'default.png'\np2 = Profile()\np2._avatar = 'photo.jpg'\ndel p2.avatar\nprint(p2.avatar)  # → default.png\n# property как декоратор-класс\nclass Temperature:\n    def __init__(self, c=0):\n        self._c = c\n    temperature = property(lambda self: self._c,\n                          lambda self, v: setattr(self, '_c', v))\nt = Temperature(25)\nprint(t.temperature)  # → 25","version":null,"docs":"https://docs.python.org/3/reference/datamodel.html"},{"id":"self","name":"self","group":"ООП","subcat":"self","cg":"oop","description":"Ссылка на текущий экземпляр класса. Первый параметр методов экземпляра (имя — соглашение).","syntax":"def method(self): self.x = ...","examples":"class Box:\n    def __init__(self, size):\n        self.size = size\n    def double(self):\n        self.size *= 2\nb = Box(5)\nb.double()\nprint(b.size)  # → 10\nclass Greeter:\n    def __init__(self, greeting):\n        self.greeting = greeting\n    def greet(self, name):\n        return f'{self.greeting}, {name}!'\ng = Greeter('Hi')\nprint(g.greet('Bob'))  # → Hi, Bob!\nclass Node:\n    def __init__(self, val):\n        self.val = val\n        self.next = None\n    def set_next(self, node):\n        self.next = node\nn1 = Node(1)\nn2 = Node(2)\nn1.set_next(n2)\nprint(n1.next.val)  # → 2\nclass Builder:\n    def __init__(self):\n        self.items = []\n    def add(self, item):\n        self.items.append(item)\n        return self  # цепочка!\n    def build(self):\n        return self.items\nb2 = Builder().add(1).add(2).add(3).build()\nprint(b2)  # → [1, 2, 3]\n# Передача self явно\nclass Calc:\n    def sq(self):\n        return self.n ** 2\nc2 = Calc()\nc2.n = 5\nprint(Calc.sq(c2))  # → 25 (явно)\nclass Logger:\n    prefix = '[LOG]'\n    def log(self, msg):\n        print(f'{self.prefix} {msg}')\nl = Logger()\nl.prefix = '[INFO]'\nl.log('test')  # → [INFO] test","version":null,"docs":"https://docs.python.org/3/reference/datamodel.html"},{"id":"__slots__","name":"__slots__","group":"ООП","subcat":"slots","cg":"oop","description":"__slots__ ограничивает атрибуты экземпляра, убирает __dict__, экономит память. Особенно полезно для большого числа объектов.","syntax":"class C:\n    __slots__ = ('x', 'y')","examples":"class Point:\n    __slots__ = ('x', 'y')\n    def __init__(self, x, y):\n        self.x = x; self.y = y\np = Point(1, 2)\nprint(p.x, p.y)  # → 1 2\ntry:\n    p.z = 3  # → AttributeError\nexcept AttributeError as e:\n    print(e)\n# Нет __dict__\ntry:\n    print(p.__dict__)\nexcept AttributeError as e:\n    print(e)  # → __dict__ attribute not defined\nimport sys\nclass WithDict:\n    def __init__(self, x, y):\n        self.x = x; self.y = y\nclass WithSlots:\n    __slots__ = ('x','y')\n    def __init__(self, x, y):\n        self.x = x; self.y = y\nprint(sys.getsizeof(WithDict(1,2)))   # → больше\nprint(sys.getsizeof(WithSlots(1,2))) # → меньше\n# __slots__ в наследовании\nclass Base:\n    __slots__ = ('x',)\nclass Child(Base):\n    __slots__ = ('y',)\nc2 = Child()\nc2.x = 1; c2.y = 2\nprint(c2.x, c2.y)  # → 1 2\n# Частичные __slots__\nclass Mixed:\n    __slots__ = ('x',)\n    def __init__(self, x, y):\n        self.x = x\n        # self.y = y  # → AttributeError\nprint(Mixed(1,2).x)  # → 1","version":null,"docs":"https://docs.python.org/3/reference/datamodel.html"},{"id":"атрибуты-экземпляра-и-класса","name":"Атрибуты экземпляра и класса","group":"ООП","subcat":"атрибуты","cg":"oop","description":"Атрибуты класса — общие для всех экземпляров. Атрибуты экземпляра — уникальные для каждого. Изменяемые атрибуты класса — ловушка!","syntax":"class C:\n    class_attr = 0  # классовый\n    def __init__(self):\n        self.inst_attr = 1  # экземплярный","examples":"class Dog:\n    species = 'Canis lupus'  # классовый\n    def __init__(self, name):\n        self.name = name   # экземплярный\nd1 = Dog('Rex')\nd2 = Dog('Max')\nprint(d1.species, d2.species)  # → Canis lupus Canis lupus\nprint(d1.name, d2.name)  # → Rex Max\n# Изменение классового атрибута через класс\nDog.species = 'Canis familiaris'\nprint(d1.species)  # → Canis familiaris\n# Затенение классового атрибута\nd1.species = 'Wolf'  # только у d1\nprint(d1.species)  # → Wolf\nprint(d2.species)  # → Canis familiaris\n# Изменяемый классовый атрибут — ловушка!\nclass BadList:\n    items = []  # общий для всех!\nb1 = BadList(); b2 = BadList()\nb1.items.append(1)\nprint(b2.items)  # → [1] !\nclass GoodList:\n    def __init__(self):\n        self.items = []  # каждому свой\ng1 = GoodList(); g2 = GoodList()\ng1.items.append(1)\nprint(g2.items)  # → []\nclass Counter2:\n    count = 0\n    def __init__(self):\n        Counter2.count += 1\n        self.id = Counter2.count\nCounter2(); c3 = Counter2()\nprint(c3.id, Counter2.count)  # → 2 2\n# vars() vs dir()\nclass A:\n    x = 1\n    def __init__(self):\n        self.y = 2\na = A()\nprint(vars(a))  # → {'y': 2} (только экземплярные)","version":null,"docs":"https://docs.python.org/3/reference/datamodel.html"},{"id":"__init__","name":"__init__","group":"ООП","subcat":"инициализация","cg":"oop","description":"Конструктор — вызывается при создании экземпляра. Инициализирует атрибуты объекта.","syntax":"def __init__(self, params): ...","examples":"class Person:\n    def __init__(self, name, age):\n        self.name = name\n        self.age = age\np = Person('Alice', 30)\nprint(p.name, p.age)  # → Alice 30\nclass Rectangle:\n    def __init__(self, w=1, h=1):\n        self.w = w\n        self.h = h\nr = Rectangle()\nprint(r.w, r.h)  # → 1 1\nclass BankAccount:\n    def __init__(self, owner, balance=0):\n        if balance < 0:\n            raise ValueError('Balance cannot be negative')\n        self.owner = owner\n        self.balance = balance\nacc = BankAccount('Bob', 100)\nprint(acc.balance)  # → 100\nclass Animal:\n    def __init__(self, name):\n        self.name = name\nclass Dog(Animal):\n    def __init__(self, name, breed):\n        super().__init__(name)\n        self.breed = breed\nd = Dog('Rex', 'Lab')\nprint(d.name, d.breed)  # → Rex Lab\nclass Stack:\n    def __init__(self):\n        self._data = []\n    def push(self, item):\n        self._data.append(item)\n    def pop(self):\n        return self._data.pop()\ns = Stack()\ns.push(1); s.push(2)\nprint(s.pop())  # → 2\nclass Vector:\n    def __init__(self, *components):\n        self.components = list(components)\nv = Vector(1, 2, 3)\nprint(v.components)  # → [1, 2, 3]\nclass Config:\n    def __init__(self, **settings):\n        self.__dict__.update(settings)\ncfg = Config(debug=True, level=2)\nprint(cfg.debug, cfg.level)  # → True 2","version":null,"docs":"https://docs.python.org/3/reference/datamodel.html"},{"id":"инкапсуляция-_private-__mangled","name":"Инкапсуляция — _private, __mangled","group":"ООП","subcat":"инкапсуляция","cg":"oop","description":"Одиночный _ — соглашение (внутренний). Двойной __ — name mangling (переименование _Class__attr). Нет настоящих private в Python.","syntax":"self._protected\nself.__private","examples":"class BankAccount:\n    def __init__(self, balance):\n        self._balance = balance  # 'protected'\n    def get_balance(self):\n        return self._balance\nacc = BankAccount(100)\nprint(acc.get_balance())  # → 100\nprint(acc._balance)  # → 100 (можно, но нежелательно)\nclass Secret:\n    def __init__(self):\n        self.__secret = 42\n    def reveal(self):\n        return self.__secret\ns = Secret()\nprint(s.reveal())  # → 42\ntry:\n    print(s.__secret)  # → AttributeError\nexcept AttributeError as e:\n    print(e)\n# Name mangling\nprint(s._Secret__secret)  # → 42 (доступ через mangling)\n# В наследовании __attr не переопределяется случайно\nclass Base:\n    def __init__(self):\n        self.__x = 'base'\n    def get_x(self):\n        return self.__x\nclass Child(Base):\n    def __init__(self):\n        super().__init__()\n        self.__x = 'child'  # → _Child__x, не трогает _Base__x\n    def get_child_x(self):\n        return self.__x\nch = Child()\nprint(ch.get_x())       # → base\nprint(ch.get_child_x()) # → child\nclass Config:\n    _default = {'timeout': 30}\n    def __init__(self, **kwargs):\n        self._settings = {**self._default, **kwargs}\n    def get(self, key):\n        return self._settings.get(key)\ncfg = Config(timeout=60)\nprint(cfg.get('timeout'))  # → 60\n# Конвенция: _ означает 'не трогай'\nclass Transformer:\n    def transform(self, data):\n        data = self._preprocess(data)\n        return self._process(data)\n    def _preprocess(self, data):\n        return [x.strip() for x in data]\n    def _process(self, data):\n        return [x.upper() for x in data]\nt = Transformer()\nprint(t.transform(['  hello ', ' world ']))  # → ['HELLO','WORLD']","version":null,"docs":"https://docs.python.org/3/reference/datamodel.html"},{"id":"class","name":"class","group":"ООП","subcat":"классы","cg":"oop","description":"Объявление класса. Класс — шаблон для создания объектов (экземпляров).","syntax":"class ИмяКласса:\n    тело","examples":"class Dog:\n    pass  # пустой класс\nd = Dog()\nprint(type(d))  # → <class '__main__.Dog'>\nclass Cat:\n    \"\"\"Класс кошки.\"\"\"\n    species = 'Felis catus'  # атрибут класса\nprint(Cat.species)  # → Felis catus\nclass Point:\n    def __init__(self, x, y):\n        self.x = x\n        self.y = y\n    def __str__(self):\n        return f'Point({self.x}, {self.y})'\np = Point(3, 4)\nprint(p)  # → Point(3, 4)\nclass Circle:\n    pi = 3.14159\n    def __init__(self, r):\n        self.r = r\n    def area(self):\n        return self.pi * self.r ** 2\nc = Circle(5)\nprint(c.area())  # → 78.53975\nclass Empty:\n    \"\"\"Docstring.\"\"\"\n    pass\nprint(Empty.__doc__)  # → Docstring.\nclass Counter:\n    count = 0\n    def __init__(self):\n        Counter.count += 1\nCounter(); Counter()\nprint(Counter.count)  # → 2\nclass Vehicle:\n    def __init__(self, brand, speed):\n        self.brand = brand\n        self.speed = speed\n    def describe(self):\n        return f'{self.brand} @ {self.speed}km/h'\nv = Vehicle('BMW', 200)\nprint(v.describe())  # → BMW @ 200km/h","version":null,"docs":"https://docs.python.org/3/reference/datamodel.html"},{"id":"classmethod","name":"@classmethod","group":"ООП","subcat":"классы","cg":"oop","description":"Метод класса. Первый параметр — cls (ссылка на класс). Используется для альтернативных конструкторов.","syntax":"@classmethod\ndef method(cls, ...): ...","examples":"class Date:\n    def __init__(self, y, m, d):\n        self.y, self.m, self.d = y, m, d\n    @classmethod\n    def from_string(cls, s):\n        y, m, d = map(int, s.split('-'))\n        return cls(y, m, d)\nd = Date.from_string('2024-03-15')\nprint(d.y, d.m, d.d)  # → 2024 3 15\nclass Dog:\n    count = 0\n    def __init__(self, name):\n        self.name = name\n        Dog.count += 1\n    @classmethod\n    def get_count(cls):\n        return cls.count\nDog('Rex'); Dog('Max')\nprint(Dog.get_count())  # → 2\nclass Temperature:\n    def __init__(self, celsius):\n        self.celsius = celsius\n    @classmethod\n    def from_fahrenheit(cls, f):\n        return cls((f - 32) * 5/9)\n    @classmethod\n    def from_kelvin(cls, k):\n        return cls(k - 273.15)\nt = Temperature.from_fahrenheit(212)\nprint(round(t.celsius))  # → 100\nclass Pizza:\n    ingredients = []\n    def __init__(self, ingredients):\n        self.ingredients = ingredients\n    @classmethod\n    def margherita(cls):\n        return cls(['mozzarella', 'tomato'])\n    @classmethod\n    def hawaiian(cls):\n        return cls(['mozzarella', 'tomato', 'pineapple'])\np = Pizza.margherita()\nprint(p.ingredients)  # → ['mozzarella', 'tomato']\n# Через экземпляр тоже работает\nclass A:\n    x = 10\n    @classmethod\n    def get_x(cls):\n        return cls.x\na = A()\nprint(a.get_x())  # → 10\n# Наследование + classmethod\nclass Animal:\n    @classmethod\n    def make(cls, name):\n        obj = cls.__new__(cls)\n        obj.name = name\n        return obj\nclass Cat(Animal):\n    pass\ncat = Cat.make('Whiskers')\nprint(type(cat).__name__, cat.name)  # → Cat Whiskers","version":null,"docs":"https://docs.python.org/3/reference/datamodel.html"},{"id":"dataclass","name":"dataclass","group":"ООП","subcat":"классы","cg":"oop","description":"@dataclass автоматически генерирует __init__, __repr__, __eq__. field() настраивает отдельные поля.","syntax":"from dataclasses import dataclass\n@dataclass\nclass Point:\n    x: float\n    y: float","examples":"from dataclasses import dataclass\n@dataclass\nclass Point:\n    x: float\n    y: float\np = Point(1.0, 2.0)\nprint(p)  # → Point(x=1.0, y=2.0)\nprint(p.x, p.y)  # → 1.0 2.0\n# __eq__ автоматически\nprint(Point(1,2) == Point(1,2))  # → True\nprint(Point(1,2) == Point(1,3))  # → False\nfrom dataclasses import dataclass, field\n@dataclass\nclass Inventory:\n    name: str\n    items: list = field(default_factory=list)\n    count: int = field(default=0, repr=False)\ninv = Inventory('store')\ninv.items.append('apple')\nprint(inv)  # → Inventory(name='store', items=['apple'])\n# frozen=True — неизменяемый\n@dataclass(frozen=True)\nclass ImmutablePoint:\n    x: float\n    y: float\nip = ImmutablePoint(1,2)\ntry:\n    ip.x = 5  # → FrozenInstanceError\nexcept Exception as e:\n    print(e)\n# __post_init__\n@dataclass\nclass Circle:\n    radius: float\n    area: float = field(init=False)\n    def __post_init__(self):\n        import math\n        self.area = math.pi * self.radius**2\nc = Circle(5)\nprint(round(c.area, 2))  # → 78.54\n# order=True — для сравнения\n@dataclass(order=True)\nclass Student:\n    grade: int\n    name: str\nstudents = [Student(85,'Bob'), Student(90,'Alice')]\nprint(sorted(students))  # → сортировка по grade\n# Наследование dataclass\n@dataclass\nclass Animal:\n    name: str\n    sound: str\n@dataclass\nclass Dog(Animal):\n    breed: str\nd = Dog('Rex', 'Woof', 'Lab')\nprint(d)  # → Dog(name='Rex', sound='Woof', breed='Lab')","version":null,"docs":"https://docs.python.org/3/reference/datamodel.html"},{"id":"__enter__-__exit__","name":"__enter__ / __exit__","group":"ООП","subcat":"контекст. менеджер","cg":"oop","description":"Контекстный менеджер (with-statement). __enter__ выполняется при входе, __exit__ — при выходе (в том числе при исключении).","syntax":"class CM:\n    def __enter__(self): return self\n    def __exit__(self, exc_type, exc_val, tb): ...","examples":"class ManagedResource:\n    def __enter__(self):\n        print('Opening resource')\n        return self\n    def __exit__(self, exc_type, exc_val, tb):\n        print('Closing resource')\n        return False  # не подавлять исключения\nwith ManagedResource() as r:\n    print('Using resource')  # → Opening / Using / Closing\nclass Timer:\n    import time as _time\n    def __enter__(self):\n        import time\n        self.start = time.time()\n        return self\n    def __exit__(self, *args):\n        import time\n        self.elapsed = time.time() - self.start\n        print(f'Elapsed: {self.elapsed:.4f}s')\nwith Timer() as t:\n    sum(range(10**6))  # → Elapsed: ...\nclass Transaction:\n    def __init__(self):\n        self.operations = []\n    def __enter__(self):\n        return self\n    def __exit__(self, exc_type, exc_val, tb):\n        if exc_type:\n            print('Rolling back!')\n            self.operations.clear()\n        else:\n            print('Committing:', self.operations)\n        return True  # подавить исключение\nwith Transaction() as tx:\n    tx.operations.append('insert')\n    tx.operations.append('update')  # → Committing: ['insert','update']\n# Подавление исключения (__exit__ возвращает True)\nclass Suppress:\n    def __init__(self, *exceptions):\n        self.exceptions = exceptions\n    def __enter__(self):\n        return self\n    def __exit__(self, exc_type, exc_val, tb):\n        return exc_type is not None and issubclass(exc_type, self.exceptions)\nwith Suppress(ZeroDivisionError):\n    x = 1/0  # → не падает!\nprint('After suppress')  # → After suppress\n# Использование contextlib\nfrom contextlib import contextmanager\n@contextmanager\ndef managed():\n    print('enter')\n    yield\n    print('exit')\nwith managed():\n    print('body')  # → enter / body / exit\n# Вложенные with\nclass A:\n    def __enter__(self): print('A enter'); return self\n    def __exit__(self, *a): print('A exit'); return False\nclass B:\n    def __enter__(self): print('B enter'); return self\n    def __exit__(self, *a): print('B exit'); return False\nwith A() as a, B() as b:\n    print('inside')  # → A enter / B enter / inside / B exit / A exit","version":null,"docs":"https://docs.python.org/3/reference/datamodel.html"},{"id":"__str__-__repr__","name":"__str__ / __repr__","group":"ООП","subcat":"магические методы","cg":"oop","description":"__str__ — читаемое представление для print(). __repr__ — отладочное, воспроизводимое. repr() вызывает __repr__.","syntax":"def __str__(self): return '...'\ndef __repr__(self): return '...'","examples":"class Point:\n    def __init__(self, x, y):\n        self.x = x; self.y = y\n    def __repr__(self):\n        return f'Point({self.x}, {self.y})'\n    def __str__(self):\n        return f'({self.x}, {self.y})'\np = Point(3, 4)\nprint(p)       # → (3, 4) — __str__\nprint(repr(p)) # → Point(3, 4) — __repr__\n# Если только __repr__ — используется и для str\nclass Vec:\n    def __init__(self, x, y):\n        self.x = x; self.y = y\n    def __repr__(self):\n        return f'Vec({self.x},{self.y})'\nprint(Vec(1,2))  # → Vec(1,2)\nclass Fraction:\n    def __init__(self, n, d):\n        self.n = n; self.d = d\n    def __str__(self):\n        return f'{self.n}/{self.d}'\n    def __repr__(self):\n        return f'Fraction({self.n}, {self.d})'\nf = Fraction(1, 3)\nprint(f)       # → 1/3\nprint(repr(f)) # → Fraction(1, 3)\n# В списках используется __repr__\np2 = Point(1, 2)\nprint([p2])  # → [Point(1, 2)]\nclass Temperature:\n    def __init__(self, c):\n        self.c = c\n    def __repr__(self):\n        return f'Temperature({self.c})'\n    def __str__(self):\n        return f'{self.c}°C'\nt = Temperature(100)\nprint(str(t), repr(t))  # → 100°C  Temperature(100)\n# f-string использует __str__\nprint(f'{Point(1,2)}')  # → (1, 2)\nprint(f'{Point(1,2)!r}')  # → Point(1, 2)","version":null,"docs":"https://docs.python.org/3/reference/datamodel.html"},{"id":"__len__-__getitem__-__setitem__-__contai","name":"__len__ / __getitem__ / __setitem__ / __contains__","group":"ООП","subcat":"магические методы","cg":"oop","description":"Магические методы для протокола последовательности/контейнера. Позволяют использовать len(), [], in.","syntax":"def __len__(self): ...\ndef __getitem__(self, idx): ...","examples":"class MyList:\n    def __init__(self, data):\n        self._data = list(data)\n    def __len__(self):\n        return len(self._data)\n    def __getitem__(self, idx):\n        return self._data[idx]\nml = MyList([1,2,3])\nprint(len(ml))   # → 3\nprint(ml[0])     # → 1\nprint(ml[-1])    # → 3\nclass FibSequence:\n    def __getitem__(self, n):\n        a, b = 0, 1\n        for _ in range(n):\n            a, b = b, a+b\n        return a\nfib = FibSequence()\nprint(fib[0], fib[5], fib[10])  # → 0 5 55\nclass MyDict:\n    def __init__(self):\n        self._data = {}\n    def __setitem__(self, key, val):\n        self._data[key] = val\n    def __getitem__(self, key):\n        return self._data[key]\nd = MyDict()\nd['x'] = 10\nprint(d['x'])  # → 10\nclass Bag:\n    def __init__(self, items):\n        self._items = list(items)\n    def __contains__(self, item):\n        return item in self._items\nb = Bag([1,2,3])\nprint(2 in b)  # → True\nprint(5 in b)  # → False\n# Срезы через __getitem__\nclass Sliceable:\n    def __init__(self, data):\n        self._data = data\n    def __getitem__(self, key):\n        return self._data[key]\ns = Sliceable([10,20,30,40,50])\nprint(s[1:3])  # → [20, 30]\n# Полный контейнер\nclass NumberSet:\n    def __init__(self, *nums):\n        self._nums = set(nums)\n    def __len__(self):\n        return len(self._nums)\n    def __contains__(self, n):\n        return n in self._nums\n    def __repr__(self):\n        return f'NumberSet({self._nums})'\nns = NumberSet(1,2,3,4,5)\nprint(len(ns), 3 in ns, 9 in ns)  # → 5 True False\n# __iter__ через __getitem__\nclass Range:\n    def __init__(self, n):\n        self.n = n\n    def __getitem__(self, i):\n        if i >= self.n:\n            raise IndexError\n        return i\nprint(list(Range(5)))  # → [0,1,2,3,4]","version":null,"docs":"https://docs.python.org/3/reference/datamodel.html"},{"id":"__add__-__mul__-__eq__-__lt__-и-оператор","name":"__add__ / __mul__ / __eq__ / __lt__ и операторные методы","group":"ООП","subcat":"магические методы","cg":"oop","description":"Перегрузка операторов. __add__(+), __sub__(-), __mul__(*), __eq__(==), __lt__(<), __le__(<=), __hash__, __neg__.","syntax":"def __add__(self, other): ...","examples":"class Vector:\n    def __init__(self, x, y):\n        self.x = x; self.y = y\n    def __add__(self, other):\n        return Vector(self.x+other.x, self.y+other.y)\n    def __mul__(self, scalar):\n        return Vector(self.x*scalar, self.y*scalar)\n    def __repr__(self):\n        return f'Vector({self.x},{self.y})'\nv1 = Vector(1,2); v2 = Vector(3,4)\nprint(v1+v2)  # → Vector(4,6)\nprint(v1*3)   # → Vector(3,6)\nclass Fraction:\n    def __init__(self, n, d):\n        from math import gcd\n        g = gcd(abs(n), abs(d))\n        self.n = n//g; self.d = d//g\n    def __add__(self, other):\n        return Fraction(self.n*other.d + other.n*self.d, self.d*other.d)\n    def __repr__(self):\n        return f'{self.n}/{self.d}'\nprint(Fraction(1,3)+Fraction(1,6))  # → 1/2\nclass MyStr:\n    def __init__(self, s):\n        self.s = s\n    def __add__(self, other):\n        return MyStr(self.s + other.s)\n    def __mul__(self, n):\n        return MyStr(self.s * n)\n    def __repr__(self):\n        return repr(self.s)\nprint(MyStr('hi')*3)  # → 'hihihi'\nclass Point:\n    def __init__(self, x, y):\n        self.x = x; self.y = y\n    def __eq__(self, other):\n        return self.x == other.x and self.y == other.y\n    def __lt__(self, other):\n        return (self.x**2+self.y**2) < (other.x**2+other.y**2)\npoints = [Point(3,4), Point(1,1), Point(0,5)]\nprint(sorted(points, key=lambda p: (p.x**2+p.y**2)))  # по расстоянию\nprint(Point(1,1) == Point(1,1))  # → True\nclass Temperature:\n    def __init__(self, c):\n        self.c = c\n    def __eq__(self, other):\n        return self.c == other.c\n    def __lt__(self, other):\n        return self.c < other.c\n    def __le__(self, other):\n        return self.c <= other.c\nt1 = Temperature(20); t2 = Temperature(30)\nprint(t1 < t2, t1 == t2)  # → True False\n# __neg__, __abs__\nclass Num:\n    def __init__(self, v):\n        self.v = v\n    def __neg__(self):\n        return Num(-self.v)\n    def __abs__(self):\n        return Num(abs(self.v))\n    def __repr__(self):\n        return f'Num({self.v})'\nprint(-Num(5))    # → Num(-5)\nprint(abs(Num(-3)))  # → Num(3)\n# __iadd__ (+=)\nclass Counter:\n    def __init__(self, n=0):\n        self.n = n\n    def __iadd__(self, other):\n        self.n += other\n        return self\n    def __repr__(self):\n        return f'Counter({self.n})'\nc = Counter(5)\nc += 3\nprint(c)  # → Counter(8)","version":null,"docs":"https://docs.python.org/3/reference/datamodel.html"},{"id":"методы-экземпляра","name":"Методы экземпляра","group":"ООП","subcat":"методы","cg":"oop","description":"Обычные методы класса. Первый параметр — self (ссылка на экземпляр). Могут читать и изменять состояние.","syntax":"def method(self, ...): ...","examples":"class Rectangle:\n    def __init__(self, w, h):\n        self.w = w\n        self.h = h\n    def area(self):\n        return self.w * self.h\n    def perimeter(self):\n        return 2 * (self.w + self.h)\nr = Rectangle(3, 4)\nprint(r.area())      # → 12\nprint(r.perimeter()) # → 14\nclass Stack:\n    def __init__(self):\n        self._data = []\n    def push(self, item):\n        self._data.append(item)\n        return self  # цепочка\n    def pop(self):\n        return self._data.pop()\n    def peek(self):\n        return self._data[-1]\ns = Stack()\ns.push(1).push(2).push(3)\nprint(s.pop())  # → 3\nclass Temperature:\n    def __init__(self, celsius):\n        self.celsius = celsius\n    def to_fahrenheit(self):\n        return self.celsius * 9/5 + 32\n    def to_kelvin(self):\n        return self.celsius + 273.15\nt = Temperature(100)\nprint(t.to_fahrenheit())  # → 212.0\nprint(t.to_kelvin())      # → 373.15\n# Метод вызывает другой метод\nclass Circle:\n    def __init__(self, r):\n        self.r = r\n    def area(self):\n        import math\n        return math.pi * self.r ** 2\n    def scale(self, factor):\n        self.r *= factor\n        return self.area()\nc = Circle(5)\nprint(c.scale(2))  # → 314.159...\nclass BankAccount:\n    def __init__(self, balance=0):\n        self.balance = balance\n    def deposit(self, amount):\n        self.balance += amount\n    def withdraw(self, amount):\n        if amount > self.balance:\n            raise ValueError('Insufficient funds')\n        self.balance -= amount\nacc = BankAccount(100)\nacc.deposit(50)\nacc.withdraw(30)\nprint(acc.balance)  # → 120\nclass WordCounter:\n    def __init__(self):\n        self._words = []\n    def add(self, text):\n        self._words.extend(text.split())\n    def count(self):\n        return len(self._words)\n    def most_common(self):\n        from collections import Counter\n        return Counter(self._words).most_common(3)\nwc = WordCounter()\nwc.add('the cat sat on the mat')\nprint(wc.count())  # → 6","version":null,"docs":"https://docs.python.org/3/reference/datamodel.html"},{"id":"staticmethod","name":"@staticmethod","group":"ООП","subcat":"методы","cg":"oop","description":"Статический метод. Не принимает self или cls. Просто функция внутри класса — логическая группировка.","syntax":"@staticmethod\ndef method(...): ...","examples":"class MathUtils:\n    @staticmethod\n    def add(a, b):\n        return a + b\n    @staticmethod\n    def multiply(a, b):\n        return a * b\nprint(MathUtils.add(3, 4))       # → 7\nprint(MathUtils.multiply(3, 4))  # → 12\nclass Validator:\n    @staticmethod\n    def is_email(s):\n        return '@' in s and '.' in s.split('@')[-1]\nprint(Validator.is_email('user@example.com'))  # → True\nprint(Validator.is_email('not-an-email'))       # → False\nclass Temperature:\n    @staticmethod\n    def celsius_to_fahrenheit(c):\n        return c * 9/5 + 32\n    @staticmethod\n    def fahrenheit_to_celsius(f):\n        return (f - 32) * 5/9\nprint(Temperature.celsius_to_fahrenheit(0))  # → 32.0\n# Вызов через экземпляр\nv = Validator()\nprint(v.is_email('a@b.com'))  # → True\nclass StringUtils:\n    @staticmethod\n    def is_palindrome(s):\n        s = s.lower().replace(' ', '')\n        return s == s[::-1]\nprint(StringUtils.is_palindrome('racecar'))  # → True\nprint(StringUtils.is_palindrome('hello'))    # → False","version":null,"docs":"https://docs.python.org/3/reference/datamodel.html"},{"id":"наследование","name":"Наследование","group":"ООП","subcat":"наследование","cg":"oop","description":"Дочерний класс наследует атрибуты и методы родительского. Переопределение методов — полиморфизм.","syntax":"class Child(Parent): ...","examples":"class Animal:\n    def __init__(self, name):\n        self.name = name\n    def speak(self):\n        return '...'\nclass Dog(Animal):\n    def speak(self):\n        return 'Woof!'\nclass Cat(Animal):\n    def speak(self):\n        return 'Meow!'\nfor a in [Dog('Rex'), Cat('Whiskers')]:\n    print(a.name, a.speak())  # → Rex Woof! / Whiskers Meow!\nprint(isinstance(Dog('x'), Animal))  # → True\nprint(isinstance(Dog('x'), Dog))    # → True\nprint(isinstance(Dog('x'), Cat))    # → False\nclass Shape:\n    def area(self):\n        raise NotImplementedError\nclass Rectangle(Shape):\n    def __init__(self, w, h):\n        self.w = w\n        self.h = h\n    def area(self):\n        return self.w * self.h\nprint(Rectangle(3, 4).area())  # → 12\n# Дочерний класс добавляет атрибуты\nclass Vehicle:\n    def __init__(self, brand):\n        self.brand = brand\nclass Car(Vehicle):\n    def __init__(self, brand, doors):\n        super().__init__(brand)\n        self.doors = doors\nc = Car('Toyota', 4)\nprint(c.brand, c.doors)  # → Toyota 4\n# issubclass\nprint(issubclass(Dog, Animal))  # → True\nprint(issubclass(Dog, Cat))     # → False\n# Наследование встроенных классов\nclass MyList(list):\n    def sum(self):\n        return sum(self)\nml = MyList([1,2,3,4])\nprint(ml.sum())  # → 10\nprint(ml[0])     # → 1\n# MRO — Method Resolution Order\nclass A:\n    def hello(self):\n        return 'A'\nclass B(A):\n    pass\nclass C(B):\n    pass\nprint(C().hello())  # → A (из A)\nprint(C.__mro__)  # → (C, B, A, object)\n# Переопределение с вызовом родителя\nclass Employee:\n    def __init__(self, name, salary):\n        self.name = name\n        self.salary = salary\n    def describe(self):\n        return f'{self.name}: {self.salary}'\nclass Manager(Employee):\n    def __init__(self, name, salary, dept):\n        super().__init__(name, salary)\n        self.dept = dept\n    def describe(self):\n        return super().describe() + f' [{self.dept}]'\nm = Manager('Alice', 80000, 'IT')\nprint(m.describe())  # → Alice: 80000 [IT]","version":null,"docs":"https://docs.python.org/3/reference/datamodel.html"},{"id":"super","name":"super()","group":"ООП","subcat":"наследование","cg":"oop","description":"Возвращает прокси-объект родительского класса. Используется для вызова методов родителя без явного указания имени.","syntax":"super().__init__(...)\nsuper().method(...)","examples":"class Animal:\n    def __init__(self, name):\n        self.name = name\nclass Dog(Animal):\n    def __init__(self, name, breed):\n        super().__init__(name)\n        self.breed = breed\nd = Dog('Rex', 'Lab')\nprint(d.name, d.breed)  # → Rex Lab\nclass Base:\n    def greet(self):\n        return 'Hello from Base'\nclass Child(Base):\n    def greet(self):\n        return super().greet() + ' and Child'\nprint(Child().greet())  # → Hello from Base and Child\n# super() с MRO\nclass A:\n    def method(self):\n        return 'A'\nclass B(A):\n    def method(self):\n        return 'B+' + super().method()\nclass C(B):\n    def method(self):\n        return 'C+' + super().method()\nprint(C().method())  # → C+B+A\nclass LoggedList(list):\n    def append(self, item):\n        print(f'Adding {item}')\n        super().append(item)\nll = LoggedList()\nll.append(1)  # → Adding 1\nprint(ll)     # → [1]\n# Множественное наследование + super\nclass A:\n    def __init__(self):\n        print('A.__init__')\nclass B(A):\n    def __init__(self):\n        super().__init__()\n        print('B.__init__')\nclass C(A):\n    def __init__(self):\n        super().__init__()\n        print('C.__init__')\nclass D(B, C):\n    def __init__(self):\n        super().__init__()\n        print('D.__init__')\nD()  # → A / C / B / D (по MRO)\n# super() без аргументов (Python 3)\nclass Shape:\n    def area(self):\n        return 0\nclass Rectangle(Shape):\n    def __init__(self, w, h):\n        self.w = w; self.h = h\n    def area(self):\n        return self.w * self.h\nclass Square(Rectangle):\n    def __init__(self, side):\n        super().__init__(side, side)\nprint(Square(5).area())  # → 25","version":null,"docs":"https://docs.python.org/3/reference/datamodel.html"},{"id":"множественное-наследование-mro","name":"Множественное наследование / MRO","group":"ООП","subcat":"наследование","cg":"oop","description":"Python поддерживает множественное наследование. Порядок разрешения методов (MRO) — C3-линеаризация.","syntax":"class C(A, B): ...\nC.__mro__","examples":"class A:\n    def hello(self):\n        return 'A'\nclass B:\n    def hello(self):\n        return 'B'\nclass C(A, B):\n    pass\nprint(C().hello())  # → A (первый в MRO)\nprint(C.__mro__)  # → (C, A, B, object)\n# Diamond problem\nclass Base:\n    def method(self):\n        return 'Base'\nclass Left(Base):\n    def method(self):\n        return 'Left+' + super().method()\nclass Right(Base):\n    def method(self):\n        return 'Right+' + super().method()\nclass Diamond(Left, Right):\n    pass\nprint(Diamond().method())  # → Left+Right+Base (каждый Base вызывается раз!)\nprint(Diamond.__mro__)  # → (Diamond, Left, Right, Base, object)\n# Mixin pattern\nclass JSONMixin:\n    def to_json(self):\n        import json\n        return json.dumps(self.__dict__)\nclass LogMixin:\n    def log(self):\n        print(f'{type(self).__name__}: {self.__dict__}')\nclass User(JSONMixin, LogMixin):\n    def __init__(self, name, age):\n        self.name = name\n        self.age = age\nu = User('Alice', 30)\nprint(u.to_json())  # → {\"name\": \"Alice\", \"age\": 30}\n# Проверка MRO\nclass X: pass\nclass Y(X): pass\nclass Z(X): pass\nclass W(Y, Z): pass\nprint([c.__name__ for c in W.__mro__])  # → ['W','Y','Z','X','object']\n# super() в множественном наследовании\nclass A:\n    def f(self): return ['A']\nclass B(A):\n    def f(self): return ['B'] + super().f()\nclass C(A):\n    def f(self): return ['C'] + super().f()\nclass D(B, C):\n    def f(self): return ['D'] + super().f()\nprint(D().f())  # → ['D','B','C','A']","version":null,"docs":"https://docs.python.org/3/reference/datamodel.html"},{"id":"полиморфизм","name":"Полиморфизм","group":"ООП","subcat":"полиморфизм","cg":"oop","description":"Один интерфейс — разные реализации. В Python достигается переопределением методов и duck typing.","syntax":"for obj in objects:\n    obj.method()  # разные реализации","examples":"class Shape:\n    def area(self):\n        raise NotImplementedError\nclass Circle:\n    def __init__(self, r):\n        self.r = r\n    def area(self):\n        import math\n        return math.pi * self.r**2\nclass Rectangle:\n    def __init__(self, w, h):\n        self.w = w; self.h = h\n    def area(self):\n        return self.w * self.h\nshapes = [Circle(3), Rectangle(4,5)]\nfor s in shapes:\n    print(round(s.area(), 2))  # → 28.27 / 20\n# Duck typing\nclass Dog:\n    def speak(self):\n        return 'Woof!'\nclass Cat:\n    def speak(self):\n        return 'Meow!'\nclass Duck:\n    def speak(self):\n        return 'Quack!'\nfor animal in [Dog(), Cat(), Duck()]:\n    print(animal.speak())  # → Woof! Meow! Quack!\n# Общая функция — полиморфный вызов\ndef make_sound(animal):\n    print(animal.speak())\nmake_sound(Dog())   # → Woof!\nmake_sound(Duck())  # → Quack!\n# Перегрузка операторов — полиморфизм\nclass Vector:\n    def __init__(self, x):\n        self.x = x\n    def __add__(self, other):\n        return Vector(self.x + other.x)\nclass Matrix:\n    def __init__(self, data):\n        self.data = data\n    def __add__(self, other):\n        return Matrix([[a+b for a,b in zip(r1,r2)]\n                       for r1,r2 in zip(self.data, other.data)])\nprint((Vector(1)+Vector(2)).x)  # → 3\n# isinstance + полиморфизм\ndef describe(obj):\n    if isinstance(obj, list):\n        return f'list of {len(obj)}'\n    elif isinstance(obj, str):\n        return f'string: {obj!r}'\n    else:\n        return f'other: {type(obj).__name__}'\nprint(describe([1,2,3]))  # → list of 3\nprint(describe('hi'))     # → string: 'hi'","version":null,"docs":"https://docs.python.org/3/reference/datamodel.html"},{"id":"contextlib.suppress","name":"contextlib.suppress","group":"Исключения","subcat":"contextlib","cg":"exc","description":"Подавляет указанные исключения. Аналог try/except pass. Читаемее и лаконичнее.","syntax":"from contextlib import suppress\nwith suppress(FileNotFoundError):\n    os.remove('file')","examples":"from contextlib import suppress\nwith suppress(FileNotFoundError):\n    import os\n    os.remove('/nonexistent_file')  # → тихо игнорируется\nprint('Continued normally')  # → Continued normally\nwith suppress(KeyError):\n    d = {'a': 1}\n    print(d['missing'])  # → подавлено\nprint('ok')  # → ok\nwith suppress(ZeroDivisionError, ValueError):\n    x = 1/0  # → подавлено\n# Сравни с try/except pass\nimport os\ntry:\n    os.remove('no_file')\nexcept FileNotFoundError:\n    pass  # эквивалент suppress","version":null,"docs":"https://docs.python.org/3/library/exceptions.html"},{"id":"raise","name":"raise","group":"Исключения","subcat":"генерация","cg":"exc","description":"Генерирует исключение вручную. raise from — цепочка исключений. re-raise — raise без аргументов.","syntax":"raise ValueError('msg')\nraise RuntimeError('msg') from original","examples":"def check_age(age):\n    if age < 0:\n        raise ValueError(f'Age cannot be negative: {age}')\n    return age\ntry:\n    check_age(-1)\nexcept ValueError as e:\n    print(e)  # → Age cannot be negative: -1\n# raise from\ntry:\n    int('abc')\nexcept ValueError as e:\n    raise RuntimeError('conversion failed') from e\n# Re-raise\ndef safe():\n    try:\n        return 1/0\n    except ZeroDivisionError:\n        print('caught, re-raising')\n        raise  # передаёт исходное исключение\ntry:\n    safe()\nexcept ZeroDivisionError:\n    print('handled')  # → caught / handled\n# raise с кастомным классом\nclass ValidationError(ValueError):\n    pass\ndef validate(x):\n    if x < 0:\n        raise ValidationError(f'Invalid value: {x}')\ntry:\n    validate(-5)\nexcept ValidationError as e:\n    print(e)  # → Invalid value: -5\n# raise без аргументов в except\ntry:\n    try:\n        1/0\n    except ZeroDivisionError:\n        raise  # пробрасываем\nexcept ZeroDivisionError:\n    print('outer caught')  # → outer caught\n# Цепочка __cause__ и __context__\ntry:\n    raise ValueError('first') from TypeError('cause')\nexcept ValueError as e:\n    print(type(e.__cause__).__name__)  # → TypeError","version":null,"docs":"https://docs.python.org/3/library/exceptions.html"},{"id":"иерархия-исключений","name":"Иерархия исключений","group":"Исключения","subcat":"иерархия","cg":"exc","description":"Встроенные исключения образуют иерархию. BaseException → Exception → стандартные исключения.","syntax":"BaseException\n  SystemExit, KeyboardInterrupt\n  Exception\n    ValueError, TypeError, IndexError...","examples":"try:\n    int('abc')\nexcept ValueError as e:\n    print(f'ValueError: {e}')  # → invalid literal...\ntry:\n    x = [1,2][5]\nexcept IndexError as e:\n    print(f'IndexError: {e}')  # → list index out of range\ntry:\n    d = {}\n    d['missing']\nexcept KeyError as e:\n    print(f'KeyError: {e}')  # → 'missing'\ntry:\n    'str' + 1\nexcept TypeError as e:\n    print(f'TypeError: {e}')  # → can only concatenate...\ntry:\n    1 / 0\nexcept ZeroDivisionError as e:\n    print(f'ZeroDivisionError: {e}')  # → division by zero\ntry:\n    open('/nonexistent_file')\nexcept FileNotFoundError as e:\n    print(f'FileNotFoundError: {e}')\ntry:\n    None.attr\nexcept AttributeError as e:\n    print(f'AttributeError: {e}')  # → 'NoneType' object has no attribute...","version":null,"docs":"https://docs.python.org/3/library/exceptions.html"},{"id":"try-except","name":"try / except","group":"Исключения","subcat":"обработка","cg":"exc","description":"Блок try содержит код, который может вызвать исключение. except перехватывает его. else — если исключения не было. finally — всегда.","syntax":"try:\n    ...\nexcept ErrorType:\n    ...","examples":"try:\n    x = 1 / 0\nexcept ZeroDivisionError:\n    print('division by zero')  # → division by zero\ntry:\n    int('abc')\nexcept ValueError as e:\n    print(e)  # → invalid literal for int()...\n# Несколько except\ntry:\n    lst = [1,2,3]\n    print(lst[10])\nexcept IndexError:\n    print('index error')  # → index error\nexcept Exception as e:\n    print('other:', e)\n# else — если исключений не было\ntry:\n    result = 10 / 2\nexcept ZeroDivisionError:\n    print('error')\nelse:\n    print(result)  # → 5.0\n# finally — всегда выполняется\ntry:\n    f = open('/nonexistent')\nexcept FileNotFoundError:\n    print('not found')\nfinally:\n    print('always')  # → not found / always\n# Перехват нескольких типов в одном except\ntry:\n    x = int(None)\nexcept (TypeError, ValueError) as e:\n    print(f'Caught: {e}')  # → Caught: ...\n# Базовый Exception — ловит всё (кроме SystemExit и KeyboardInterrupt)\ntry:\n    raise RuntimeError('oops')\nexcept Exception as e:\n    print(type(e).__name__, e)  # → RuntimeError oops","version":null,"docs":"https://docs.python.org/3/library/exceptions.html"},{"id":"finally","name":"finally","group":"Исключения","subcat":"обработка","cg":"exc","description":"Блок finally выполняется всегда — независимо от того, было ли исключение. Используется для освобождения ресурсов.","syntax":"try:\n    ...\nfinally:\n    cleanup()","examples":"def read_file(path):\n    f = None\n    try:\n        f = open(path)\n        return f.read()\n    except FileNotFoundError:\n        return None\n    finally:\n        if f:\n            f.close()\n        print('File handle closed')  # → всегда\ndef divide(a, b):\n    try:\n        return a / b\n    finally:\n        print('division attempted')\nprint(divide(10, 2))  # → division attempted / 5.0\n# finally при return\ndef func():\n    try:\n        return 'try'\n    finally:\n        return 'finally'  # перекрывает return из try!\nprint(func())  # → finally\n# finally при raise\ndef func2():\n    try:\n        raise ValueError('oops')\n    finally:\n        print('cleanup')  # → cleanup (до распространения исключения)\ntry:\n    func2()\nexcept ValueError:\n    pass\n# Классический паттерн с ресурсом\nimport sqlite3\nconn = None\ntry:\n    conn = sqlite3.connect(':memory:')\nexcept Exception as e:\n    print(e)\nfinally:\n    if conn:\n        conn.close()\n    print('Connection closed')  # → Connection closed","version":null,"docs":"https://docs.python.org/3/library/exceptions.html"},{"id":"else-в-try-except","name":"else в try-except","group":"Исключения","subcat":"обработка","cg":"exc","description":"Блок else выполняется, только если в try не возникло исключения. Отделяет «счастливый путь» от обработки ошибок.","syntax":"try:\n    ...\nexcept Error:\n    ...\nelse:\n    # только при успехе","examples":"try:\n    result = int('42')\nexcept ValueError:\n    print('error')\nelse:\n    print(f'success: {result}')  # → success: 42\ndef safe_open(path):\n    try:\n        f = open(path)\n    except FileNotFoundError:\n        return None\n    else:\n        data = f.read()\n        f.close()\n        return data\n# else + finally\ntry:\n    x = 10 / 2\nexcept ZeroDivisionError:\n    print('zero division')\nelse:\n    print(f'result: {x}')  # → result: 5.0\nfinally:\n    print('done')  # → done\nimport json\ndef parse(s):\n    try:\n        data = json.loads(s)\n    except json.JSONDecodeError:\n        print('invalid JSON')\n    else:\n        return data\nprint(parse('{\"a\":1}'))  # → {'a':1}\n# else vs перемещение кода после try\n# В else — только код, который НЕ должен вызывать то же исключение\ntry:\n    n = int(input('Enter number: ') if False else '5')\nexcept ValueError:\n    print('not a number')\nelse:\n    print(n * 2)  # → 10","version":null,"docs":"https://docs.python.org/3/library/exceptions.html"},{"id":"пользовательские-исключения","name":"Пользовательские исключения","group":"Исключения","subcat":"пользовательские","cg":"exc","description":"Создавай классы исключений, наследуясь от Exception. Можно добавлять атрибуты и иерархию.","syntax":"class MyError(Exception):\n    pass","examples":"class AppError(Exception):\n    pass\nclass DatabaseError(AppError):\n    pass\nclass NetworkError(AppError):\n    pass\ntry:\n    raise DatabaseError('Connection failed')\nexcept AppError as e:\n    print(type(e).__name__, e)  # → DatabaseError Connection failed\nclass ValidationError(ValueError):\n    def __init__(self, field, message):\n        self.field = field\n        super().__init__(f'{field}: {message}')\ntry:\n    raise ValidationError('email', 'invalid format')\nexcept ValidationError as e:\n    print(e.field, e)  # → email  email: invalid format\nclass HttpError(Exception):\n    def __init__(self, status_code, message):\n        self.status_code = status_code\n        super().__init__(f'HTTP {status_code}: {message}')\nclass NotFoundError(HttpError):\n    def __init__(self, url):\n        super().__init__(404, f'{url} not found')\ntry:\n    raise NotFoundError('/api/users')\nexcept HttpError as e:\n    print(e.status_code, e)  # → 404 HTTP 404: /api/users not found\n# Иерархия ошибок\nclass PaymentError(Exception): pass\nclass InsufficientFundsError(PaymentError):\n    def __init__(self, amount, balance):\n        self.shortage = amount - balance\n        super().__init__(f'Need {self.shortage} more')\ntry:\n    raise InsufficientFundsError(100, 60)\nexcept InsufficientFundsError as e:\n    print(e, e.shortage)  # → Need 40 more  40\n# raise ... from\nclass ServiceError(Exception): pass\ntry:\n    try:\n        int('abc')\n    except ValueError as e:\n        raise ServiceError('Parse failed') from e\nexcept ServiceError as e:\n    print(e)                    # → Parse failed\n    print(type(e.__cause__))   # → <class 'ValueError'>\n# repr дефолтный\nclass SimpleError(Exception):\n    pass\ne = SimpleError('something went wrong')\nprint(str(e))   # → something went wrong\nprint(repr(e))  # → SimpleError('something went wrong')","version":null,"docs":"https://docs.python.org/3/library/exceptions.html"},{"id":"assert","name":"assert","group":"Исключения","subcat":"проверка","cg":"exc","description":"Утверждение — проверяет условие и вызывает AssertionError при False. Используется для отладки и тестов. Отключается с -O.","syntax":"assert condition, 'message'","examples":"def divide(a, b):\n    assert b != 0, 'Denominator must not be zero'\n    return a / b\nprint(divide(10, 2))  # → 5.0\ntry:\n    divide(1, 0)\nexcept AssertionError as e:\n    print(e)  # → Denominator must not be zero\ndef get_positive(n):\n    assert isinstance(n, int) and n > 0, f'Expected positive int, got {n!r}'\n    return n\nprint(get_positive(5))  # → 5\ndef test_add():\n    assert 1 + 1 == 2\n    assert 'hello'.upper() == 'HELLO'\n    assert len([1,2,3]) == 3\ntest_add()  # → OK\n# assert с коллекцией\ndef first(lst):\n    assert len(lst) > 0, 'List is empty'\n    return lst[0]\nprint(first([10,20]))  # → 10\n# ВАЖНО: assert отключается при python -O\n# Не используй для валидации входных данных в продакшн!\nx = 10\nassert x > 0  # только для разработки","version":null,"docs":"https://docs.python.org/3/library/exceptions.html"},{"id":"csv","name":"csv","group":"Файлы и I_O","subcat":"csv","cg":"op","description":"Модуль csv — чтение и запись CSV-файлов. reader/writer для строк, DictReader/DictWriter для словарей.","syntax":"import csv\ncsv.reader(f)\ncsv.writer(f)","examples":"import csv, io\n# writer\noutput = io.StringIO()\nwriter = csv.writer(output)\nwriter.writerow(['name','age','city'])\nwriter.writerow(['Alice',30,'Moscow'])\nwriter.writerow(['Bob',25,'SPb'])\nprint(output.getvalue())  # → CSV строки\n# reader\noutput.seek(0)\nreader = csv.reader(output)\nfor row in reader:\n    print(row)\n# DictWriter\noutput2 = io.StringIO()\nfields = ['name','age']\nw = csv.DictWriter(output2, fieldnames=fields)\nw.writeheader()\nw.writerow({'name':'Alice','age':30})\nprint(output2.getvalue())\n# DictReader\noutput2.seek(0)\nfor row in csv.DictReader(output2):\n    print(row)  # → OrderedDict/dict\n# Запись в файл\nwith open('/tmp/data.csv','w',newline='',encoding='utf-8') as f:\n    w = csv.writer(f)\n    w.writerows([['a',1],['b',2]])\n# Чтение с другим разделителем\ndata = 'a;b;c\\n1;2;3'\nfor row in csv.reader(io.StringIO(data), delimiter=';'):\n    print(row)  # → ['a','b','c'] / ['1','2','3']\n# Настройка quoting\noutput3 = io.StringIO()\nw2 = csv.writer(output3, quoting=csv.QUOTE_ALL)\nw2.writerow(['hello world', '42', 'a,b'])\nprint(output3.getvalue())","version":null,"docs":"https://docs.python.org/3/library/functions.html#open"},{"id":"json","name":"json","group":"Файлы и I_O","subcat":"json","cg":"op","description":"Сериализация/десериализация JSON. dumps/loads — строки. dump/load — файлы. Поддерживает dict, list, str, int, float, bool, None.","syntax":"import json\njson.dumps(obj)\njson.loads(s)","examples":"import json\ndata = {'name':'Alice','age':30,'langs':['Python','Rust']}\ns = json.dumps(data)\nprint(s)  # → {\"name\": \"Alice\", \"age\": 30, ...}\n# indent для форматирования\nprint(json.dumps(data, indent=2))  # → красивый JSON\n# loads — из строки\nparsed = json.loads('{\"x\":1,\"y\":[1,2,3]}')\nprint(parsed, type(parsed))  # → dict\n# dump/load — через файл\nwith open('/tmp/data.json','w') as f:\n    json.dump(data, f, indent=2)\nwith open('/tmp/data.json') as f:\n    loaded = json.load(f)\nprint(loaded['name'])  # → Alice\n# ensure_ascii=False — для кириллицы\nd2 = {'имя':'Алиса'}\nprint(json.dumps(d2, ensure_ascii=False))  # → {\"имя\": \"Алиса\"}\n# JSONDecodeError\ntry:\n    json.loads('invalid')\nexcept json.JSONDecodeError as e:\n    print(e)  # → Expecting value...\n# Кастомный default для нестандартных типов\nfrom datetime import date\ndef default(obj):\n    if isinstance(obj, date):\n        return obj.isoformat()\n    raise TypeError\nprint(json.dumps({'date': date(2024,1,1)}, default=default))  # → {\"date\":\"2024-01-01\"}\n# sort_keys\nprint(json.dumps({'b':2,'a':1}, sort_keys=True))  # → {\"a\": 1, \"b\": 2}","version":null,"docs":"https://docs.python.org/3/library/functions.html#open"},{"id":"os","name":"os","group":"Файлы и I_O","subcat":"os","cg":"op","description":"Модуль os — интерфейс к операционной системе. Работа с файлами, директориями, переменными окружения.","syntax":"import os\nos.getcwd()\nos.listdir()\nos.path.join()","examples":"import os\nprint(os.getcwd())  # → текущая директория\nfiles = os.listdir('/tmp')\nprint(files[:3])  # → список файлов\n# path.join — кроссплатформенное соединение путей\npath = os.path.join('/tmp', 'subdir', 'file.txt')\nprint(path)  # → /tmp/subdir/file.txt\n# path.exists / is_file / is_dir\nprint(os.path.exists('/tmp'))     # → True\nprint(os.path.isfile('/tmp'))     # → False\nprint(os.path.isdir('/tmp'))      # → True\n# mkdir / makedirs / remove\nos.makedirs('/tmp/test_os/sub', exist_ok=True)\nprint(os.path.isdir('/tmp/test_os/sub'))  # → True\n# environ\nhome = os.environ.get('HOME', 'unknown')\nprint(home)  # → /home/user или unknown\n# os.walk — рекурсивный обход\nfor root, dirs, files in os.walk('/tmp/test_os'):\n    print(root, dirs, files)","version":null,"docs":"https://docs.python.org/3/library/functions.html#open"},{"id":"pathlib.path","name":"pathlib.Path","group":"Файлы и I_O","subcat":"pathlib","cg":"op","description":"Объектно-ориентированный API для работы с путями файловой системы. Кроссплатформенный.","syntax":"from pathlib import Path\np = Path('/some/path')","examples":"from pathlib import Path\np = Path('/tmp')\nprint(p.exists())   # → True\nprint(p.is_dir())   # → True\nprint(p.is_file())  # → False\n# Создание пути\nf = Path('/tmp') / 'test' / 'file.txt'\nprint(f)        # → /tmp/test/file.txt\nprint(f.parent) # → /tmp/test\nprint(f.name)   # → file.txt\nprint(f.stem)   # → file\nprint(f.suffix) # → .txt\n# Чтение и запись\ntest_path = Path('/tmp/pathlib_test.txt')\ntest_path.write_text('Hello from pathlib!', encoding='utf-8')\nprint(test_path.read_text())  # → Hello from pathlib!\n# glob\ntmp = Path('/tmp')\ntxt_files = list(tmp.glob('*.txt'))\nprint(len(txt_files), 'txt files')\n# mkdir\nnew_dir = Path('/tmp/new_test_dir')\nnew_dir.mkdir(exist_ok=True)\nprint(new_dir.exists())  # → True\n# iterdir\nfor item in Path('/tmp').iterdir():\n    if item.is_file():\n        pass  # перебираем файлы\n# stat и размер\nf2 = Path('/tmp/pathlib_test.txt')\nprint(f2.stat().st_size)  # → размер в байтах","version":null,"docs":"https://docs.python.org/3/library/functions.html#open"},{"id":"pickle","name":"pickle","group":"Файлы и I_O","subcat":"pickle","cg":"op","description":"Сериализация Python-объектов в бинарный формат. Сохраняет произвольные объекты. Не безопасно для ненадёжных данных!","syntax":"import pickle\npickle.dump(obj, f)\npickle.load(f)","examples":"import pickle\ndata = {'key': [1,2,3], 'val': (4,5)}\nwith open('/tmp/data.pkl','wb') as f:\n    pickle.dump(data, f)\nwith open('/tmp/data.pkl','rb') as f:\n    loaded = pickle.load(f)\nprint(loaded)  # → {'key':[1,2,3],'val':(4,5)}\n# dumps/loads — в bytes\nbytes_data = pickle.dumps([1,'hello',3.14])\nprint(bytes_data[:10])  # → бинарные данные\nprint(pickle.loads(bytes_data))  # → [1,'hello',3.14]\n# Сериализация объекта класса\nclass Point:\n    def __init__(self,x,y): self.x=x;self.y=y\n    def __repr__(self): return f'Point({self.x},{self.y})'\np = Point(1,2)\nbytes_p = pickle.dumps(p)\nprint(pickle.loads(bytes_p))  # → Point(1,2)\n# Протоколы\nprint(pickle.HIGHEST_PROTOCOL)  # → 5\nbytes2 = pickle.dumps([1,2,3], protocol=2)\nprint(pickle.loads(bytes2))  # → [1,2,3]\n# ВНИМАНИЕ: pickle небезопасен для чужих данных!\n# Никогда не делай pickle.load() из ненадёжного источника!","version":null,"docs":"https://docs.python.org/3/library/functions.html#open"},{"id":"write-writelines","name":"write() / writelines()","group":"Файлы и I_O","subcat":"запись","cg":"op","description":"write(str) — записывает строку. writelines(iterable) — записывает список строк (без автоматических переносов).","syntax":"f.write('text')\nf.writelines(['a','b'])","examples":"with open('/tmp/out.txt','w') as f:\n    f.write('Hello')\n    f.write('\\nWorld')\n# writelines\nlines = ['line1\\n','line2\\n','line3\\n']\nwith open('/tmp/out2.txt','w') as f:\n    f.writelines(lines)\n# Запись с генератором\nwith open('/tmp/out3.txt','w') as f:\n    f.writelines(f'{i}\\n' for i in range(5))\n# Число символов, записанных write()\nwith open('/tmp/out.txt','w') as f:\n    n = f.write('Hello World')\nprint(n)  # → 11\n# Бинарная запись\nwith open('/tmp/bytes.bin','wb') as f:\n    f.write(b'\\xff\\xfe\\x00\\x01')\nprint('binary written')","version":null,"docs":"https://docs.python.org/3/library/functions.html#open"},{"id":"open","name":"open()","group":"Файлы и I_O","subcat":"открытие","cg":"op","description":"Открывает файл. Режимы: r (чтение), w (запись, перезапись), a (добавление), x (создание), b (бинарный). Используй with.","syntax":"open(path, mode='r', encoding=None)","examples":"# Чтение текстового файла\nwith open('/etc/hostname', 'r', encoding='utf-8') as f:\n    content = f.read()\nprint(content.strip())  # → hostname\n# Запись файла\nwith open('/tmp/test.txt', 'w', encoding='utf-8') as f:\n    f.write('Hello, World!')\n# Добавление к файлу\nwith open('/tmp/test.txt', 'a') as f:\n    f.write('\\nSecond line')\n# Бинарный режим\nwith open('/tmp/test.bin', 'wb') as f:\n    f.write(bytes([0,1,2,3]))\nwith open('/tmp/test.bin', 'rb') as f:\n    print(f.read())  # → b'\\x00\\x01\\x02\\x03'\n# Создание нового файла (x — ошибка если существует)\nimport os\ntry:\n    with open('/tmp/new_file.txt', 'x') as f:\n        f.write('new')\nexcept FileExistsError:\n    pass\n# С pathlib\nfrom pathlib import Path\npath = Path('/tmp/test.txt')\nwith path.open('r') as f:\n    print(f.readline())  # → Hello, World!\n# encoding=utf-8 обязателен для портируемости\nwith open('/tmp/test.txt', 'r', encoding='utf-8') as f:\n    for line in f:\n        print(line.strip())","version":null,"docs":"https://docs.python.org/3/library/functions.html#open"},{"id":"stdin-stdout","name":"stdin / stdout","group":"Файлы и I_O","subcat":"потоки","cg":"op","description":"sys.stdin — стандартный ввод. sys.stdout — стандартный вывод. Используются для потокового ввода/вывода.","syntax":"import sys\nfor line in sys.stdin: ...\nprint(..., file=sys.stdout)","examples":"import sys\n# Чтение из stdin построчно\n# echo 'hello' | python script.py\n# for line in sys.stdin:\n#     print(line.strip())\nprint('stdin demo skipped')  # → не интерактивный режим\n# print в stderr\nprint('Error message', file=sys.stderr)\n# Перенаправление stdout\nimport io\nbuffer = io.StringIO()\nsys.stdout = buffer\nprint('captured')\nsys.stdout = sys.__stdout__\nprint('got:', buffer.getvalue())  # → got: captured\\n\n# input() — высокоуровневый stdin\nname = input('Name: ') if False else 'Alice'  # skip interactive\nprint(f'Hello, {name}')  # → Hello, Alice\n# Чтение всего stdin\n# data = sys.stdin.read()  # в неинтерактивном режиме\n# Строки из stdin\nimport io\nfake_stdin = io.StringIO('line1\\nline2\\nline3')\nfor line in fake_stdin:\n    print(line.strip())","version":null,"docs":"https://docs.python.org/3/library/functions.html#open"},{"id":"read-readline-readlines","name":"read() / readline() / readlines()","group":"Файлы и I_O","subcat":"чтение","cg":"op","description":"read() — весь файл строкой. readline() — одна строка. readlines() — список строк.","syntax":"f.read()\nf.readline()\nf.readlines()","examples":"# Создадим файл для примеров\nwith open('/tmp/demo.txt','w') as f:\n    f.write('line1\\nline2\\nline3\\n')\nwith open('/tmp/demo.txt') as f:\n    content = f.read()\nprint(repr(content))  # → 'line1\\nline2\\nline3\\n'\nwith open('/tmp/demo.txt') as f:\n    first = f.readline()\n    second = f.readline()\nprint(first, second)  # → line1\\n  line2\\n\nwith open('/tmp/demo.txt') as f:\n    lines = f.readlines()\nprint(lines)  # → ['line1\\n','line2\\n','line3\\n']\n# read(n) — n байт\nwith open('/tmp/demo.txt') as f:\n    chunk = f.read(5)\nprint(chunk)  # → line1\n# Убрать \\n\nwith open('/tmp/demo.txt') as f:\n    lines = [l.rstrip() for l in f.readlines()]\nprint(lines)  # → ['line1','line2','line3']","version":null,"docs":"https://docs.python.org/3/library/functions.html#open"},{"id":"итерация-по-файлу","name":"Итерация по файлу","group":"Файлы и I_O","subcat":"чтение","cg":"op","description":"Файловый объект — итерируемый. Каждая итерация возвращает строку. Эффективно для больших файлов.","syntax":"for line in f:\n    ...","examples":"with open('/tmp/demo.txt') as f:\n    for line in f:\n        print(line.strip())  # → line1 / line2 / line3\n# Фильтрация строк\nwith open('/tmp/demo.txt') as f:\n    lines = [l.strip() for l in f if l.strip()]\nprint(lines)  # → ['line1','line2','line3']\n# Подсчёт строк\nwith open('/tmp/demo.txt') as f:\n    count = sum(1 for _ in f)\nprint(count)  # → 3\n# Первые N строк\nwith open('/tmp/demo.txt') as f:\n    head = [next(f) for _ in range(2)]\nprint([l.strip() for l in head])  # → ['line1','line2']\n# enumerate для нумерации строк\nwith open('/tmp/demo.txt') as f:\n    for i, line in enumerate(f, 1):\n        print(i, line.strip())","version":null,"docs":"https://docs.python.org/3/library/functions.html#open"},{"id":"classmethod-1","name":"classmethod","group":"Встроенные функции","subcat":"ООП","cg":"builtin","description":"Дескриптор для создания метода класса. Обычно используется как @classmethod.","syntax":"@classmethod\ndef f(cls): ...","examples":"class C:\n    x = 10\n    @classmethod\n    def get_x(cls): return cls.x\nprint(C.get_x())  # → 10\nclass D(C): x = 20\nprint(D.get_x())  # → 20\nprint(type(C.__dict__['get_x']))  # → classmethod\nc = C(); print(c.get_x())  # → 10\nprint(C.get_x.__func__)  # → функция","version":null,"docs":"https://docs.python.org/3/library/functions.html#classmethod"},{"id":"delattr","name":"delattr","group":"Встроенные функции","subcat":"ООП","cg":"builtin","description":"Удаляет атрибут объекта. Эквивалент del obj.attr.","syntax":"delattr(object, name)","examples":"class A:\n    x = 1\n    def __init__(self): self.y = 2\na = A()\ndelattr(a,'y')\nprint(hasattr(a,'y'))  # → False\ndelattr(A,'x')\nprint(hasattr(A,'x'))  # → False\ntry:\n    delattr(a,'z')\nexcept AttributeError as e: print(e)","version":null,"docs":"https://docs.python.org/3/library/functions.html#delattr"},{"id":"getattr","name":"getattr","group":"Встроенные функции","subcat":"ООП","cg":"builtin","description":"Получает атрибут объекта по имени. Поддерживает default.","syntax":"getattr(object, name[, default])","examples":"class A:\n    x = 42\na = A()\nprint(getattr(a,'x'))  # → 42\nprint(getattr(a,'y',None))  # → None\ngetattr([1,2,3],'append')(4)  # → [1,2,3,4]\nprint(getattr('hello','upper')())  # → HELLO\nname = 'x'; print(getattr(a, name))  # → 42","version":null,"docs":"https://docs.python.org/3/library/functions.html#getattr"},{"id":"hasattr","name":"hasattr","group":"Встроенные функции","subcat":"ООП","cg":"builtin","description":"True если объект имеет атрибут с указанным именем.","syntax":"hasattr(object, name)","examples":"class A:\n    x = 1\na = A()\nprint(hasattr(a,'x'))  # → True\nprint(hasattr(a,'y'))  # → False\nprint(hasattr([],'append'))  # → True\nprint(hasattr([],'nonexistent'))  # → False\nprint(hasattr('str','upper'))  # → True","version":null,"docs":"https://docs.python.org/3/library/functions.html#hasattr"},{"id":"object","name":"object","group":"Встроенные функции","subcat":"ООП","cg":"builtin","description":"Базовый класс всех классов Python.","syntax":"object()","examples":"o = object()\nprint(type(o))  # → <class 'object'>\nprint(isinstance(42, object))  # → True\nprint(isinstance('hi', object))  # → True\nclass A(object): pass  # явно наследуется\nprint(A.__bases__)  # → (<class 'object'>,)\nprint(dir(object()))[:5]  # → базовые методы","version":null,"docs":"https://docs.python.org/3/library/functions.html#object"},{"id":"property-1","name":"property","group":"Встроенные функции","subcat":"ООП","cg":"builtin","description":"Создаёт управляемый атрибут (геттер/сеттер/делитер).","syntax":"property(fget=None, fset=None, fdel=None)","examples":"class C:\n    def __init__(self): self._x=0\n    def getx(self): return self._x\n    def setx(self,v): self._x=v\n    x = property(getx, setx)\nc=C(); c.x=10\nprint(c.x)  # → 10\nclass D:\n    @property\n    def y(self): return 42\nprint(D().y)  # → 42\nprint(type(D.__dict__['y']))  # → property","version":null,"docs":"https://docs.python.org/3/library/functions.html#property"},{"id":"setattr","name":"setattr","group":"Встроенные функции","subcat":"ООП","cg":"builtin","description":"Устанавливает атрибут объекта по имени.","syntax":"setattr(object, name, value)","examples":"class A: pass\na=A()\nsetattr(a,'x',42)\nprint(a.x)  # → 42\nfor name,val in [('p',1),('q',2)]:\n    setattr(a,name,val)\nprint(a.p, a.q)  # → 1 2\nsetattr(a,'lst',[])\na.lst.append(1)\nprint(a.lst)  # → [1]","version":null,"docs":"https://docs.python.org/3/library/functions.html#setattr"},{"id":"staticmethod-1","name":"staticmethod","group":"Встроенные функции","subcat":"ООП","cg":"builtin","description":"Создаёт статический метод — без self/cls.","syntax":"@staticmethod\ndef f(): ...","examples":"class Math:\n    @staticmethod\n    def add(a,b): return a+b\nprint(Math.add(3,4))  # → 7\nprint(Math().add(3,4))  # → 7\nclass Utils:\n    @staticmethod\n    def is_even(n): return n%2==0\nprint(Utils.is_even(4))  # → True\nprint(type(Utils.__dict__['is_even']))  # → staticmethod","version":null,"docs":"https://docs.python.org/3/library/functions.html#staticmethod"},{"id":"super-1","name":"super","group":"Встроенные функции","subcat":"ООП","cg":"builtin","description":"Возвращает прокси-объект следующего класса в MRO.","syntax":"super()\nsuper(type, obj_or_type)","examples":"class A:\n    def f(self): return 'A'\nclass B(A):\n    def f(self): return 'B+'+super().f()\nprint(B().f())  # → B+A\nclass C(B):\n    def f(self): return 'C+'+super().f()\nprint(C().f())  # → C+B+A\nprint(super(B, B()))  # → <super: B, B()>","version":null,"docs":"https://docs.python.org/3/library/functions.html#super"},{"id":"input-1","name":"input","group":"Встроенные функции","subcat":"ввод/вывод","cg":"builtin","description":"Читает строку из стандартного ввода.","syntax":"input([prompt])","examples":"# В интерактивном режиме:\n# name = input('Your name: ')  # → ждёт ввода\n# Симуляция:\nimport io,sys\nsys.stdin = io.StringIO('Alice\\n')\nname = input()\nprint(name)  # → Alice\nsys.stdin = sys.__stdin__\nprint(type(name))  # → str","version":null,"docs":"https://docs.python.org/3/library/functions.html#input"},{"id":"print-1","name":"print","group":"Встроенные функции","subcat":"ввод/вывод","cg":"builtin","description":"Выводит объекты в stdout.","syntax":"print(*objects, sep=' ', end='\\n', file=sys.stdout, flush=False)","examples":"print(1, 2, 3)           # → 1 2 3\nprint(1, 2, sep='-')     # → 1-2\nprint('hi', end='!')      # → hi!\nimport sys\nprint('err', file=sys.stderr)\nprint(1, 2, 3, sep=', ', end='.\\n')  # → 1, 2, 3.","version":null,"docs":"https://docs.python.org/3/library/functions.html#print"},{"id":"compile","name":"compile","group":"Встроенные функции","subcat":"выполнение","cg":"builtin","description":"Компилирует строку в объект кода.","syntax":"compile(source, filename, mode)","examples":"code = compile('1+2', '<string>', 'eval')\nprint(eval(code))  # → 3\nstmt = compile('x=5\\nprint(x)', '<s>', 'exec')\nexec(stmt)  # → 5\ncode2 = compile('[x**2 for x in range(5)]','<s>','eval')\nprint(eval(code2))  # → [0,1,4,9,16]\nprint(type(code))  # → <class 'code'>","version":null,"docs":"https://docs.python.org/3/library/functions.html#compile"},{"id":"eval","name":"eval","group":"Встроенные функции","subcat":"выполнение","cg":"builtin","description":"Вычисляет выражение из строки. ВНИМАНИЕ: небезопасен для ненадёжного ввода!","syntax":"eval(expression[, globals[, locals]])","examples":"print(eval('2**10'))  # → 1024\nprint(eval('[x**2 for x in range(5)]'))  # → [0,1,4,9,16]\nx = 10\nprint(eval('x + 5'))  # → 15\nprint(eval('1+2', {}))  # → 3 (пустой globals)\nprint(eval('abs(-5)', {'abs':abs}))  # → 5","version":null,"docs":"https://docs.python.org/3/library/functions.html#eval"},{"id":"exec","name":"exec","group":"Встроенные функции","subcat":"выполнение","cg":"builtin","description":"Выполняет динамически созданный Python-код.","syntax":"exec(object[, globals[, locals]])","examples":"exec('x = 1 + 2')\n# print(x)  # x есть в локальном пространстве?\ng = {}\nexec('y = 42', g)\nprint(g['y'])  # → 42\nexec('for i in range(3): print(i)')  # → 0 1 2\ndef make_func(name):\n    exec(f'def {name}(): return \"{name}\"', globals())\nmake_func('hello')\nprint(hello())  # → hello","version":null,"docs":"https://docs.python.org/3/library/functions.html#exec"},{"id":"callable","name":"callable","group":"Встроенные функции","subcat":"интроспекция","cg":"builtin","description":"True если объект можно вызвать (функция, класс, __call__).","syntax":"callable(object)","examples":"print(callable(print))    # → True\nprint(callable(len))      # → True\nprint(callable(42))       # → False\nprint(callable(lambda: 0))  # → True\nclass A:\n    def __call__(self): pass\nprint(callable(A()))  # → True","version":null,"docs":"https://docs.python.org/3/library/functions.html#callable"},{"id":"dir","name":"dir","group":"Встроенные функции","subcat":"интроспекция","cg":"builtin","description":"Список атрибутов объекта (или локального пространства имён).","syntax":"dir([object])","examples":"print(dir([]))[:5]  # → первые 5 атрибутов списка\nprint('append' in dir([]))  # → True\nclass A:\n    x = 1\n    def f(self): pass\nprint('x' in dir(A))  # → True\nprint('f' in dir(A))  # → True\nprint(type(dir([])))  # → list","version":null,"docs":"https://docs.python.org/3/library/functions.html#dir"},{"id":"id","name":"id","group":"Встроенные функции","subcat":"интроспекция","cg":"builtin","description":"Возвращает уникальный идентификатор объекта (адрес в памяти).","syntax":"id(object)","examples":"x = 42\nprint(id(x))  # → большое целое число\ny = x\nprint(id(x) == id(y))  # → True (один объект)\nprint(id(42) == id(42))  # → True (интернирование)\nprint(id([]) == id([]))  # → False (разные объекты)\na = 'hello'; b = 'hello'\nprint(id(a) == id(b))  # → True (интернирование строк)","version":null,"docs":"https://docs.python.org/3/library/functions.html#id"},{"id":"vars","name":"vars","group":"Встроенные функции","subcat":"интроспекция","cg":"builtin","description":"Возвращает __dict__ объекта или текущего пространства имён.","syntax":"vars([object])","examples":"class A:\n    def __init__(self): self.x=1; self.y=2\na=A()\nprint(vars(a))  # → {'x':1,'y':2}\nprint('x' in vars(a))  # → True\nprint(vars(int))['__add__']  # → метод int.__add__\nprint(type(vars()))  # → dict\nprint('print' in vars(__builtins__) if isinstance(vars(__builtins__),dict) else True)","version":null,"docs":"https://docs.python.org/3/library/functions.html#vars"},{"id":"hash","name":"hash","group":"Встроенные функции","subcat":"интроспекция","cg":"builtin","description":"Возвращает хеш объекта (если объект хешируем).","syntax":"hash(object)","examples":"print(hash(42))      # → 42\nprint(hash('hello')) # → число\nprint(hash((1,2,3))) # → число\ntry:\n    hash([1,2,3])  # → TypeError: unhashable type: 'list'\nexcept TypeError as e: print(e)\nprint(hash(42) == hash(42.0))  # → True (равные объекты)","version":null,"docs":"https://docs.python.org/3/library/functions.html#hash"},{"id":"help","name":"help","group":"Встроенные функции","subcat":"интроспекция","cg":"builtin","description":"Вызывает справочную систему.","syntax":"help([object])","examples":"help(len)  # → выводит справку о len\nhelp(str.upper)  # → справка о методе\nhelp(list)  # → все методы списка\nprint(len.__doc__[:30])  # → Return the number of items...\nimport math; help(math.sqrt)  # → sqrt справка","version":null,"docs":"https://docs.python.org/3/library/functions.html#help"},{"id":"isinstance-1","name":"isinstance","group":"Встроенные функции","subcat":"интроспекция/ООП","cg":"builtin","description":"True если объект является экземпляром класса (или подкласса).","syntax":"isinstance(object, classinfo)","examples":"print(isinstance(42, int))    # → True\nprint(isinstance(42, (int,float)))  # → True\nprint(isinstance('hi', str))  # → True\nprint(isinstance(True, int))  # → True (bool подкласс int)\nprint(isinstance([], (list,tuple)))  # → True","version":null,"docs":"https://docs.python.org/3/library/functions.html#isinstance"},{"id":"issubclass","name":"issubclass","group":"Встроенные функции","subcat":"интроспекция/ООП","cg":"builtin","description":"True если класс является подклассом другого.","syntax":"issubclass(class, classinfo)","examples":"print(issubclass(bool, int))   # → True\nprint(issubclass(int, object))  # → True\nprint(issubclass(list, (list,tuple)))  # → True\nclass A: pass\nclass B(A): pass\nprint(issubclass(B, A))  # → True\nprint(issubclass(A, B))  # → False","version":null,"docs":"https://docs.python.org/3/library/functions.html#issubclass"},{"id":"enumerate-1","name":"enumerate","group":"Встроенные функции","subcat":"итераторы","cg":"builtin","description":"Добавляет счётчик к итерируемому.","syntax":"enumerate(iterable, start=0)","examples":"for i,v in enumerate(['a','b','c']):\n    print(i,v)  # → 0 a / 1 b / 2 c\nfor i,v in enumerate(['x','y'],start=1):\n    print(i,v)  # → 1 x / 2 y\nprint(list(enumerate('abc')))  # → [(0,'a'),(1,'b'),(2,'c')]\nprint(dict(enumerate('abc')))  # → {0:'a',1:'b',2:'c'}\nprint(list(enumerate(range(5),10)))  # → [(10,0)...]","version":null,"docs":"https://docs.python.org/3/library/functions.html#enumerate"},{"id":"iter","name":"iter","group":"Встроенные функции","subcat":"итераторы","cg":"builtin","description":"Возвращает итератор. С двумя аргументами — вызывает функцию до значения sentinel.","syntax":"iter(object)\niter(callable, sentinel)","examples":"it = iter([1,2,3])\nprint(next(it), next(it))  # → 1 2\nit2 = iter('hello')\nprint(list(it2))  # → ['h','e','l','l','o']\n# sentinel-вариант\nfrom io import StringIO\nf = StringIO('a\\nb\\nc')\nfor line in iter(f.readline, ''):\n    print(line.strip())\nprint(list(iter(range(5))))  # → [0,1,2,3,4]","version":null,"docs":"https://docs.python.org/3/library/functions.html#iter"},{"id":"next","name":"next","group":"Встроенные функции","subcat":"итераторы","cg":"builtin","description":"Возвращает следующий элемент итератора. default — если итератор исчерпан.","syntax":"next(iterator[, default])","examples":"it = iter([1,2,3])\nprint(next(it))  # → 1\nprint(next(it))  # → 2\nprint(next(it))  # → 3\nprint(next(it, 'end'))  # → end\ng = (x**2 for x in range(5))\nprint(next(g), next(g))  # → 0 1","version":null,"docs":"https://docs.python.org/3/library/functions.html#next"},{"id":"range-1","name":"range","group":"Встроенные функции","subcat":"итераторы","cg":"builtin","description":"Создаёт диапазон целых чисел.","syntax":"range(stop)\nrange(start, stop[, step])","examples":"print(list(range(5)))  # → [0,1,2,3,4]\nprint(list(range(2,8)))  # → [2,3,4,5,6,7]\nprint(list(range(0,10,2)))  # → [0,2,4,6,8]\nprint(list(range(5,0,-1)))  # → [5,4,3,2,1]\nprint(sum(range(101)))  # → 5050","version":null,"docs":"https://docs.python.org/3/library/functions.html#range"},{"id":"reversed","name":"reversed","group":"Встроенные функции","subcat":"итераторы","cg":"builtin","description":"Возвращает итератор в обратном порядке.","syntax":"reversed(sequence)","examples":"print(list(reversed([1,2,3,4,5])))  # → [5,4,3,2,1]\nprint(list(reversed('hello')))  # → ['o','l','l','e','h']\n
