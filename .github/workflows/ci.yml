name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PYTHONUNBUFFERED: "1"
  FORCE_COLOR: "1"

jobs:
  quality:
    name: Линтер и типы
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Установка зависимостей
        run: python -m pip install -e ".[dev]"

      - name: ruff check
        run: ruff check --output-format=github .

      - name: ruff format
        run: ruff format --check --diff .

      - name: mypy
        run: mypy

  tests:
    name: Тесты (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Установка зависимостей
        run: python -m pip install -e ".[dev,schema]"

      - name: pytest
        run: pytest --cov=glossary --cov-report=xml --cov-report=term-missing --cov-fail-under=90

      - name: Публикация отчёта о покрытии
        if: matrix.python-version == '3.11'
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.xml
          retention-days: 14

  data:
    name: Качество данных и синхронность витрины
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Установка пакета
        run: python -m pip install -e .

      - name: Валидация данных
        run: python -m glossary validate

      - name: Витрина собрана из текущих данных
        run: python -m glossary build --check

      - name: Отчёт о качестве
        if: always()
        run: |
          {
            echo '### Качество глоссария'
            echo
            echo '```'
            python -m glossary stats || true
            echo '```'
            echo
            echo '<details><summary>Замечания валидатора</summary>'
            echo
            echo '```'
            python -m glossary validate 2>&1 || true
            echo '```'
            echo
            echo '</details>'
          } >> "$GITHUB_STEP_SUMMARY"
