# Значки, факты, замечания и полнота: считает издатель, читает потребитель.
#
# ПОЧЕМУ ИНВЕНТАРЬ СНИМАЕТСЯ МАТРИЦЕЙ. Полнота глоссария меряется относительно
# самого языка, а язык у каждой версии свой. Один прогон отвечает на вопрос
# «чего нет в 3.14»; разность двух соседних отвечает на «что появилось в 3.14»
# — и это тот же ответ, за которым обычно идут в раздел What's New, только без
# сети и без разбора чужой вёрстки.
#
# ПОЧЕМУ ЗАМЕЧАНИЯ ЗДЕСЬ. Карточки правятся не в этом репозитории, и список
# из четырёхсот идентификаторов, перенесённый руками в issue, не выживает ни
# одной итерации. Замечания — такой же факт о проекте, что и число карточек:
# издатель публикует, источник читает обычным HTTP (правило каталога 174).
#
# ПОЧЕМУ ОТДЕЛЬНАЯ ВЕТКА, А НЕ `main`. Причина та же, что у соседнего проекта
# (ArtVsMark/Stepik-Python-Grader, issue #1235), и здесь она действует буквально:
# `main` защищён обязательной проверкой «check PR», поэтому прямой push из
# прогона туда невозможен. Плюс каждый коммит со значком запускал бы ещё один
# прогон. Отдельная ветка снимает оба противоречия, а заодно выполняет правило
# каталога 160: производное, пересобираемое чаще изменений, в общей ветке
# не хранят.
#
# ПОЧЕМУ ОТДЕЛЬНЫЙ ПРОГОН, А НЕ ШАГ В `ci.yml`. Разные права и разные предметы:
# здесь нужен `contents: write` и не нужен PR-гейт. Смешав их, мы дали бы
# обязательной проверке право писать в репозиторий, которое ей не нужно.
name: Значки, факты, замечания и полнота

on:
  push:
    branches: [main]
  # ПОЧЕМУ РАСПИСАНИЕ. С 7 сентября слияния делает автомерж, а пуш, сделанный
  # токеном прогона, новых прогонов не запускает — так устроена площадка. Push
  # в main с тех пор этот прогон не будил ни разу, и facts.json простоял
  # вчерашним три недели при зелёном CI (Glossary-Python#49). Суточный прогон
  # держит отметку generated_at внутри порога свежести витрины (14 дней)
  # независимо от того, кто и как сливает.
  schedule:
    - cron: "17 3 * * *"
  # Значок Python красится исходами CI и python-next на main. На толчке они
  # ещё идут, и сборка по толчку видела бы прошлый исход: поэтому значки
  # пересобираются и по ЗАВЕРШЕНИИ этих прогонов (Glossary-Python#57).
  workflow_run:
    workflows: [CI, python-next]
    types: [completed]
    branches: [main]
  # У событийной автоматики всегда есть ручная кнопка: события теряются.
  workflow_dispatch:

# ГРУППА ОДНА И НЕ ОТМЕНЯЕТ, А СТАВИТ В ОЧЕРЕДЬ. Прогон — единственный писатель
# ветки badges, и с workflow_run его будят несколько событий на один коммит.
# Голова в имени группы разрешила бы двум прогонам писать ветку одновременно, и
# второй толчок отказал бы как не быстрый; отмена же теряла бы свежий исход.
# Предмет здесь не коммит, а состояние ветки badges (довод каталога, его
# badges.yml).
concurrency:
  group: badges
  cancel-in-progress: false

permissions:
  contents: write
  # Исходы прогонов для значка Python читаются у площадки.
  actions: read

jobs:
  inventory:
    name: Инвентарь языка (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      # Из дерева, без установки. Планка проекта — 3.14, и requires-python
      # ставить пакет ниже неё не даёт, а замер языка нужен и на младших
      # версиях: из них складывается разность «что появилось» (Glossary-Python#53).
      # Runtime-зависимостей нет, поэтому установка замеру и не нужна; что код
      # пакета разбирается младшей версией, держит tests/test_measured_versions.py.
      - name: Снять инвентарь
        env:
          PYTHONPATH: src
        run: >
          python -m glossary inventory
          -o inventory/inventory-${{ matrix.python-version }}.json

      - uses: actions/upload-artifact@v7
        with:
          name: inventory-${{ matrix.python-version }}
          path: inventory/
          retention-days: 7

  preview:
    # 3.15 ещё в release candidate: заморозка возможностей уже прошла, поэтому
    # список нового практически финальный, но сюрпризы на RC ещё бывают. Ронять
    # из-за них публикацию незачем — работа необязательная и своё падение
    # показывает сама.
    name: Инвентарь языка (Python 3.15-rc)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true
    # ВЕРСИЯ ЗАДАНА МАТРИЦЕЙ, А НЕ ЛИТЕРАЛОМ, И ЭТО НАЗВАННЫЙ ОБХОД. Значок
    # Python каталога (python-badge@v1.6.0) считает предварительной ПРОВЕРКОЙ
    # всякий шаг setup-python с allow-prereleases и литералом версии рядом и
    # красит её часть исходом этого прогона. Здесь не проверка, а замер языка:
    # литерал дал бы на значке вторую часть «3.15», окрашенную публикацией.
    # Проверка 3.15 — python-next.yml.
    strategy:
      matrix:
        python-version: ["3.15"]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          allow-prereleases: true

      - name: Снять инвентарь
        env:
          PYTHONPATH: src
        run: python -m glossary inventory -o inventory/inventory-3.15.json

      - uses: actions/upload-artifact@v7
        with:
          name: inventory-3.15
          path: inventory/
          retention-days: 7

  publish:
    name: Опубликовать значки, факты, замечания и полноту
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # `preview` объявлен зависимостью намеренно, при continue-on-error: так
    # публикация дожидается его результата, но не падает вместе с ним. Его
    # отсутствие видно в whatsnew.json — там просто не будет 3.15.
    needs: [inventory, preview]
    steps:
      # История целиком и с тегами: версия по схеме семьи — тег выпуска плюс
      # принятые после него изменения (scripts/version.py). Неглубокий checkout
      # не несёт ни тега, ни диапазона, и вместо версии публиковалась бы
      # причина «выпуска нет» — после выпуска это неправда.
      #
      # На workflow_run файл прогона берётся с общей ветки, и код, который он
      # исполняет, закреплён за ней же (правило каталога 152).
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          fetch-tags: true
          ref: ${{ github.event_name == 'workflow_run' && 'main' || github.ref }}

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Установка зависимостей
        run: python -m pip install -e ".[dev]"

      - name: Покрытие — источник для одноимённого значка
        run: pytest --cov=glossary --cov-report=xml -q

      - uses: actions/download-artifact@v7
        with:
          pattern: inventory-*
          path: inventory
          merge-multiple: true

      - name: Собрать значки и факты
        run: python scripts/facts.py --badges

      # Единый значок «Python │ ОС │ coverage │ release / PyPI │ version»
      # рисует действие каталога из тега, а не копия здесь (правило 095).
      # Покрытие и версию оно берёт из значков, собранных шагом выше, — второго
      # замера нет (214). Отказ действия (площадка не ответила, версии не
      # нашлось) не рисуется серым и не роняет публикацию: python.svg не
      # появляется, и на ветке остаётся прежний значок — это предупреждение.
      - name: Значок Python
        id: python_badge
        continue-on-error: true
        uses: ArtVsMark/Engineering-Incidents-Playbook/.github/actions/python-badge@v1.6.0
        with:
          ci-workflow: ci.yml
          coverage-json: .github/badges/coverage.json
          version-json: .github/badges/version.json
          out: .github/badges/python.svg

      - name: Значок Python не собран — остаётся прежний
        if: steps.python_badge.outcome == 'failure'
        run: |
          rm -f .github/badges/python.svg
          echo "::warning::значок Python не собран — на ветке badges остаётся прежний"

      # Издатель проверяет себя схемой потребителя до публикации: файл, не
      # отвечающий договору фактов 1.2, витрина покажет прочерками. Проверка
      # берётся у витрины, а не копируется сюда: копия схемы разошлась бы с
      # оригиналом на первом же миноре (правило 090).
      - name: Факты отвечают договору витрины
        run: |
          showcase="${RUNNER_TEMP:-/tmp}/showcase"
          git clone --quiet --depth 1 https://github.com/ArtVsMark/ArtVsMark "$showcase"
          python "$showcase/scripts/check_facts.py" \
            --file .github/badges/facts.json --repo "$GITHUB_REPOSITORY"

      - name: Собрать замечания к содержанию
        run: >
          python -m glossary objections --format json
          -o .github/badges/objections.json

      # НЕ coverage.json. Под этим именем лежит shields-эндпоинт покрытия
      # кода тестами, который читают соседи; однажды файл полноты уже был
      # опубликован туда и затёр его молча — значок сломался, а прогон
      # остался зелёным.
      #
      # Ответ зависит от версии интерпретатора, и она названа внутри файла:
      # сравнивать полноту, снятую на разных версиях, как одно число нельзя.
      - name: Собрать полноту относительно официального Python
        run: >
          python -m glossary completeness --format json
          -o .github/badges/completeness-report.json

      - name: Свести разность версий
        run: >
          python scripts/whatsnew.py inventory/inventory-*.json
          -o .github/badges/whatsnew.json

      - name: Опубликовать веткой badges
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          publish="${RUNNER_TEMP:-/tmp}/badges-publish"
          rm -rf "$publish"
          if git fetch --depth=1 origin badges 2>/dev/null; then
            git worktree add -B badges "$publish" FETCH_HEAD >/dev/null
          else
            # Ветки ещё нет: заводим сиротскую. История main значкам не нужна —
            # они артефакт сборки, а не исходник.
            git worktree add --detach "$publish" HEAD >/dev/null
            git -C "$publish" switch --orphan badges
            git -C "$publish" rm -rq --cached . 2>/dev/null || true
            find "$publish" -mindepth 1 -maxdepth 1 -not -name .git -exec rm -rf {} +
          fi
          mkdir -p "$publish/.github/badges"
          cp .github/badges/*.json "$publish/.github/badges/"
          if [ -f .github/badges/python.svg ]; then
            cp .github/badges/python.svg "$publish/.github/badges/"
          fi
          git -C "$publish" add .github/badges
          # --cached, а не обычный diff: при первом прогоне файлы ещё не
          # отслеживаются, и обычный `git diff --quiet` не увидел бы добавления.
          #
          # С появлением generated_at эта ветка практически не срабатывает:
          # отметка времени меняет файлы на каждом прогоне. Проверка оставлена
          # намеренно — она страхует случай, когда сборка контрактов
          # обвалилась и файлы остались прежними побайтово, включая отметку.
          if git -C "$publish" diff --cached --quiet; then
            echo "Опубликованное не изменилось."
          else
            git -C "$publish" commit -q \
              -m "chore(ci): обновить значки, факты, замечания и полноту [skip ci]"
            git -C "$publish" push origin badges
            echo "Опубликовано в ветку badges."
          fi
          git worktree remove --force "$publish"
