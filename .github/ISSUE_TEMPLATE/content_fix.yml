name: Правка содержимого / Content fix
description: Неточность, опечатка или неполнота в существующей карточке / An inaccuracy, typo or gap in an existing card
title: "[Контент / Content]: "
labels: ["контент"]
body:
  - type: input
    id: entry_id
    attributes:
      label: Идентификатор карточки / Card identifier
      description: Значение поля `id` из `data/glossary.json`. / The value of the `id` field in `data/glossary.json`.
      placeholder: "extend"
    validations:
      required: true

  - type: dropdown
    id: kind
    attributes:
      label: Что не так / What is wrong
      options:
        - Фактическая ошибка / Factual error
        - Неполное или неточное описание / Incomplete or inaccurate description
        - Пример не работает или устарел / The example fails or is outdated
        - Неверная или слишком общая ссылка на документацию / Wrong or too general documentation link
        - Неверный маркер версии / Wrong version marker
        - Дубликат другой карточки / Duplicate of another card
        - Опечатка или оформление / Typo or formatting
    validations:
      required: true

  - type: textarea
    id: current
    attributes:
      label: Как сейчас / Current text
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Как должно быть / What it should be
      description: По возможности приложите ссылку на документацию или PEP. / If possible, attach a link to the documentation or a PEP.
    validations:
      required: true
