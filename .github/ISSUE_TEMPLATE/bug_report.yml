name: Ошибка в инструментах или витрине / Tooling or showcase bug
description: CLI, сборка, экспорт или поведение HTML-страницы работают не так / The CLI, build, export or the HTML page misbehave
title: "[Баг / Bug]: "
labels: ["баг"]
body:
  - type: dropdown
    id: area
    attributes:
      label: Где проявляется / Where it shows up
      options:
        - CLI (validate / build / export / stats)
        - Сборка витрины / Showcase build
        - Экспорт / Export (JSON / Markdown / CSV)
        - Поведение HTML-страницы / HTML page behaviour (поиск / search, фильтры / filters, тема / theme)
        - CI и инфраструктура / CI and infrastructure
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Как воспроизвести / How to reproduce
      description: Команда или последовательность действий. / A command or a sequence of steps.
      render: shell
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Ожидаемое поведение / Expected behaviour
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Фактическое поведение / Actual behaviour
      description: Приложите вывод команды или сообщение об ошибке целиком. / Attach the full command output or error message.
    validations:
      required: true

  - type: input
    id: environment
    attributes:
      label: Окружение / Environment
      description: Версия Python, ОС, браузер (если проблема в витрине). / Python version, OS, browser (if the problem is in the showcase).
      placeholder: "Python 3.12.3, Ubuntu 24.04, Firefox 129"
