<!DOCTYPE html>
<html lang="ru" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Python Glossary — Справочник стандартной библиотеки</title>
<link href="https://api.fontshare.com/v2/css?f[]=satoshi@400,500,700,900&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f4f2ec; --surface:#ffffff; --surface-2:#faf9f5; --border:#e6e2d8; --border-strong:#d8d3c6;
  --text:#1c2230; --muted:#6b7280; --faint:#9aa1ad;
  --accent:#2f54eb; --accent-soft:#eaeefe; --accent-ink:#1e3bb0;
  --code-bg:#f6f4ee; --code-border:#eae6db; --mark-bg:#ffe680; --mark-ink:#5b4a00;
  --shadow:0 1px 2px rgba(28,34,48,.04), 0 4px 16px rgba(28,34,48,.05);
  --shadow-lg:0 8px 40px rgba(28,34,48,.12);
  --radius:14px; --radius-sm:9px;
  --c-builtin:#3b82f6; --c-str:#0d9f6e; --c-seq:#8b5cf6; --c-mapset:#6366f1;
  --c-oop:#ec4899; --c-exc:#ef4444; --c-module:#e0850b; --c-iter:#06b6d4;
  --c-op:#64748b; --c-typing:#9173f0;
  --kw:#a626a4; --str:#0d9f6e; --num:#c18401; --com:#9aa1ad; --bi:#0184bc; --fn:#4078f2; --res:#7a8290;
}
[data-theme="dark"]{
  --bg:#0e1320; --surface:#161d2e; --surface-2:#1a2236; --border:#283248; --border-strong:#374256;
  --text:#e6eaf2; --muted:#94a0b4; --faint:#646f86;
  --accent:#6b8cff; --accent-soft:#1c2747; --accent-ink:#a9bcff;
  --code-bg:#101725; --code-border:#283248; --mark-bg:#6b5a14; --mark-ink:#ffe680;
  --shadow:0 1px 2px rgba(0,0,0,.3), 0 4px 18px rgba(0,0,0,.35);
  --shadow-lg:0 10px 44px rgba(0,0,0,.5);
  --c-builtin:#60a5fa; --c-str:#34d399; --c-seq:#a78bfa; --c-mapset:#818cf8;
  --c-oop:#f472b6; --c-exc:#f87171; --c-module:#fbbf24; --c-iter:#22d3ee;
  --c-op:#94a3b8; --c-typing:#b39cf7;
  --kw:#c678dd; --str:#98c379; --num:#d19a66; --com:#5c6678; --bi:#56b6c2; --fn:#61afef; --res:#7a8494;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  margin:0; background:var(--bg); color:var(--text);
  font-family:'Satoshi',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  font-size:15px; line-height:1.55; -webkit-font-smoothing:antialiased;
  transition:background .35s ease, color .35s ease;
}
code,pre,.mono{font-family:'JetBrains Mono','SF Mono',ui-monospace,monospace}
::selection{background:var(--accent-soft);color:var(--accent-ink)}
a{color:inherit}

/* ---------- HEADER ---------- */
.site-header{
  position:sticky; top:0; z-index:50; background:color-mix(in srgb,var(--surface) 88%,transparent);
  backdrop-filter:blur(14px) saturate(1.4); border-bottom:1px solid var(--border);
}
.header-inner{max-width:1480px;margin:0 auto;padding:14px 28px;display:flex;align-items:center;gap:20px}
.brand{display:flex;align-items:center;gap:13px;flex-shrink:0}
.logo{
  width:42px;height:42px;border-radius:11px;background:var(--accent);
  display:grid;place-items:center;position:relative;box-shadow:0 4px 14px color-mix(in srgb,var(--accent) 40%,transparent);
}
.logo b{color:#fff;font-family:'JetBrains Mono',monospace;font-weight:700;font-size:18px;letter-spacing:-1px}
.logo i{position:absolute;width:9px;height:9px;border-radius:50%;background:#ffd43b;right:-3px;top:-3px;border:2px solid var(--surface)}
.brand-text h1{margin:0;font-size:18px;font-weight:900;letter-spacing:-.4px;line-height:1.1}
.brand-text p{margin:1px 0 0;font-size:12px;color:var(--muted);font-weight:500}
.header-spacer{flex:1}
.counter{font-size:12.5px;color:var(--muted);font-weight:600;white-space:nowrap;font-variant-numeric:tabular-nums}
.counter b{color:var(--accent);font-weight:800}
.icon-btn{
  width:40px;height:40px;border-radius:11px;border:1px solid var(--border-strong);background:var(--surface);
  color:var(--text);cursor:pointer;display:grid;place-items:center;transition:.18s;flex-shrink:0;
}
.icon-btn:hover{background:var(--surface-2);border-color:var(--accent);color:var(--accent)}
.icon-btn svg{width:19px;height:19px}
.theme-sun{display:none}
[data-theme="dark"] .theme-sun{display:block}
[data-theme="dark"] .theme-moon{display:none}

/* ---------- TOOLBAR ---------- */
.toolbar{
  position:sticky; top:71px; z-index:40; background:color-mix(in srgb,var(--bg) 90%,transparent);
  backdrop-filter:blur(10px); border-bottom:1px solid var(--border);
}
.toolbar-inner{max-width:1480px;margin:0 auto;padding:14px 28px 12px;display:flex;flex-direction:column;gap:11px}
.search-row{display:flex;gap:11px;align-items:center}
.search-wrap{position:relative;flex:1;min-width:0}
.search-wrap svg.s-ico{position:absolute;left:15px;top:50%;transform:translateY(-50%);width:18px;height:18px;color:var(--faint);pointer-events:none}
#search{
  width:100%;height:46px;padding:0 44px 0 44px;border-radius:12px;border:1.5px solid var(--border-strong);
  background:var(--surface);color:var(--text);font-size:15px;font-family:inherit;outline:none;transition:.18s;
}
#search:focus{border-color:var(--accent);box-shadow:0 0 0 4px var(--accent-soft)}
#search::placeholder{color:var(--faint)}
.search-clear{position:absolute;right:9px;top:50%;transform:translateY(-50%);width:28px;height:28px;border:none;background:var(--code-bg);border-radius:8px;cursor:pointer;display:none;place-items:center;color:var(--muted)}
.search-clear.show{display:grid}
.search-clear:hover{color:var(--text);background:var(--border)}
.kbd{font-family:'JetBrains Mono',monospace;font-size:11px;padding:2px 6px;border:1px solid var(--border-strong);border-bottom-width:2px;border-radius:5px;background:var(--surface-2);color:var(--muted)}
.sort-group{display:flex;gap:0;background:var(--surface);border:1.5px solid var(--border-strong);border-radius:12px;overflow:hidden;flex-shrink:0}
.sort-btn{border:none;background:transparent;padding:0 14px;height:46px;font-family:inherit;font-size:13px;font-weight:600;color:var(--muted);cursor:pointer;transition:.15s;border-left:1px solid var(--border)}
.sort-btn:first-child{border-left:none}
.sort-btn:hover{background:var(--surface-2);color:var(--text)}
.sort-btn.active{background:var(--accent-soft);color:var(--accent-ink)}

/* filters */
.filters{display:flex;flex-wrap:wrap;gap:7px;align-items:center}
.fil{
  border:1.5px solid var(--border-strong);background:var(--surface);color:var(--muted);
  padding:7px 13px;border-radius:9px;font-family:inherit;font-size:13px;font-weight:650;cursor:pointer;
  transition:.15s;white-space:nowrap;display:inline-flex;align-items:center;gap:6px;line-height:1;
}
.fil:hover{border-color:var(--accent);color:var(--text)}
.fil.active{background:var(--accent);border-color:var(--accent);color:#fff}
.fil .dot{width:8px;height:8px;border-radius:50%}
.fil-sep{width:1px;height:22px;background:var(--border-strong);margin:0 4px}
.fil-label{font-size:11px;font-weight:700;color:var(--faint);text-transform:uppercase;letter-spacing:.6px;margin-right:2px}
.ver-pill{padding:6px 11px;font-size:12px}
.dropdown{position:relative}
.dd-menu{
  position:absolute;top:calc(100% + 7px);left:0;z-index:60;background:var(--surface);border:1px solid var(--border-strong);
  border-radius:12px;box-shadow:var(--shadow-lg);padding:7px;min-width:230px;max-height:340px;overflow-y:auto;
  display:none;grid-template-columns:1fr;gap:1px;
}
.dd-menu.open{display:grid}
.dd-item{text-align:left;border:none;background:transparent;color:var(--text);padding:8px 11px;border-radius:8px;font-family:inherit;font-size:13px;font-weight:550;cursor:pointer;display:flex;justify-content:space-between;gap:10px;align-items:center}
.dd-item:hover{background:var(--surface-2)}
.dd-item.active{background:var(--accent-soft);color:var(--accent-ink);font-weight:700}
.dd-item span.cnt{font-size:11px;color:var(--faint);font-variant-numeric:tabular-nums}

/* ---------- LAYOUT ---------- */
.layout{max-width:1480px;margin:0 auto;padding:22px 28px 90px;display:flex;gap:22px;align-items:flex-start}
.az-rail{
  position:sticky;top:210px;display:flex;flex-direction:column;gap:1px;flex-shrink:0;
  padding-top:4px;
}
.az-rail a{
  width:22px;height:19px;display:grid;place-items:center;font-size:11px;font-weight:700;color:var(--faint);
  border-radius:5px;text-decoration:none;transition:.12s;cursor:pointer;font-family:'JetBrains Mono',monospace;
}
.az-rail a:hover{background:var(--accent);color:#fff}
.az-rail a.dis{opacity:.28;pointer-events:none}
.main{flex:1;min-width:0}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(430px,100%),1fr));gap:16px}
.empty{padding:80px 20px;text-align:center;color:var(--muted);display:none}
.empty.show{display:block}
.empty .big{font-size:46px;margin-bottom:10px}
.empty h3{margin:0 0 6px;font-size:19px;color:var(--text)}

/* ---------- CARD ---------- */
.card{
  background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:17px 18px 14px;
  box-shadow:var(--shadow);transition:border-color .18s, transform .18s, box-shadow .18s;
  display:flex;flex-direction:column;position:relative;scroll-margin-top:200px;border-left:3px solid var(--cardc);
}
.card:hover{border-color:var(--border-strong);transform:translateY(-2px);box-shadow:var(--shadow-lg);border-left-color:var(--cardc)}
.card-top{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;margin-bottom:9px}
.card-name{font-family:'JetBrains Mono',monospace;font-weight:700;font-size:17.5px;letter-spacing:-.5px;color:var(--text);word-break:break-word;line-height:1.25}
.badges{display:flex;flex-direction:column;align-items:flex-end;gap:5px;flex-shrink:0}
.badge{font-size:10.5px;font-weight:750;padding:3.5px 9px;border-radius:20px;white-space:nowrap;letter-spacing:.2px;
  color:var(--cardc);background:color-mix(in srgb,var(--cardc) 13%,transparent)}
.ver-badge{font-family:'JetBrains Mono',monospace;font-size:10px;font-weight:700;padding:2.5px 7px;border-radius:5px;background:var(--accent-soft);color:var(--accent-ink);white-space:nowrap}
.subcat{font-size:11px;color:var(--faint);font-weight:600;margin-bottom:11px;text-transform:lowercase;letter-spacing:.2px}
.subcat::before{content:"#";opacity:.6;margin-right:1px}

.field-label{font-size:10px;font-weight:800;letter-spacing:.9px;text-transform:uppercase;color:var(--faint);margin:0 0 5px}
.syntax{
  font-family:'JetBrains Mono',monospace;font-size:13px;line-height:1.5;color:var(--text);
  background:var(--code-bg);border:1px solid var(--code-border);border-radius:var(--radius-sm);
  padding:9px 12px;margin-bottom:12px;white-space:pre-wrap;word-break:break-word;font-weight:500;
}
.desc{font-size:14px;line-height:1.55;color:var(--text);margin:0 0 13px}
.desc mark,.card-name mark{background:var(--mark-bg);color:var(--mark-ink);border-radius:3px;padding:0 1px;font-weight:inherit}

.ex-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:5px}
.copy-btn{border:1px solid var(--border-strong);background:var(--surface);color:var(--muted);font-family:inherit;font-size:11px;font-weight:650;padding:4px 9px;border-radius:7px;cursor:pointer;display:inline-flex;align-items:center;gap:5px;transition:.15s}
.copy-btn:hover{border-color:var(--accent);color:var(--accent)}
.copy-btn.done{color:var(--c-str);border-color:var(--c-str)}
.copy-btn svg{width:13px;height:13px}
pre.examples{
  margin:0 0 12px;background:var(--code-bg);border:1px solid var(--code-border);border-radius:var(--radius-sm);
  padding:11px 13px;overflow-x:auto;font-size:12.5px;line-height:1.65;white-space:pre;tab-size:4;
}
pre.examples code{font-family:'JetBrains Mono',monospace}
.tok-kw{color:var(--kw);font-weight:600}
.tok-str{color:var(--str)}
.tok-num{color:var(--num)}
.tok-com{color:var(--com);font-style:italic}
.tok-bi{color:var(--bi)}
.tok-fn{color:var(--fn)}
.tok-res{color:var(--res)}
.tok-res b{color:var(--text);font-weight:600;font-style:normal}

.card-foot{margin-top:auto;display:flex;align-items:center;justify-content:space-between;gap:10px;padding-top:4px;border-top:1px solid var(--border);margin-top:2px;padding-top:11px}
.docs-link{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:650;color:var(--accent);text-decoration:none}
.docs-link:hover{text-decoration:underline}
.docs-link svg{width:13px;height:13px}
.related{display:flex;gap:5px;flex-wrap:wrap;justify-content:flex-end}

/* group divider when sorted by category */
.group-head{grid-column:1/-1;display:flex;align-items:center;gap:12px;margin:14px 2px 2px;padding-top:8px}
.group-head:first-child{margin-top:0}
.group-head h2{margin:0;font-size:15px;font-weight:900;letter-spacing:-.3px;display:flex;align-items:center;gap:9px}
.group-head .gdot{width:11px;height:11px;border-radius:50%}
.group-head .gcount{font-size:12px;color:var(--faint);font-weight:600;font-variant-numeric:tabular-nums}
.group-head .gline{flex:1;height:1px;background:var(--border)}

/* back to top */
#toTop{position:fixed;right:24px;bottom:24px;width:46px;height:46px;border-radius:13px;border:1px solid var(--border-strong);background:var(--surface);color:var(--accent);cursor:pointer;display:grid;place-items:center;box-shadow:var(--shadow-lg);opacity:0;pointer-events:none;transform:translateY(12px);transition:.25s;z-index:55}
#toTop.show{opacity:1;pointer-events:auto;transform:translateY(0)}
#toTop:hover{background:var(--accent);color:#fff;border-color:var(--accent)}
#toTop svg{width:20px;height:20px}

::-webkit-scrollbar{width:11px;height:11px}
::-webkit-scrollbar-thumb{background:var(--border-strong);border-radius:6px;border:3px solid var(--bg)}
::-webkit-scrollbar-track{background:transparent}

@media(max-width:1100px){.az-rail{display:none}}
@media(max-width:680px){
  .header-inner,.toolbar-inner,.layout{padding-left:15px;padding-right:15px}
  .brand-text p{display:none}
  .sort-btn{padding:0 9px;font-size:12px}
  .toolbar{top:67px}
  .grid{grid-template-columns:1fr}
  .counter{display:none}
}
</style>
</head>
<body>

<header class="site-header">
  <div class="header-inner">
    <div class="brand">
      <div class="logo"><b>py</b><i></i></div>
      <div class="brand-text">
        <h1>Python Glossary</h1>
        <p>Справочник стандартной библиотеки · Stepik-издание</p>
      </div>
    </div>
    <div class="header-spacer"></div>
    <div class="counter" id="counter">Показано: <b>507</b> из 507</div>
    <button class="icon-btn" id="themeBtn" title="Сменить тему" aria-label="Тема">
      <svg class="theme-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
      <svg class="theme-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/></svg>
    </button>
  </div>
</header>

<div class="toolbar">
  <div class="toolbar-inner">
    <div class="search-row">
      <div class="search-wrap">
        <svg class="s-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
        <input id="search" type="text" placeholder="Поиск по имени, описанию, примерам…  (нажми / )" autocomplete="off" spellcheck="false">
        <button class="search-clear" id="searchClear" aria-label="Очистить">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
        </button>
      </div>
      <div class="sort-group" id="sortGroup">
        <button class="sort-btn active" data-sort="az">А→Я</button>
        <button class="sort-btn" data-sort="za">Я→А</button>
        <button class="sort-btn" data-sort="cat">По разделам</button>
      </div>
    </div>
    <div class="filters" id="catFilters"></div>
    <div class="filters" id="verFilters">
      <span class="fil-label">Версия</span>
    </div>
  </div>
</div>

<div class="layout">
  <nav class="az-rail" id="azRail"></nav>
  <main class="main">
    <div class="grid" id="grid"></div>
    <div class="empty" id="empty">
      <div class="big">🔍</div>
      <h3>Ничего не найдено</h3>
      <p>Попробуй изменить запрос или сбросить фильтры.</p>
    </div>
  </main>
</div>

<button id="toTop" title="Наверх" aria-label="Наверх">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m18 15-6-6-6 6"/></svg>
</button>

<script id="glossary-data" type="application/json">[{"id":"input","name":"input()","group":"Ввод и вывод","subcat":"ввод","cg":"builtin","description":"Встроенная функция для чтения строки с клавиатуры. Выводит необязательный приглашающий текст и возвращает введённую строку без символа новой строки.","syntax":"input([prompt]) -> str","examples":"# name = input(\"Введите имя: \")  # пользователь вводит строку\n# age = int(input(\"Возраст: \"))  # → преобразование в int\n# price = float(input(\"Цена: \"))  # → преобразование в float\n# Проверка: x = int(input()) if input().isdigit() else 0\n# line1 = input(\"Строка 1: \"); line2 = input(\"Строка 2: \")\n# s = input(\"  hello  \").strip()  # → \"hello\" (убирает пробелы)","version":null,"docs":"https://docs.python.org/3/library/functions.html#input"},{"id":"print","name":"print()","group":"Ввод и вывод","subcat":"вывод","cg":"builtin","description":"Встроенная функция для вывода данных на стандартный вывод (экран). Принимает любое количество аргументов, разделяет их параметром sep и заканчивает строку параметром end.","syntax":"print(*objects, sep=' ', end='\\n', file=sys.stdout, flush=False)","examples":"print(\"Hello, World!\")  # → Hello, World!\nprint(\"a\", \"b\", \"c\", sep=\"-\")  # → a-b-c\nprint(\"Нет переноса\", end=\"\")  # → Нет переноса\nprint(\"x =\", 42, \"y =\", 3.14)  # → x = 42 y = 3.14\nname = \"Анна\"; age = 25\nprint(f\"{name} — {age} лет\")  # → Анна — 25 лет\nprint(f\"{3.14159:.2f}\")  # → 3.14\nwith open(\"/tmp/_test.txt\", \"w\") as f:\n    print(\"в файл\", file=f)  # записывает строку в файл\nimport sys; print(\"!\", flush=True, end=\"\", file=sys.stdout)  # → !","version":null,"docs":"https://docs.python.org/3/library/functions.html#print"},{"id":"sep","name":"sep=","group":"Ввод и вывод","subcat":"вывод","cg":"builtin","description":"Параметр функции print(), задающий разделитель между аргументами. По умолчанию — пробел. Может быть любой строкой, включая пустую.","syntax":"print(*objects, sep='разделитель')","examples":"print(1, 2, 3, sep=\", \")  # → 1, 2, 3\nprint(\"a\", \"b\", \"c\", sep=\"\")  # → abc\nprint(\"год\", \"месяц\", \"день\", sep=\"-\")  # → год-месяц-день\nprint(10, 20, 30, sep=\"\\n\")  # каждое число на новой строке\nprint(*[1, 2, 3, 4], sep=\" | \")  # → 1 | 2 | 3 | 4","version":null,"docs":"https://docs.python.org/3/library/functions.html#sep"},{"id":"end","name":"end=","group":"Ввод и вывод","subcat":"вывод","cg":"builtin","description":"Параметр функции print(), задающий строку, добавляемую в конец вывода. По умолчанию — символ новой строки '\\n'. Позволяет выводить на одной строке.","syntax":"print(*objects, end='строка')","examples":"print(\"Загрузка\", end=\"...\"); print(\"готово\")  # → Загрузка...готово\nfor i in range(5): print(i, end=\" \")  # → 0 1 2 3 4 \nprint(\"строка без переноса\", end=\"\")  # курсор остаётся на той же строке\nprint(\"раз\", end=\"\\t\"); print(\"два\")  # → раз\tдва\nprint(\"конец\", end=\"!\\n\")  # → конец!","version":null,"docs":"https://docs.python.org/3/library/functions.html#end"},{"id":"print-file-flush","name":"print(file=, flush=)","group":"Ввод и вывод","subcat":"вывод","cg":"builtin","description":"Параметр file= перенаправляет вывод в произвольный файловый объект (по умолчанию sys.stdout). flush=True немедленно сбрасывает внутренний буфер потока, не дожидаясь его заполнения.","syntax":"print(*objects, sep=\" \", end=\"\\n\", file=sys.stdout, flush=False)","examples":"import sys\nprint(\"ошибка!\", file=sys.stderr)  # → выводит в stderr\nprint(\".\", end=\"\", flush=True)  # → без буфера, без переноса строки\nwith open(\"/tmp/_gloss_test.txt\", \"w\") as f:\n    print(\"запись\", file=f)  # → пишет строку в файл\nimport io; buf = io.StringIO()\nprint(\"в буфер\", file=buf); print(buf.getvalue())  # → в буфер\nprint(1, 2, 3, sep=\"-\", file=sys.stdout, flush=True)  # → 1-2-3","version":null,"docs":"https://docs.python.org/3/library/functions.html#printfileflush"},{"id":"числовые-литералы","name":"Числовые литералы","group":"Ввод и вывод","subcat":"литералы","cg":"builtin","description":"Python поддерживает запись чисел в двоичной (0b), восьмеричной (0o) и шестнадцатеричной (0x) системах счисления, разделитель _ для читаемости, а также экспоненциальную нотацию.","syntax":"0b<биты>  0o<цифры>  0x<цифры>  <цифры>_<цифры>  <число>e<порядок>","examples":"print(0b1010)      # → 10\nprint(0o17)        # → 15\nprint(0xFF)        # → 255\nprint(1_000_000)   # → 1000000\nprint(1.5e3)       # → 1500.0\nprint(0b1111 == 15 == 0xF)  # → True","version":null,"docs":"https://docs.python.org/3/library/functions.html#"},{"id":"переменные","name":"Переменные","group":"Ввод и вывод","subcat":"переменные","cg":"builtin","description":"Именованные области памяти для хранения значений. В Python переменные динамически типизированы — тип определяется значением, а не объявлением.","syntax":"имя_переменной = значение","examples":"x = 10  # целое число\npi = 3.14  # float\ngreeting = \"Привет\"  # строка\na, b, c = 1, 2, 3  # множественное присваивание\na, b = b, a  # обмен значений без temp\nx += 5  # x = x + 5 → 15 (составное присваивание)\ndel x  # удаление переменной","version":null,"docs":"https://docs.python.org/3/library/functions.html#"},{"id":"repr-vs-str","name":"repr() vs str()","group":"Ввод и вывод","subcat":"строки","cg":"builtin","description":"str() возвращает «читаемое» представление объекта для вывода пользователю. repr() возвращает «однозначное» представление, пригодное для воспроизведения объекта в коде; используется в интерактивной консоли и при отладке.","syntax":"str(object)  repr(object)","examples":"print(str(\"привет\"))    # → привет\nprint(repr(\"привет\"))   # → 'привет'\nprint(str(None))        # → None\nprint(repr(None))       # → None\nprint(str([1, 2]))      # → [1, 2]\nprint(repr([1, 2]))     # → [1, 2]","version":null,"docs":"https://docs.python.org/3/library/functions.html#reprvsstr"},{"id":"nonetype","name":"NoneType","group":"Типы данных","subcat":"none","cg":"op","description":"Тип единственного объекта None — отсутствие значения. Используется как значение по умолчанию, возвращаемое значение функций без return, и sentinel.","syntax":"None","examples":"x = None  # явное присваивание\nprint(x is None)  # → True (правильная проверка на None)\ndef f(): pass\nprint(f())  # → None (функция без return возвращает None)\ndef greet(name=None):\n    name = name or \"Гость\"\n    return f\"Привет, {name}\"\nprint(greet())  # → Привет, Гость","version":null,"docs":"https://docs.python.org/3/library/stdtypes.html"},{"id":"bytes","name":"bytes","group":"Типы данных","subcat":"байты","cg":"op","description":"Неизменяемая последовательность байт (целых чисел 0–255). Создаётся литералом b\"...\", конструктором bytes() или bytes.fromhex(). Используется при работе с бинарными данными, сетью, файлами.","syntax":"bytes(n)  bytes(iterable)  b\"...\"  bytes.fromhex(hex_str)","examples":"print(bytes(5))              # → b'\\x00\\x00\\x00\\x00\\x00'\nprint(b\"hello\")              # → b'hello'\nprint(bytes([72, 101, 108]))  # → b'Hel'\nprint(bytes.fromhex(\"ff00ab\"))  # → b'\\xff\\x00\\xab'\nb = b\"ABC\"; print(b[0])      # → 65\nprint(b\"hello\".hex())         # → 68656c6c6f","version":null,"docs":"https://docs.python.org/3/library/stdtypes.html"},{"id":"bytearray","name":"bytearray","group":"Типы данных","subcat":"байты","cg":"op","description":"Изменяемая последовательность байт — аналог bytes, но позволяет менять отдельные элементы. Поддерживает те же методы, что и bytes, плюс операции изменения.","syntax":"bytearray(n)  bytearray(iterable)  bytearray(b\"...\")","examples":"ba = bytearray(5); print(ba)      # → bytearray(b'\\x00\\x00\\x00\\x00\\x00')\nba = bytearray(b\"hello\")\nba[0] = 72; print(ba)             # → bytearray(b'Hello')\nba.append(33); print(bytes(ba))   # → b'Hello!'\nprint(bytearray.fromhex(\"4142\"))  # → bytearray(b'AB')\nba2 = bytearray(b\"abc\")\nba2.extend(b\"def\"); print(ba2)   # → bytearray(b'abcdef')","version":null,"docs":"https://docs.python.org/3/library/stdtypes.html"},{"id":"type","name":"type()","group":"Типы данных","subcat":"интроспекция","cg":"op","description":"Встроенная функция, возвращающая тип объекта. С одним аргументом возвращает тип; с тремя — создаёт новый класс динамически.","syntax":"type(object) -> type","examples":"print(type(42))  # → <class 'int'>\nprint(type(3.14))  # → <class 'float'>\nprint(type(\"hi\"))  # → <class 'str'>\nprint(type(True))  # → <class 'bool'>\nprint(type(None))  # → <class 'NoneType'>\nx = 42\nprint(type(x) == int)  # → True (сравнение типов)\nprint(type(True) == type(1))  # → False (bool != int при type())","version":null,"docs":"https://docs.python.org/3/library/stdtypes.html"},{"id":"isinstance","name":"isinstance()","group":"Типы данных","subcat":"интроспекция","cg":"op","description":"Встроенная функция проверки принадлежности объекта к типу или кортежу типов. В отличие от type(), учитывает наследование.","syntax":"isinstance(object, classinfo) -> bool","examples":"print(isinstance(42, int))  # → True\nprint(isinstance(3.14, float))  # → True\nprint(isinstance(True, int))  # → True (bool — подкласс int)\nprint(isinstance(\"hi\", (int, str)))  # → True (кортеж типов)\nprint(isinstance([], list))  # → True\ndef add(a, b):\n    if not isinstance(a, (int, float)):\n        raise TypeError(\"Нужно число\")\n    return a + b\nprint(add(2, 3))  # → 5","version":null,"docs":"https://docs.python.org/3/library/stdtypes.html"},{"id":"bool","name":"bool","group":"Типы данных","subcat":"логика","cg":"op","description":"Булев тип, подтип int. Имеет два значения: True (1) и False (0). Используется в условных выражениях и логических операциях.","syntax":"bool([x])","examples":"print(True, False)  # → True False\nprint(5 > 3)  # → True\nprint(True and False)  # → False\nprint(bool(0), bool(1), bool(\"\"))  # → False True False\nprint(bool([]), bool([1]))  # → False True (falsy / truthy)\nprint(True + True)  # → 2 (bool является подтипом int)\nprint(not True)  # → False","version":null,"docs":"https://docs.python.org/3/library/stdtypes.html"},{"id":"преобразование-типов","name":"Преобразование типов","group":"Типы данных","subcat":"преобразование","cg":"op","description":"Явное приведение одного типа к другому с помощью встроенных функций int(), float(), str(), bool(). При невозможной конвертации возникает ValueError или TypeError.","syntax":"int(x) | float(x) | str(x) | bool(x)","examples":"print(int(3.9))  # → 3 (отбрасывание дробной части)\nprint(int(\"42\"))  # → 42\nprint(float(7))  # → 7.0\nprint(str(100))  # → \"100\"\nprint(bool(0))  # → False\nprint(bool(\"\"))  # → False\nprint(int(\"3.14\"))  # → ValueError (нельзя напрямую)\nprint(int(float(\"3.14\")))  # → 3 (через float)","version":null,"docs":"https://docs.python.org/3/library/stdtypes.html"},{"id":"ellipsis-...","name":"Ellipsis ...","group":"Типы данных","subcat":"специальные","cg":"op","description":"Специальный синглтон Ellipsis (литерал ...). Используется как заглушка тела функции/класса, в аннотациях типов (Callable[..., int]), в NumPy для многомерных срезов.","syntax":"...  Ellipsis  type(...) -> ellipsis","examples":"print(...)                # → Ellipsis\nprint(... is Ellipsis)    # → True\ndef stub(): ...           # заглушка тела вместо pass\nprint(type(...))          # → <class 'ellipsis'>\nx = ...; print(x == Ellipsis)  # → True\nprint(bool(...))          # → True","version":null,"docs":"https://docs.python.org/3/library/stdtypes.html"},{"id":"str","name":"str","group":"Типы данных","subcat":"строки","cg":"op","description":"Неизменяемый тип строки в Python. Поддерживает Unicode. Можно создавать одинарными, двойными или тройными кавычками.","syntax":"str([object]) | \"текст\" | 'текст'","examples":"greeting = \"Привет\"  # строковый литерал\nfull = \"Иван\" + \" \" + \"Иванов\"  # конкатенация → Иван Иванов\nline = \"-\" * 20  # умножение → --------------------\nprint(len(\"Python\"))  # → 6\nprint(\"Py\" in \"Python\")  # → True\nprint(\"Python\"[0])  # → P (индексирование)\nprint(\"Python\"[1:4])  # → yth (срез)","version":null,"docs":"https://docs.python.org/3/library/stdtypes.html"},{"id":"int","name":"int","group":"Типы данных","subcat":"числа","cg":"op","description":"Целочисленный тип данных в Python. Поддерживает числа произвольной точности. Литералы можно записывать в двоичной (0b), восьмеричной (0o) и шестнадцатеричной (0x) системах.","syntax":"int([x]) | int(x, base)","examples":"x = 42  # обычное целое\ny = -7  # отрицательное\nn = int(\"123\")  # из строки → 123\nb = 0b1010  # двоичный → 10\nh = 0xFF  # шестнадцатеричный → 255\nbig = 10 ** 100  # Python поддерживает big int без ограничений\nprint(int(\"FF\", 16))  # → 255 (из строки с основанием)","version":null,"docs":"https://docs.python.org/3/library/stdtypes.html"},{"id":"float","name":"float","group":"Типы данных","subcat":"числа","cg":"op","description":"Тип для чисел с плавающей точкой (double precision, 64 бита). Используется для дробных вычислений; может представлять inf и nan.","syntax":"float([x])","examples":"x = 3.14  # литерал float\ny = 1e6  # 1000000.0 (экспоненциальная запись)\nz = float(\"2.71\")  # из строки → 2.71\nprint(round(0.1 + 0.2, 10))  # → 0.3 (ошибка точности IEEE 754)\nimport math; print(math.inf)  # → inf\nprint(float(\"nan\"))  # → nan\nprint(0.1 + 0.2 == 0.3)  # → False (проблема точности float)","version":null,"docs":"https://docs.python.org/3/library/stdtypes.html"},{"id":"complex","name":"complex","group":"Типы данных","subcat":"числа","cg":"op","description":"Комплексные числа с вещественной и мнимой частями. Записываются как a+bj. Поддерживают арифметику, атрибуты .real и .imag, abs() даёт модуль.","syntax":"complex(real, imag)  a+bj  z.real  z.imag  abs(z)  z.conjugate()","examples":"z = 3 + 4j; print(z)           # → (3+4j)\nprint(complex(3, 4))            # → (3+4j)\nprint(z.real, z.imag)           # → 3.0 4.0\nprint(abs(z))                   # → 5.0\nprint((1+2j) * (3+4j))          # → (-5+10j)\nprint(z.conjugate())            # → (3-4j)","version":null,"docs":"https://docs.python.org/3/library/stdtypes.html"},{"id":"int.bit_length-to_bytes-from_bytes","name":"int.bit_length() / to_bytes() / from_bytes()","group":"Типы данных","subcat":"числа","cg":"op","description":"bit_length() возвращает число бит, необходимых для записи числа. to_bytes() сериализует целое в байты. from_bytes() десериализует байты обратно в int.","syntax":"n.bit_length()  n.to_bytes(length, byteorder)  int.from_bytes(bytes, byteorder)","examples":"print((255).bit_length())           # → 8\nprint((1024).bit_length())          # → 11\nprint((7).to_bytes(2, \"big\"))       # → b'\\x00\\x07'\nprint((255).to_bytes(1, \"little\"))  # → b'\\xff'\nprint(int.from_bytes(b\"\\x00\\x07\", \"big\"))  # → 7\nprint(int.from_bytes(b\"\\xff\", \"big\"))       # → 255","version":null,"docs":"https://docs.python.org/3/library/stdtypes.html"},{"id":"сложение","name":"+ сложение","group":"Арифметика и операторы","subcat":"арифметика","cg":"op","description":"Бинарный оператор сложения. Для чисел — арифметическое сложение; для строк и списков — конкатенация; для множеств — объединение.","syntax":"a + b","examples":"print(3 + 5)  # → 8\nprint(\"Привет\" + \" \" + \"мир\")  # → Привет мир\nprint([1, 2] + [3, 4])  # → [1, 2, 3, 4]\nprint(1.5 + 2.5)  # → 4.0\nprint(10 ** 18 + 10 ** 18)  # → 2000000000000000000 (big int)\nx = 5; print(+x)  # → 5 (унарный плюс)","version":null,"docs":"https://docs.python.org/3/"},{"id":"вычитание","name":"- вычитание","group":"Арифметика и операторы","subcat":"арифметика","cg":"op","description":"Бинарный оператор вычитания. Унарный минус меняет знак числа.","syntax":"a - b | -a","examples":"print(10 - 3)  # → 7\nprint(3.5 - 1.1)  # → 2.4 (float)\nx = 5; print(-x)  # → -5 (унарный минус)\nprint(0 - 100)  # → -100\nfrom datetime import date\ndelta = date(2025, 12, 31) - date(2025, 1, 1)\nprint(delta.days)  # → 364 (разница дат)","version":null,"docs":"https://docs.python.org/3/"},{"id":"умножение","name":"* умножение","group":"Арифметика и операторы","subcat":"арифметика","cg":"op","description":"Бинарный оператор умножения. Для строк и списков — повторение.","syntax":"a * b","examples":"print(6 * 7)  # → 42\nprint(\"ab\" * 3)  # → ababab\nprint([0] * 5)  # → [0, 0, 0, 0, 0]\nprint(2.5 * 4)  # → 10.0\nprint(3 * 3 * 3)  # → 27 (куб без оператора **)\nmatrix = [[0] * 3 for _ in range(3)]  # 3x3 нулевая матрица\nprint(matrix[0])  # → [0, 0, 0]","version":null,"docs":"https://docs.python.org/3/"},{"id":"деление","name":"/ деление","group":"Арифметика и операторы","subcat":"арифметика","cg":"op","description":"Оператор деления. Всегда возвращает float, даже при делении двух целых. Деление на ноль вызывает ZeroDivisionError.","syntax":"a / b -> float","examples":"print(10 / 2)  # → 5.0 (всегда float)\nprint(7 / 2)  # → 3.5\nprint(1 / 3)  # → 0.3333333333333333\nprint(type(6 / 2))  # → <class 'float'>\ntry:\n    print(1 / 0)\nexcept ZeroDivisionError:\n    print(\"Деление на ноль!\")  # → Деление на ноль!\nprint(9 / 3)  # → 3.0","version":null,"docs":"https://docs.python.org/3/"},{"id":"целочисленное-деление","name":"// целочисленное деление","group":"Арифметика и операторы","subcat":"арифметика","cg":"op","description":"Оператор целочисленного (этажного) деления. Возвращает наибольшее целое, не превышающее частное. Для float аргументов возвращает float.","syntax":"a // b","examples":"print(7 // 2)  # → 3\nprint(-7 // 2)  # → -4 (округление к меньшему, не к нулю!)\nprint(7.5 // 2)  # → 3.0 (float аргумент → float результат)\nprint(100 // 10)  # → 10\nseconds = 3661\nprint(seconds // 3600)  # → 1 (полные часы)\nprint(seconds % 3600 // 60)  # → 1 (минуты)","version":null,"docs":"https://docs.python.org/3/"},{"id":"остаток","name":"% остаток","group":"Арифметика и операторы","subcat":"арифметика","cg":"op","description":"Оператор получения остатка от деления (modulo). Знак результата совпадает со знаком делителя. Широко используется для проверки чётности и цикличности.","syntax":"a % b","examples":"print(10 % 3)  # → 1\nprint(7 % 2)  # → 1 (нечётное число)\nprint(8 % 2)  # → 0 (чётное число)\nprint(123 % 10)  # → 3 (последняя цифра)\nseconds = 3661; print(seconds % 60)  # → 1 (секунды)\nprint(15 % 5)  # → 0 (кратно)\ntry:\n    print(5 % 0)\nexcept ZeroDivisionError:\n    print(\"Деление на ноль\")  # → Деление на ноль","version":null,"docs":"https://docs.python.org/3/"},{"id":"степень","name":"** степень","group":"Арифметика и операторы","subcat":"арифметика","cg":"op","description":"Оператор возведения в степень. Выполняется справа налево (правоассоциативен). Поддерживает дробные степени (корни) и отрицательные показатели.","syntax":"a ** b","examples":"print(2 ** 10)  # → 1024\nprint(3 ** 3)  # → 27\nprint(16 ** 0.5)  # → 4.0 (квадратный корень)\nprint(27 ** (1/3))  # → 3.0 (кубический корень)\nprint(2 ** -1)  # → 0.5 (отрицательная степень)\nprint(2 ** 100)  # → большое число (Python big int)","version":null,"docs":"https://docs.python.org/3/"},{"id":"побитовые-операторы","name":"Побитовые операторы","group":"Арифметика и операторы","subcat":"битовые","cg":"op","description":"Операторы для работы с числами на уровне отдельных бит: & (AND), | (OR), ^ (XOR), ~ (NOT/инверсия), << (сдвиг влево), >> (сдвиг вправо).","syntax":"a & b  a | b  a ^ b  ~a  a << n  a >> n","examples":"print(0b1100 & 0b1010)  # → 8   (0b1000)\nprint(0b1100 | 0b1010)  # → 14  (0b1110)\nprint(0b1100 ^ 0b1010)  # → 6   (0b0110)\nprint(~5)               # → -6\nprint(1 << 3)           # → 8\nprint(16 >> 2)          # → 4","version":null,"docs":"https://docs.python.org/3/"},{"id":"walrus-operator","name":"Walrus operator :=","group":"Арифметика и операторы","subcat":"операторы","cg":"op","description":"Оператор «морж» (:=) — присваивает значение переменной прямо внутри выражения (Python 3.8+). Удобен в условиях while, в list comprehension и в if.","syntax":"variable := expression","examples":"data = [1, 2, 3, 4]\nwhile chunk := data[:2]:\n    data = data[2:]; print(chunk)  # → [1, 2]  затем [3, 4]\nnums = [1, -2, 3, -4]\npos = [y for x in nums if (y := x * 2) > 0]\nprint(pos)  # → [2, 6]\nif n := len(\"hello\"): print(n)  # → 5\ns = \"abcdef\"\nif m := len(s) > 3: print(\"длинная\")  # → длинная","version":"3.8+","docs":"https://docs.python.org/3/"},{"id":"приоритет-операций","name":"Приоритет операций","group":"Арифметика и операторы","subcat":"приоритет","cg":"op","description":"Порядок вычисления выражений: ** > унарный минус > * / // % > + -. Скобки повышают приоритет. Помнить: PEMDAS / BODMAS.","syntax":"( ) → ** → -x → * / // % → + -","examples":"print(2 + 3 * 4)  # → 14 (сначала умножение)\nprint((2 + 3) * 4)  # → 20 (скобки первыми)\nprint(2 ** 3 ** 2)  # → 512 (правоассоциативность: 3**2=9, 2**9)\nprint(-2 ** 2)  # → -4 (сначала степень, потом минус)\nprint(10 - 3 + 2)  # → 9 (слева направо)\nprint(10 % 3 + 1)  # → 2 (% раньше +)","version":null,"docs":"https://docs.python.org/3/"},{"id":"операторы-присваивания","name":"Операторы присваивания","group":"Арифметика и операторы","subcat":"присваивание","cg":"op","description":"Составные операторы присваивания: +=, -=, *=, /=, //=, %=, **=. Сочетают операцию с присваиванием, изменяя переменную на месте.","syntax":"x op= value  # эквивалент x = x op value","examples":"x = 10; x += 5; print(x)  # → 15\nx = 10; x -= 3; print(x)  # → 7\nx = 4; x *= 3; print(x)  # → 12\nx = 10; x /= 4; print(x)  # → 2.5\nx = 10; x //= 3; print(x)  # → 3\nx = 10; x %= 3; print(x)  # → 1\nx = 2; x **= 8; print(x)  # → 256","version":null,"docs":"https://docs.python.org/3/"},{"id":"цепочка-сравнений","name":"Цепочка сравнений","group":"Арифметика и операторы","subcat":"сравнение","cg":"op","description":"Python позволяет записывать несколько сравнений подряд в одном выражении. Выражение 1 < x < 10 эквивалентно (1 < x) and (x < 10) и вычисляется слева направо.","syntax":"a < b < c  a == b == c  a <= b >= c","examples":"x = 5\nprint(1 < x < 10)      # → True\nprint(1 < x < 4)       # → False\nprint(1 == 1 == 1)     # → True\nprint(1 == 1 == 2)     # → False\nprint(0 <= x <= 100)   # → True\nprint(10 > x > 0)      # → True","version":null,"docs":"https://docs.python.org/3/"},{"id":"round","name":"round()","group":"Арифметика и операторы","subcat":"числа","cg":"op","description":"Встроенная функция округления числа. С одним аргументом возвращает int; с ndigits — округляет до указанного количества знаков после запятой. Использует банковское (к ближайшему чётному) округление.","syntax":"round(number[, ndigits])","examples":"print(round(3.7))  # → 4\nprint(round(3.14159, 2))  # → 3.14\nprint(round(2.5))  # → 2 (банковское округление к чётному)\nprint(round(3.5))  # → 4 (банковское округление к чётному)\nprint(round(12345, -2))  # → 12300 (до сотен)\nprint(round(0.1 + 0.2, 10))  # → 0.3 (компенсация float погрешности)","version":null,"docs":"https://docs.python.org/3/"},{"id":"abs","name":"abs()","group":"Арифметика и операторы","subcat":"числа","cg":"op","description":"Встроенная функция, возвращающая абсолютное значение (модуль) числа. Работает с int, float и complex.","syntax":"abs(x)","examples":"print(abs(-7))  # → 7\nprint(abs(3.14))  # → 3.14\nprint(abs(-0.0))  # → 0.0\nprint(abs(3 + 4j))  # → 5.0 (модуль комплексного числа)\nnums = [-3, 1, -5, 2]\nprint(max(nums, key=abs))  # → -5 (наибольший по модулю)","version":null,"docs":"https://docs.python.org/3/"},{"id":"divmod","name":"divmod()","group":"Арифметика и операторы","subcat":"числа","cg":"op","description":"Встроенная функция, возвращающая кортеж (частное, остаток) — результат целочисленного деления и остатка. Эффективнее двух отдельных операций.","syntax":"divmod(a, b) -> (a // b, a % b)","examples":"print(divmod(10, 3))  # → (3, 1)\nh, m = divmod(150, 60)\nprint(f\"{h} ч {m} мин\")  # → 2 ч 30 мин\npages, rem = divmod(105, 10)\nprint(f\"{pages} страниц, остаток {rem}\")  # → 10 страниц, остаток 5\nq, r = divmod(17, 5)\nprint(f\"17 = 5 * {q} + {r}\")  # → 17 = 5 * 3 + 2\nprint(divmod(-7, 2))  # → (-4, 1) (знак остатка — как у делителя)","version":null,"docs":"https://docs.python.org/3/"},{"id":"pow","name":"pow()","group":"Арифметика и операторы","subcat":"числа","cg":"op","description":"Встроенная функция возведения в степень. С двумя аргументами — как **; с тремя (base, exp, mod) — модульное возведение в степень, эффективно для больших чисел.","syntax":"pow(base, exp[, mod])","examples":"print(pow(2, 10))  # → 1024\nprint(pow(3, 3))  # → 27\nprint(pow(2, -1))  # → 0.5 (отрицательный показатель)\nprint(pow(2, 10, 1000))  # → 24 (2**10 % 1000, модульная арифметика)\nprint(pow(3, 100, 7))  # → 4 (быстрое вычисление по модулю)","version":null,"docs":"https://docs.python.org/3/"},{"id":"match-case","name":"match / case","group":"Условный оператор","subcat":"pattern matching","cg":"op","description":"Structural Pattern Matching (Python 3.10+). Позволяет сопоставлять значение с образцами: литералами, типами, структурами. case _ — универсальный паттерн (аналог else). Guard (if) добавляет дополнительное условие в ветку case.","syntax":"match subject:\n    case pattern1: ...\n    case pattern2 if guard: ...\n    case _: ...","examples":"match \"quit\":\n    case \"quit\": print(\"выход\")   # → выход\n    case \"help\": print(\"помощь\")  # → помощь\n    case _:      print(\"неизвестно\")\npoint = (0, 1)\nmatch point:\n    case (0, 0): print(\"начало\")\n    case (0, y): print(f\"ось Y, y={y}\")  # → ось Y, y=1\n    case (x, y) if x == y: print(\"диагональ\")\n    case _: print(\"общий\")\nmatch 42:\n    case int(n) if n > 10: print(f\"большое {n}\")  # → большое 42\n    case _: print(\"другое\")","version":"3.10+","docs":"https://docs.python.org/3/"},{"id":"if","name":"if","group":"Условный оператор","subcat":"ветвление","cg":"op","description":"Оператор условного ветвления. Выполняет блок кода, если условие истинно. Условие — любое выражение, которое Python приводит к bool.","syntax":"if условие:\n    блок","examples":"x = 5\nif x > 0:\n    print(\"положительное\")  # → положительное\nif \"Python\" in \"Я учу Python\":\n    print(\"нашли\")  # → нашли\nlst = [1, 2, 3]\nif lst:\n    print(\"список не пуст\")  # → список не пуст\nname = None\nif name is None:\n    name = \"Гость\"  # name → \"Гость\"\nflag = True\nif flag:\n    print(\"флаг установлен\")  # → флаг установлен\nif x > 0:\n    if x < 10:\n        print(\"однозначное\")  # → однозначное","version":null,"docs":"https://docs.python.org/3/"},{"id":"if-else","name":"if-else","group":"Условный оператор","subcat":"ветвление","cg":"op","description":"Двухветочный оператор условия. Если условие истинно — выполняется if-блок, иначе — else-блок.","syntax":"if условие:\n    блок1\nelse:\n    блок2","examples":"x = -3\nif x >= 0:\n    print(\"неотрицательное\")\nelse:\n    print(\"отрицательное\")  # → отрицательное\nn = 7\nif n % 2 == 0:\n    print(\"чётное\")\nelse:\n    print(\"нечётное\")  # → нечётное\ns = \"\"\nif s:\n    print(\"не пусто\")\nelse:\n    print(\"пусто\")  # → пусто\nval = None\nresult = val if val is not None else 0\nprint(result)  # → 0","version":null,"docs":"https://docs.python.org/3/"},{"id":"if-elif-else","name":"if-elif-else","group":"Условный оператор","subcat":"ветвление","cg":"op","description":"Каскадный оператор выбора из нескольких вариантов. Проверяет условия последовательно, выполняет первый истинный блок.","syntax":"if условие1:\n    ...\nelif условие2:\n    ...\nelse:\n    ...","examples":"score = 75\nif score >= 90:\n    grade = \"A\"\nelif score >= 75:\n    grade = \"B\"\nelif score >= 60:\n    grade = \"C\"\nelse:\n    grade = \"F\"\nprint(grade)  # → B\nhour = 14\nif hour < 12:\n    print(\"утро\")\nelif hour < 18:\n    print(\"день\")  # → день\nelse:\n    print(\"вечер\")","version":null,"docs":"https://docs.python.org/3/"},{"id":"вложенные-условия","name":"Вложенные условия","group":"Условный оператор","subcat":"ветвление","cg":"op","description":"Оператор if внутри другого if. Позволяет проверять комбинации условий. Следует использовать осторожно — глубокая вложенность снижает читаемость.","syntax":"if условие1:\n    if условие2:\n        блок","examples":"x = 15\nif x > 0:\n    if x % 2 == 0:\n        print(\"положительное чётное\")\n    else:\n        print(\"положительное нечётное\")  # → положительное нечётное\nage, has_ticket = 20, True\nif age >= 18:\n    if has_ticket:\n        print(\"вход разрешён\")  # → вход разрешён\nn = 100\nif n >= 10:\n    if n <= 999:\n        print(\"двух/трёхзначное\")  # → двух/трёхзначное\na, b = 5, 10\nif a > 0:\n    if b > 0:\n        if a + b > 12:\n            print(\"сумма > 12\")  # → сумма > 12","version":null,"docs":"https://docs.python.org/3/"},{"id":"тернарный-оператор","name":"Тернарный оператор","group":"Условный оператор","subcat":"ветвление","cg":"op","description":"Компактная форма if-else в одну строку. Возвращает одно из двух значений в зависимости от условия. Читается: «значение_если_истина if условие else значение_если_ложь».","syntax":"значение_если_истина if условие else значение_если_ложь","examples":"x = 7\nresult = \"чётное\" if x % 2 == 0 else \"нечётное\"\nprint(result)  # → нечётное\na, b = 3, 9\nbigger = a if a > b else b\nprint(bigger)  # → 9\nn = -5\nabs_n = n if n >= 0 else -n\nprint(abs_n)  # → 5\nage = 20\nstatus = \"совершеннолетний\" if age >= 18 else \"несовершеннолетний\"\nprint(status)  # → совершеннолетний\nlst = [1, 2, 3]\nprint(\"есть\" if lst else \"пусто\")  # → есть\nname = None\nprint(name if name else \"Гость\")  # → Гость","version":null,"docs":"https://docs.python.org/3/"},{"id":"and-or-not","name":"and, or, not","group":"Условный оператор","subcat":"логика","cg":"op","description":"Логические операторы. and — оба истинны; or — хотя бы одно истинно; not — отрицание. Используют короткое замыкание (lazy evaluation).","syntax":"a and b | a or b | not a","examples":"print(True and False)  # → False\nprint(True or False)  # → True\nprint(not True)  # → False\nage, has_id = 20, True\nprint(age >= 18 and has_id)  # → True\nx = 5\nprint(x < 0 or x > 3)  # → True\nprint(1 < x < 10)  # → True (цепочка = неявный and)\nname = \"\" or \"Гость\"\nprint(name)  # → Гость (короткое замыкание or)\nval = None\nsafe = val and val.strip()  # → None (не вызывает ошибку из-за and)","version":null,"docs":"https://docs.python.org/3/"},{"id":"операторы-сравнения","name":"Операторы сравнения","group":"Условный оператор","subcat":"операторы","cg":"op","description":"Операторы ==, !=, >, <, >=, <= сравнивают два значения и возвращают bool. Python поддерживает цепочки сравнений: a < b < c.","syntax":"a == b | a != b | a > b | a < b | a >= b | a <= b","examples":"print(5 == 5)  # → True\nprint(5 != 3)  # → True\nprint(7 > 3)  # → True\nprint(2 < 1)  # → False\nprint(5 >= 5)  # → True\nprint(\"abc\" < \"abd\")  # → True (лексикографически)\nx = 5\nprint(1 < x < 10)  # → True (цепочка сравнений)\nprint(1 < x < 4)  # → False","version":null,"docs":"https://docs.python.org/3/"},{"id":"in","name":"in","group":"Условный оператор","subcat":"принадлежность","cg":"op","description":"Оператор принадлежности. Проверяет, содержится ли элемент в коллекции. Работает со строками, списками, кортежами, множествами, словарями (по ключам).","syntax":"элемент in коллекция -> bool","examples":"print(\"a\" in \"banana\")  # → True\nprint(3 in [1, 2, 3, 4])  # → True\nprint(5 not in [1, 2, 3])  # → True\nd = {\"a\": 1, \"b\": 2}\nprint(\"a\" in d)  # → True (по ключам)\nprint(1 in d.values())  # → True (по значениям)\nprint(\"py\" in \"python\")  # → True (подстрока)\nprint(7 in {1, 3, 7, 9})  # → True (множество)","version":null,"docs":"https://docs.python.org/3/"},{"id":"is-is-not","name":"is / is not","group":"Условный оператор","subcat":"тождество","cg":"op","description":"Операторы тождества. Проверяют, указывают ли две переменные на ОДИН объект в памяти. Используйте is/is not для проверки None, True, False — не ==.","syntax":"a is b | a is not b","examples":"print(None is None)  # → True\nx = None\nprint(x is None)  # → True (правильная проверка)\nprint(x == None)  # → True (работает, но стиль PEP8 — is)\na = [1, 2]; b = a\nprint(a is b)  # → True (одна ссылка)\nc = [1, 2]\nprint(a is c)  # → False (разные объекты с одинаковым значением)\nprint(a == c)  # → True (равные по значению)","version":null,"docs":"https://docs.python.org/3/"},{"id":"range","name":"range()","group":"Циклы","subcat":"range","cg":"op","description":"Встроенная функция, генерирующая последовательность целых чисел. Не хранит все числа в памяти — ленивая генерация. Используется в for-циклах.","syntax":"range(stop) | range(start, stop) | range(start, stop, step)","examples":"print(list(range(5)))  # → [0, 1, 2, 3, 4]\nprint(list(range(2, 8)))  # → [2, 3, 4, 5, 6, 7]\nprint(list(range(0, 10, 2)))  # → [0, 2, 4, 6, 8]\nprint(list(range(10, 0, -2)))  # → [10, 8, 6, 4, 2]\nprint(list(range(5, 5)))  # → [] (пустой при start==stop)\nprint(list(range(-3, 3)))  # → [-3, -2, -1, 0, 1, 2]\nprint(sum(range(101)))  # → 5050 (сумма 1..100)\nfor i in range(3, 0, -1):\n    print(i, end=\" \")  # → 3 2 1","version":null,"docs":"https://docs.python.org/3/"},{"id":"вложенные-циклы","name":"Вложенные циклы","group":"Циклы","subcat":"вложенность","cg":"op","description":"Цикл внутри другого цикла. Внутренний цикл выполняется полностью на каждой итерации внешнего. break/continue работают только с ближайшим циклом.","syntax":"for i in ...:\n    for j in ...:\n        блок","examples":"for i in range(1, 4):\n    for j in range(1, 4):\n        print(f\"{i}*{j}={i*j}\", end=\"  \")\n    print()  # таблица умножения 3x3\nmatrix = [[1, 2, 3], [4, 5, 6]]\nfor row in matrix:\n    for val in row:\n        print(val, end=\" \")  # → 1 2 3 4 5 6\nfound = False\nfor i in range(3):\n    for j in range(3):\n        if i == 1 and j == 1:\n            found = True\n            break\n    if found:\n        break\nprint(found)  # → True\npairs = [(i, j) for i in range(3) for j in range(3) if i != j]\nprint(len(pairs))  # → 6","version":null,"docs":"https://docs.python.org/3/"},{"id":"enumerate","name":"enumerate()","group":"Циклы","subcat":"итерация","cg":"op","description":"Встроенная функция, добавляющая счётчик к итерируемому объекту. Возвращает кортежи (индекс, значение). Параметр start задаёт начальный индекс.","syntax":"enumerate(iterable, start=0)","examples":"fruits = [\"яблоко\", \"банан\", \"вишня\"]\nfor i, fruit in enumerate(fruits):\n    print(i, fruit)  # 0 яблоко / 1 банан / 2 вишня\nfor i, fruit in enumerate(fruits, start=1):\n    print(f\"{i}. {fruit}\")  # 1. яблоко / 2. банан / 3. вишня\nlst = [10, 20, 30, 40]\nfor i, v in enumerate(lst):\n    if v == 20:\n        print(\"индекс 20:\", i)  # → индекс 20: 1\nnums = [5, 3, 8, 1]\nmax_i, max_v = max(enumerate(nums), key=lambda x: x[1])\nprint(max_i, max_v)  # → 2 8","version":null,"docs":"https://docs.python.org/3/"},{"id":"zip","name":"zip()","group":"Циклы","subcat":"итерация","cg":"op","description":"Встроенная функция, объединяющая несколько итерируемых объектов в один. Возвращает кортежи из соответствующих элементов. Останавливается по наименьшему.","syntax":"zip(*iterables)","examples":"names = [\"Анна\", \"Борис\", \"Вера\"]\nscores = [95, 78, 88]\nfor name, score in zip(names, scores):\n    print(f\"{name}: {score}\")  # Анна: 95 / Борис: 78 / Вера: 88\na, b, c = [1, 2], [3, 4], [5, 6]\nfor x, y, z in zip(a, b, c):\n    print(x + y + z, end=\" \")  # → 9 12\nd = dict(zip([\"a\", \"b\", \"c\"], [1, 2, 3]))\nprint(d)  # → {\"a\": 1, \"b\": 2, \"c\": 3}\nfrom itertools import zip_longest\nresult = list(zip_longest([1, 2, 3], [10, 20], fillvalue=0))\nprint(result)  # → [(1, 10), (2, 20), (3, 0)]","version":null,"docs":"https://docs.python.org/3/"},{"id":"zip-strict-true","name":"zip(strict=True)","group":"Циклы","subcat":"итерация","cg":"op","description":"Параметр strict=True (Python 3.10+) заставляет zip() выбрасывать ValueError, если переданные итерируемые объекты имеют разную длину. Без strict= zip молча останавливается на самом коротком.","syntax":"zip(*iterables, strict=False)","examples":"print(list(zip([1,2],[\"a\",\"b\"])))      # → [(1, 'a'), (2, 'b')]\nprint(list(zip([1,2,3],[\"a\",\"b\"])))    # → [(1, 'a'), (2, 'b')]  (3 потеряна)\ntry:\n    list(zip([1,2,3],[\"a\",\"b\"], strict=True))\nexcept ValueError as e:\n    print(\"ValueError:\", e)  # → ValueError: zip() has arguments...\nprint(list(zip([1,2],[\"a\",\"b\"], strict=True)))  # → [(1, 'a'), (2, 'b')]","version":"3.10+","docs":"https://docs.python.org/3/"},{"id":"обработка-цифр-числа","name":"Обработка цифр числа","group":"Циклы","subcat":"практика","cg":"op","description":"Паттерн перебора цифр числа через строковое преобразование или деление на 10. Используется для задач: сумма цифр, произведение, подсчёт, максимальная цифра.","syntax":"for d in str(abs(n)): | while n > 0: d = n % 10; n //= 10","examples":"n = 12345\ndigit_sum = sum(int(d) for d in str(n))\nprint(digit_sum)  # → 15\nproduct = 1\nfor d in str(n):\n    product *= int(d)\nprint(product)  # → 120\ncount = len(str(abs(n)))\nprint(count)  # → 5 (количество цифр)\nmax_digit = max(int(d) for d in str(n))\nprint(max_digit)  # → 5\nn2 = 4321\nreversed_n = int(str(n2)[::-1])\nprint(reversed_n)  # → 1234 (перевёрнутое число)","version":null,"docs":"https://docs.python.org/3/"},{"id":"break","name":"break","group":"Циклы","subcat":"управление","cg":"op","description":"Оператор немедленного выхода из ближайшего цикла. При наличии else-блока у цикла — он НЕ выполняется после break.","syntax":"break","examples":"for i in range(10):\n    if i == 5:\n        break\nprint(i)  # → 5\nlst = [1, 3, 7, 4, 9]\nfor x in lst:\n    if x % 2 == 0:\n        print(\"первое чётное:\", x)  # → первое чётное: 4\n        break\nfound = False\ntarget = 7\nfor x in lst:\n    if x == target:\n        found = True\n        break\nprint(found)  # → True\ni = 0\nwhile True:\n    i += 1\n    if i >= 3:\n        break\nprint(i)  # → 3","version":null,"docs":"https://docs.python.org/3/"},{"id":"continue","name":"continue","group":"Циклы","subcat":"управление","cg":"op","description":"Оператор пропуска оставшейся части тела цикла и перехода к следующей итерации.","syntax":"continue","examples":"for i in range(10):\n    if i % 2 == 0:\n        continue\n    print(i, end=\" \")  # → 1 3 5 7 9\nfor x in [1, 0, 3, 0, 5]:\n    if x == 0:\n        continue\n    print(100 // x, end=\" \")  # → 100 33 20 (без деления на 0)\nfor ch in \"hello world\":\n    if ch == \" \":\n        continue\n    print(ch, end=\"\")  # → helloworld\ntotal = 0\nfor n in range(1, 11):\n    if n % 3 == 0:\n        continue\n    total += n\nprint(total)  # → 37 (сумма 1..10 без кратных 3)","version":null,"docs":"https://docs.python.org/3/"},{"id":"else-в-циклах","name":"else в циклах","group":"Циклы","subcat":"управление","cg":"op","description":"Блок else у цикла выполняется, только если цикл завершился БЕЗ break. Удобен для паттерна «поиск с флагом».","syntax":"for/while ...:\n    ...\nelse:\n    блок_если_не_break","examples":"for i in range(2, 10):\n    if 15 % i == 0:\n        print(f\"15 делится на {i}\")  # → 15 делится на 3\n        break\nelse:\n    print(\"15 простое\")  # не выполнится\ntarget = 99\nfor x in [1, 2, 3]:\n    if x == target:\n        break\nelse:\n    print(\"не найдено\")  # → не найдено\ni = 0\nwhile i < 3:\n    i += 1\nelse:\n    print(\"while завершён штатно\")  # → while завершён штатно","version":null,"docs":"https://docs.python.org/3/"},{"id":"for","name":"for","group":"Циклы","subcat":"цикл for","cg":"op","description":"Цикл перебора элементов итерируемого объекта. Выполняет тело цикла для каждого элемента: списка, строки, range, словаря и т.д.","syntax":"for переменная in итерируемое:\n    блок","examples":"for x in [1, 2, 3]:\n    print(x, end=\" \")  # → 1 2 3\nfor ch in \"abc\":\n    print(ch, end=\"\")  # → abc\nfor i in range(5):\n    print(i, end=\" \")  # → 0 1 2 3 4\nd = {\"a\": 1, \"b\": 2}\nfor k, v in d.items():\n    print(f\"{k}:{v}\", end=\" \")  # → a:1 b:2\nfor i, val in enumerate([\"x\", \"y\", \"z\"], start=1):\n    print(f\"{i}.{val}\", end=\" \")  # → 1.x 2.y 3.z\nfor a, b in zip([1, 2], [10, 20]):\n    print(a + b, end=\" \")  # → 11 22","version":null,"docs":"https://docs.python.org/3/"},{"id":"for-...-in-reversed","name":"for ... in reversed()","group":"Циклы","subcat":"цикл for","cg":"op","description":"reversed() возвращает итератор, обходящий последовательность в обратном порядке. Работает со списками, кортежами, строками, range и любыми объектами с __reversed__.","syntax":"for item in reversed(sequence): ...","examples":"for x in reversed([1,2,3]): print(x, end=\" \")  # → 3 2 1\nprint(list(reversed(range(5))))   # → [4, 3, 2, 1, 0]\nfor ch in reversed(\"abc\"): print(ch, end=\"\")  # → cba\nt = (10, 20, 30)\nfor v in reversed(t): print(v, end=\" \")  # → 30 20 10\nprint(list(reversed([\"a\",\"b\",\"c\"])))  # → ['c', 'b', 'a']","version":null,"docs":"https://docs.python.org/3/"},{"id":"распаковка-в-for","name":"Распаковка в for","group":"Циклы","subcat":"цикл for","cg":"op","description":"При итерации по последовательности кортежей (или других итерируемых) можно сразу распаковывать элементы в несколько переменных прямо в заголовке for.","syntax":"for x, y in iterable: ...\nfor a, b, c in iterable: ...","examples":"for x, y in [(1,2),(3,4),(5,6)]:\n    print(x+y, end=\" \")  # → 3 7 11\npairs = {\"a\":1,\"b\":2,\"c\":3}\nfor k, v in pairs.items():\n    print(f\"{k}={v}\", end=\" \")  # → a=1 b=2 c=3\nfor i, (x,y) in enumerate([(1,2),(3,4)]):\n    print(i, x, y)  # → 0 1 2  затем  1 3 4\nfor a, *rest in [(1,2,3),(4,5,6)]:\n    print(a, rest)  # → 1 [2, 3]  затем  4 [5, 6]","version":null,"docs":"https://docs.python.org/3/"},{"id":"while","name":"while","group":"Циклы","subcat":"цикл while","cg":"op","description":"Цикл с предусловием. Выполняет тело, пока условие истинно. Требует явного изменения условия, иначе — бесконечный цикл.","syntax":"while условие:\n    блок","examples":"i = 0\nwhile i < 5:\n    print(i, end=\" \"); i += 1  # → 0 1 2 3 4\ntotal = 0; n = 10\nwhile n > 0:\n    total += n; n -= 1\nprint(total)  # → 55 (сумма 1..10)\nlst = [3, 7, 1, 9, 2]\ni = 0\nwhile i < len(lst) and lst[i] != 9:\n    i += 1\nprint(i)  # → 3 (индекс элемента 9)\ncount = 0\nwhile True:\n    count += 1\n    if count == 5:\n        break\nprint(count)  # → 5","version":null,"docs":"https://docs.python.org/3/"},{"id":"b-...-байт-строки","name":"b\"...\" байт-строки","group":"Строки (str)","subcat":"байты","cg":"str","description":"Байтовые строки (b\"...\") хранят последовательность байт, а не Unicode-символов. Каждый элемент — целое число 0–255. Используются при работе с бинарными данными.","syntax":"b\"строка\"  b'строка'","examples":"b = b\"hello\"; print(type(b))    # → <class 'bytes'>\nprint(b[0])                       # → 104\nprint(b\"hello\" + b\" world\")     # → b'hello world'\nprint(b\"hi\" * 3)                # → b'hihihi'\nprint(b\"hello\".decode(\"utf-8\"))  # → hello\nprint(\"hello\".encode(\"utf-8\"))   # → b'hello'","version":null,"docs":"https://docs.python.org/3/library/stdtypes.html"},{"id":"center-ljust-rjust-zfill","name":"center() / ljust() / rjust() / zfill()","group":"Строки (str)","subcat":"выравнивание","cg":"str","description":"Выравнивание строки до заданной ширины символом-заполнителем (по умолчанию пробел). zfill() заполняет нулями слева.","syntax":"s.center(width[, fill])  |  s.ljust(width[, fill])  |  s.rjust(width[, fill])  |  s.zfill(width)","examples":"print('hi'.center(10))\n# → '    hi    '\nprint('hi'.center(10, '-'))\n# → '----hi----'\nprint('hi'.ljust(10, '.'))\n# → 'hi........'\nprint('hi'.rjust(10, '.'))\n# → '........hi'\nprint('42'.zfill(5))\n# → '00042'\nprint('-3'.zfill(5))\n# → '-0003'","version":null,"docs":"https://docs.python.org/3/library/stdtypes.html"},{"id":"len-для-строк","name":"len() для строк","group":"Строки (str)","subcat":"длина","cg":"str","description":"Возвращает количество символов в строке. Считает Unicode-символы как один символ.","syntax":"len(s)","examples":"print(len(''))\n# → 0\nprint(len('hello'))\n# → 5\nprint(len('   '))\n# → 3\nprint(len('Привет'))\n# → 6\ns = 'test'\nif len(s) > 3:\n    print('длинная')\n# → 'длинная'","version":null,"docs":"https://docs.python.org/3/library/stdtypes.html"},{"id":"replace","name":"replace()","group":"Строки (str)","subcat":"замена","cg":"str","description":"Заменяет все (или count первых) вхождений old на new. Не изменяет оригинал.","syntax":"s.replace(old, new[, count])","examples":"print('aabbcc'.replace('b', 'X'))\n# → 'aaXXcc'\nprint('hello hello'.replace('hello', 'hi'))\n# → 'hi hi'\nprint('hello hello'.replace('hello', 'hi', 1))\n# → 'hi hello'\nprint('remove spaces'.replace(' ', ''))\n# → 'removespaces'\nprint('aaa'.replace('a', 'bb'))\n# → 'bbbbbb'\nprint('no match'.replace('x', 'y'))\n# → 'no match'","version":null,"docs":"https://docs.python.org/3/library/stdtypes.html"},{"id":"str.maketrans-str.translate","name":"str.maketrans() / str.translate()","group":"Строки (str)","subcat":"замена","cg":"str","description":"maketrans() создаёт таблицу замены символов. translate() применяет эту таблицу к строке. Позволяет заменять или удалять произвольные символы за один проход.","syntax":"str.maketrans(x[, y[, z]])  str.translate(table)","examples":"t = str.maketrans(\"aeiou\", \"*****\")\nprint(\"hello world\".translate(t))    # → h*ll* w*rld\nt2 = str.maketrans(\"\", \"\", \"aeiou\")\nprint(\"hello world\".translate(t2))   # → hll wrld\nt3 = str.maketrans({\"a\": \"@\", \"e\": \"3\"})\nprint(\"cafe\".translate(t3))          # → c@f3\nt4 = str.maketrans(\"abc\", \"123\")\nprint(\"abcabc\".translate(t4))        # → 123123","version":null,"docs":"https://docs.python.org/3/library/stdtypes.html"},{"id":"индексирование-строк","name":"Индексирование строк","group":"Строки (str)","subcat":"индексы/срезы","cg":"str","description":"Доступ к символу строки по индексу. Положительные индексы от начала (0), отрицательные — от конца (-1).","syntax":"s[i]  # i — целое число","examples":"s = 'Python'\nprint(s[0])\n# → 'P'\nprint(s[1])\n# → 'y'\nprint(s[-1])\n# → 'n'\nprint(s[-2])\n# → 'o'\nprint(s[5])\n# → 'n'\ns2 = 'AB'\nprint(s2[0], s2[1], s2[-1])\n# → 'A' 'B' 'B'","version":null,"docs":"https://docs.python.org/3/library/stdtypes.html"},{"id":"срезы-строк","name":"Срезы строк","group":"Строки (str)","subcat":"индексы/срезы","cg":"str","description":"Получение подстроки по диапазону индексов. s[a:b] — от a до b (не включая b), s[a:b:c] — с шагом c. s[::-1] — реверс.","syntax":"s[a:b]  |  s[a:b:c]  |  s[::-1]","examples":"s = 'abcdefgh'\nprint(s[2:5])\n# → 'cde'\nprint(s[:3])\n# → 'abc'\nprint(s[5:])\n# → 'fgh'\nprint(s[::-1])\n# → 'hgfedcba'\nprint(s[::2])\n# → 'aceg'\nprint(s[-3:])\n# → 'fgh'\nprint(s[1:7:2])\n# → 'bdf'","version":null,"docs":"https://docs.python.org/3/library/stdtypes.html"},{"id":"encode-decode","name":"encode() / decode()","group":"Строки (str)","subcat":"кодировки","cg":"str","description":"encode() кодирует строку в байты. decode() декодирует байты обратно в строку. errors: 'strict', 'ignore', 'replace'.","syntax":"s.encode([encoding[, errors]])  |  b.decode([encoding[, errors]])","examples":"print('hello'.encode('utf-8'))\n# → b'hello'\nprint('Привет'.encode('utf-8'))\n# → b'\\xd0\\x9f\\xd1\\x80\\xd0\\xb8\\xd0\\xb2\\xd0\\xb5\\xd1\\x82'\nprint(b'hello'.decode('utf-8'))\n# → 'hello'\nprint('hello'.encode('latin-1'))\n# → b'hello'\nprint('café'.encode('utf-8', errors='replace'))\n# → b'caf\\xc3\\xa9'","version":null,"docs":"https://docs.python.org/3/library/stdtypes.html"},{"id":"strip-lstrip-rstrip","name":"strip() / lstrip() / rstrip()","group":"Строки (str)","subcat":"обрезка","cg":"str","description":"strip() удаляет пробельные символы (или указанные символы) с обоих концов строки. lstrip() — слева, rstrip() — справа.","syntax":"s.strip([chars])  |  s.lstrip([chars])  |  s.rstrip([chars])","examples":"print('  hello  '.strip())\n# → 'hello'\nprint('  hello  '.lstrip())\n# → 'hello  '\nprint('  hello  '.rstrip())\n# → '  hello'\nprint('***hi***'.strip('*'))\n# → 'hi'\nlines = ['  a  ', ' b ', '  c']\nprint([l.strip() for l in lines])\n# → ['a', 'b', 'c']\nprint('xxhelloxx'.strip('x'))\n# → 'hello'","version":null,"docs":"https://docs.python.org/3/library/stdtypes.html"},{"id":"str.removeprefix-str.removesuffix","name":"str.removeprefix() / str.removesuffix()","group":"Строки (str)","subcat":"обрезка","cg":"str","description":"Удаляют указанный префикс или суффикс, если строка начинается/заканчивается на него. В отличие от lstrip/rstrip, работают с подстроками, а не наборами символов (Python 3.9+).","syntax":"str.removeprefix(prefix)  str.removesuffix(suffix)","examples":"print(\"Hello, World\".removeprefix(\"Hello, \"))  # → World\nprint(\"Hello, World\".removesuffix(\", World\"))  # → Hello\nprint(\"test_func\".removeprefix(\"test_\"))       # → func\nprint(\"image.png\".removesuffix(\".png\"))        # → image\nprint(\"hello\".removeprefix(\"xyz\"))             # → hello\nprint(\"hello\".removesuffix(\"xyz\"))             # → hello","version":"3.9+","docs":"https://docs.python.org/3/library/stdtypes.html"},{"id":"join","name":"join()","group":"Строки (str)","subcat":"объединение","cg":"str","description":"Объединяет элементы итерируемого объекта в строку, вставляя разделитель между ними.","syntax":"sep.join(iterable)","examples":"print(' '.join(['Hello', 'World']))\n# → 'Hello World'\nprint(','.join(['a', 'b', 'c']))\n# → 'a,b,c'\nprint(''.join(['p', 'y', 't', 'h', 'o', 'n']))\n# → 'python'\nnums = [str(n) for n in [1, 2, 3]]\nprint('-'.join(nums))\n# → '1-2-3'\nprint('|'.join(['only']))\n# → 'only'\nprint(' '.join([]))\n# → ''","version":null,"docs":"https://docs.python.org/3/library/stdtypes.html"},{"id":"конкатенация-строк","name":"+ конкатенация строк","group":"Строки (str)","subcat":"операторы","cg":"str","description":"Оператор + объединяет две строки в новую. Операнды должны быть строками.","syntax":"s1 + s2","examples":"print('Hello' + ' ' + 'World')\n# → 'Hello World'\na = 'foo'\nb = 'bar'\nprint(a + b)\n# → 'foobar'\nprint('py' + 'thon')\n# → 'python'\nprefix = 'pre_'\nprint(prefix + 'fix')\n# → 'pre_fix'\nprint('' + 'empty left')\n# → 'empty left'","version":null,"docs":"https://docs.python.org/3/library/stdtypes.html"},{"id":"повторение-строки","name":"* повторение строки","group":"Строки (str)","subcat":"операторы","cg":"str","description":"Оператор * повторяет строку n раз. При n <= 0 возвращает пустую строку.","syntax":"s * n  |  n * s","examples":"print('ab' * 3)\n# → 'ababab'\nprint('-' * 20)\n# → '--------------------'\nprint('ha' * 0)\n# → ''\nsep = '=-' * 5\nprint(sep)\n# → '=-=-=-=-=-=-=-=-'\nprint(3 * 'go!')\n# → 'go!go!go!'","version":null,"docs":"https://docs.python.org/3/library/stdtypes.html"},{"id":"строки-в-памяти-интернирование-неизменяе","name":"Строки в памяти — интернирование, неизменяемость","group":"Строки (str)","subcat":"память","cg":"str","description":"Строки в Python неизменяемы (immutable). Интернирование — кэширование коротких строк-идентификаторов. is проверяет идентичность объектов, == — равенство.","syntax":"s[i] = x  # TypeError  |  id(s)  |  sys.intern(s)","examples":"s = 'hello'\ntry:\n    s[0] = 'H'\nexcept TypeError as e:\n    print(e)\n# → 'str' object does not support item assignment\na = 'hello'\nb = 'hello'\nprint(a == b)\n# → True\nprint(a is b)\n# → True (интернирование коротких строк)\nimport sys\nx = sys.intern('some_long_string')\ny = sys.intern('some_long_string')\nprint(x is y)\n# → True (принудительное интернирование)\ns2 = s.replace('h', 'H')\nprint(s, s2)\n# → 'hello' 'Hello' (оригинал не изменился)","version":null,"docs":"https://docs.python.org/3/library/stdtypes.html"},{"id":"in-not-in-для-строк","name":"in / not in для строк","group":"Строки (str)","subcat":"поиск","cg":"str","description":"Проверяет, является ли одна строка подстрокой другой. Возвращает bool.","syntax":"'sub' in s  |  'sub' not in s","examples":"print('py' in 'python')\n# → True\nprint('xyz' in 'python')\n# → False\nprint('xyz' not in 'python')\n# → True\nprint('' in 'any')\n# → True (пустая всегда входит)\nprint('P' in 'python')\n# → False (регистрозависимо)","version":null,"docs":"https://docs.python.org/3/library/stdtypes.html"},{"id":"find-rfind","name":"find() / rfind()","group":"Строки (str)","subcat":"поиск","cg":"str","description":"find() возвращает индекс первого вхождения подстроки или -1 если не найдено. rfind() ищет с конца.","syntax":"s.find(sub[, start[, end]])  |  s.rfind(sub[, start[, end]])","examples":"print('hello'.find('l'))\n# → 2\nprint('hello'.find('x'))\n# → -1\nprint('hello hello'.rfind('hello'))\n# → 6\nprint('abcabc'.find('b', 3))\n# → 4 (поиск с позиции 3)\nprint('abcabc'.find('b', 0, 2))\n# → 1 (поиск до позиции 2)\nprint('abcabc'.rfind('a'))\n# → 3","version":null,"docs":"https://docs.python.org/3/library/stdtypes.html"},{"id":"index-rindex","name":"index() / rindex()","group":"Строки (str)","subcat":"поиск","cg":"str","description":"index() как find(), но бросает ValueError если подстрока не найдена. rindex() ищет с конца.","syntax":"s.index(sub[, start[, end]])  |  s.rindex(sub[, start[, end]])","examples":"print('hello'.index('l'))\n# → 2\nprint('hello'.rindex('l'))\n# → 3\ntry:\n    'hello'.index('x')\nexcept ValueError as e:\n    print(e)\n# → substring not found\nprint('abcabc'.index('b', 3))\n# → 4\nprint('abcabc'.rindex('b'))\n# → 4","version":null,"docs":"https://docs.python.org/3/library/stdtypes.html"},{"id":"count","name":"count()","group":"Строки (str)","subcat":"поиск","cg":"str","description":"Подсчитывает число непересекающихся вхождений подстроки. Для пустой строки возвращает len(s)+1.","syntax":"s.count(sub[, start[, end]])","examples":"print('hello'.count('l'))\n# → 2\nprint('banana'.count('an'))\n# → 2 (непересекающиеся)\nprint('aaaa'.count('aa'))\n# → 2\nprint('hello'.count('x'))\n# → 0\nprint('abc'.count(''))\n# → 4 (len+1)","version":null,"docs":"https://docs.python.org/3/library/stdtypes.html"},{"id":"startswith-endswith","name":"startswith() / endswith()","group":"Строки (str)","subcat":"проверка","cg":"str","description":"Проверяют, начинается/оканчивается ли строка на заданный префикс/суффикс. Принимают кортеж строк или диапазон start/end.","syntax":"s.startswith(prefix[, start[, end]])  |  s.endswith(suffix[, start[, end]])","examples":"print('hello'.startswith('he'))\n# → True\nprint('hello'.endswith('lo'))\n# → True\nprint('hello'.startswith(('hi', 'he')))\n# → True (кортеж префиксов)\nprint('file.py'.endswith(('.py', '.js')))\n# → True\nprint('hello'.startswith('lo', 3))\n# → True (с позиции 3)\nprint('hello'.endswith('he', 0, 2))\n# → True (до позиции 2)","version":null,"docs":"https://docs.python.org/3/library/stdtypes.html"},{"id":"isdigit-isalpha-isalnum-isspace","name":"isdigit() / isalpha() / isalnum() / isspace()","group":"Строки (str)","subcat":"проверка","cg":"str","description":"Методы проверки состава строки. Все возвращают False для пустой строки.","syntax":"s.isdigit()  |  s.isalpha()  |  s.isalnum()  |  s.isspace()","examples":"print('123'.isdigit())\n# → True\nprint('12.3'.isdigit())\n# → False\nprint('abc'.isalpha())\n# → True\nprint('abc123'.isalpha())\n# → False\nprint('abc123'.isalnum())\n# → True\nprint('   '.isspace())\n# → True\nprint(''.isdigit())\n# → False (пустая строка)","version":null,"docs":"https://docs.python.org/3/library/stdtypes.html"},{"id":"split-rsplit","name":"split() / rsplit()","group":"Строки (str)","subcat":"разбивка","cg":"str","description":"split() разбивает строку на список по разделителю. rsplit() — с конца. maxsplit ограничивает число разбиений.","syntax":"s.split([sep[, maxsplit]])  |  s.rsplit([sep[, maxsplit]])","examples":"print('a b c'.split())\n# → ['a', 'b', 'c']\nprint('a,b,c'.split(','))\n# → ['a', 'b', 'c']\nprint('a,b,c'.split(',', 1))\n# → ['a', 'b,c']\nprint('a,b,c'.rsplit(',', 1))\n# → ['a,b', 'c']\nprint('  a  b  '.split())\n# → ['a', 'b'] (несколько пробелов)\nprint('a,,b'.split(','))\n# → ['a', '', 'b'] (пустые строки)\nprint('hello'.split('x'))\n# → ['hello'] (разделитель не найден)","version":null,"docs":"https://docs.python.org/3/library/stdtypes.html"},{"id":"str.partition-str.rpartition","name":"str.partition() / str.rpartition()","group":"Строки (str)","subcat":"разбивка","cg":"str","description":"partition() ищет первое вхождение разделителя и возвращает кортеж из трёх частей: до разделителя, сам разделитель, после. rpartition() — с конца строки.","syntax":"str.partition(sep) -> (before, sep, after)  str.rpartition(sep) -> (before, sep, after)","examples":"print(\"user@example.com\".partition(\"@\"))   # → ('user', '@', 'example.com')\nprint(\"a::b::c\".partition(\"::\"))            # → ('a', '::', 'b::c')\nprint(\"a::b::c\".rpartition(\"::\"))           # → ('a::b', '::', 'c')\nprint(\"hello\".partition(\"x\"))               # → ('hello', '', '')\nhost, _, port = \"localhost:8080\".partition(\":\")\nprint(host, port)  # → localhost 8080","version":null,"docs":"https://docs.python.org/3/library/stdtypes.html"},{"id":"str.splitlines","name":"str.splitlines()","group":"Строки (str)","subcat":"разбивка","cg":"str","description":"Разбивает строку по символам конца строки (\\n, \\r\\n, \\r и др.) и возвращает список строк. Параметр keepends=True сохраняет разделители в результатах.","syntax":"str.splitlines(keepends=False)","examples":"print(\"a\\nb\\nc\".splitlines())             # → ['a', 'b', 'c']\nprint(\"a\\r\\nb\\nc\".splitlines())           # → ['a', 'b', 'c']\nprint(\"a\\nb\\n\".splitlines())              # → ['a', 'b']\nprint(\"a\\nb\".splitlines(keepends=True))   # → ['a\\n', 'b']\nprint(\"\".splitlines())                     # → []","version":null,"docs":"https://docs.python.org/3/library/stdtypes.html"},{"id":"upper-lower","name":"upper() / lower()","group":"Строки (str)","subcat":"регистр","cg":"str","description":"upper() переводит все символы в верхний регистр, lower() — в нижний. casefold() — агрессивный lower() для сравнения.","syntax":"s.upper()  |  s.lower()  |  s.casefold()","examples":"print('hello'.upper())\n# → 'HELLO'\nprint('WORLD'.lower())\n# → 'world'\nprint('Python3'.lower())\n# → 'python3'\ns1, s2 = 'Hello', 'HELLO'\nprint(s1.lower() == s2.lower())\n# → True\nprint('Straße'.casefold())\n# → 'strasse'\nprint('MiXeD'.upper())\n# → 'MIXED'","version":null,"docs":"https://docs.python.org/3/library/stdtypes.html"},{"id":"capitalize-title-swapcase","name":"capitalize() / title() / swapcase()","group":"Строки (str)","subcat":"регистр","cg":"str","description":"capitalize() — первая буква заглавная, остальные строчные. title() — каждое слово с заглавной. swapcase() — меняет регистр каждого символа.","syntax":"s.capitalize()  |  s.title()  |  s.swapcase()","examples":"print('hello world'.capitalize())\n# → 'Hello world'\nprint('hello world'.title())\n# → 'Hello World'\nprint('Hello World'.swapcase())\n# → 'hELLO wORLD'\nprint('HELLO'.capitalize())\n# → 'Hello'\nprint(\"it's a test\".title())\n# → \"It'S A Test\" (апостроф — разделитель)\nprint('aAbBcC'.swapcase())\n# → 'AaBbCc'","version":null,"docs":"https://docs.python.org/3/library/stdtypes.html"},{"id":"islower-isupper-istitle","name":"islower() / isupper() / istitle()","group":"Строки (str)","subcat":"регистр","cg":"str","description":"Проверяют регистр строки. Требуют хотя бы один буквенный символ.","syntax":"s.islower()  |  s.isupper()  |  s.istitle()","examples":"print('hello'.islower())\n# → True\nprint('HELLO'.isupper())\n# → True\nprint('Hello World'.istitle())\n# → True\nprint('hello world'.istitle())\n# → False\nprint('123'.islower())\n# → False (нет букв)","version":null,"docs":"https://docs.python.org/3/library/stdtypes.html"},{"id":"chr-ord","name":"chr() / ord()","group":"Строки (str)","subcat":"символы","cg":"str","description":"ord() возвращает Unicode code point символа. chr() возвращает символ по code point.","syntax":"ord(c)  |  chr(i)","examples":"print(ord('A'))\n# → 65\nprint(chr(65))\n# → 'A'\nprint(ord('а'))\n# → 1072 (кириллица)\nalphabet = [chr(i) for i in range(65, 91)]\nprint(alphabet[:5])\n# → ['A', 'B', 'C', 'D', 'E']\nmsg = 'hello'\nencrypted = ''.join(chr(ord(c) + 1) for c in msg)\nprint(encrypted)\n# → 'ifmmp' (шифр Цезаря +1)\nprint(chr(128512))\n# → '😀'","version":null,"docs":"https://docs.python.org/3/library/stdtypes.html"},{"id":"создание-строк","name":"Создание строк","group":"Строки (str)","subcat":"создание","cg":"str","description":"Строки создаются одинарными/двойными кавычками, тройными для многострочных, raw-строками (r''), байтами (b''), escape-последовательностями.","syntax":"s = 'text' | s = \"text\" | s = '''multi''' | s = r'raw' | s = b'bytes'","examples":"s1 = 'hello'\n# → 'hello'\ns2 = \"world\"\n# → 'world'\ns3 = '''line1\nline2\nline3'''\n# → 'line1\\nline2\\nline3'\ns4 = r'C:\\Users\\name'\n# → 'C:\\\\Users\\\\name' (без escape)\ns5 = b'bytes'\n# → b'bytes'\ns6 = 'tab:\\there'\n# → 'tab:\\there' (\\t — табуляция)\ns7 = '\\u041f\\u0440\\u0438\\u0432\\u0435\\u0442'\n# → 'Привет'","version":null,"docs":"https://docs.python.org/3/library/stdtypes.html"},{"id":"тройные-кавычки","name":"Тройные кавычки","group":"Строки (str)","subcat":"создание","cg":"str","description":"Строки в тройных кавычках (\"\"\"...\"\"\" или '''...''') могут содержать переносы строк и кавычки без экранирования. Используются для многострочных строк и docstring-документации.","syntax":"\"\"\"текст\"\"\"\n'''текст'''","examples":"s = \"\"\"строка 1\\nстрока 2\"\"\"\nprint(len(s))        # → 15\ndef foo():\n    \"\"\"Докстринг функции.\"\"\"\n    pass\nprint(foo.__doc__)   # → Докстринг функции.\ns2 = \"\"\"можно \\\"кавычки\\\" внутри\"\"\"\nprint(\"кавычки\" in s2)  # → True\nprint(type(s2))      # → <class 'str'>","version":null,"docs":"https://docs.python.org/3/library/stdtypes.html"},{"id":"raw-строки-r-...","name":"Raw-строки r\"...\"","group":"Строки (str)","subcat":"создание","cg":"str
