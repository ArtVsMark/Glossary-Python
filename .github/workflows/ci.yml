name: CI

on:
  push:
    branches: [main]
  # Набор событий назван явно, потому что умолчание площадки — opened,
  # synchronize, reopened — НЕ включает снятие черновика. Изменение, открытое
  # черновиком, не получало бы проверок при готовности: единственным способом
  # добудиться прогона осталась бы отправка коммита, то есть пустышка ради
  # перезапуска, остающаяся в истории навсегда (правило каталога 104).
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

# Коммит входит в имя группы намеренно. Группа, ОТМЕНЯЮЩАЯ предыдущий прогон,
# обязана называть коммит, который прогон проверяет: иначе прогоны на разных
# коммитах одного изменения попадают в одну группу и вытесняют друг друга —
# результат обязательной проверки для актуальной головы не появляется вовсе,
# и слияние встаёт при зелёных проверках. С коммитом в имени отмена работает
# там, где она осмысленна: повтор того же коммита вытесняет предыдущий заход.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PYTHONUNBUFFERED: "1"
  FORCE_COLOR: "1"

jobs:
  quality:
    name: Линтер и типы
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Установка зависимостей
        run: python -m pip install -e ".[dev]"

      - name: ruff check
        run: ruff check --output-format=github .

      - name: ruff format
        run: ruff format --check --diff .

      - name: mypy
        run: mypy

  tests:
    name: Тесты (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Установка зависимостей
        run: python -m pip install -e ".[dev,schema]"

      - name: pytest
        run: pytest --cov=glossary --cov-report=xml --cov-report=term-missing --cov-fail-under=90

      - name: Публикация отчёта о покрытии
        if: matrix.python-version == '3.11'
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage.xml
          retention-days: 14

  attribution:
    name: Атрибуция коммитов изменения
    runs-on: ubuntu-latest
    steps:
      # Полная история намеренно: атрибуция проверяется в том, что ляжет в
      # общую ветку, а при глубине 1 сравнивать не с чем (правило 123).
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Имена авторов сходятся со списком
        run: |
          python scripts/check_attribution.py \
            --range "origin/${{ github.base_ref || 'main' }}..HEAD"

  journal:
    name: Запись журнала едет с изменением
    runs-on: ubuntu-latest
    steps:
      # Полная история намеренно: состав изменения считается против основы, а
      # при глубине 1 сравнивать не с чем (правило 138).
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Решение осело артефактом тем же заходом
        run: |
          python scripts/check_journal.py \
            --base "origin/${{ github.base_ref || 'main' }}"

  link:
    name: Связь изменения с задачей
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: У изменения есть ответ задаче
        if: github.event_name == 'pull_request'
        # Тело приходит переменной окружения, а не подстановкой в оболочку:
        # чужой текст в командной строке — это разбор кавычек чужими руками.
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: python scripts/check_pr_link.py

      # Зелёное на пустоте выглядит как зелёное на проверенном. Работа говорит
      # вслух, что она не проверяла, а не молчит (правила 039, 075).
      - name: Событие не изменение — проверять нечего
        if: github.event_name != 'pull_request'
        run: |
          echo "связь с задачей есть у изменения; событие ${{ github.event_name }}"
          echo "тела изменения не несёт — проверять нечего"

  data:
    name: Качество данных и синхронность витрины
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Установка пакета
        run: python -m pip install -e ".[dev]"

      - name: Валидация данных
        run: python -m glossary validate

      - name: Ответ каталогу правил
        run: pytest tests/test_rules_bindings.py -q

      - name: Исключительные утверждения сверены друг с другом
        run: python scripts/check_exclusive.py --check

      - name: Умолчания окружения заданы явно
        run: python scripts/check_defaults.py

      - name: У каждой точки входа есть третий исход
        run: python scripts/check_third_outcome.py

      - name: Числа в документации совпадают с источниками
        run: python scripts/facts.py --check

      - name: Форма записей журнала
        run: python scripts/changelog.py --check

      - name: Ссылки документации разрешаются в файлы дерева
        run: python scripts/check_links.py

      - name: Витрина собрана из текущих данных
        run: python -m glossary build --check

      - name: Отчёт о качестве
        if: always()
        run: |
          {
            echo '### Качество глоссария'
            echo
            echo '```'
            python -m glossary stats || true
            echo '```'
            echo
            echo '<details><summary>Замечания валидатора</summary>'
            echo
            echo '```'
            python -m glossary validate 2>&1 || true
            echo '```'
            echo
            echo '</details>'
          } >> "$GITHUB_STEP_SUMMARY"

  # Единственная обязательная проверка защиты ветки. Имя постоянное и совпадает
  # с настройкой ruleset дословно: имена работ матрицы в список обязательных
  # не попадают никогда — они меняются вместе с составом версий.
  #
  # if: always() — здесь несущая конструкция, а не украшение. Без него job с
  # needs: при падении зависимости не краснеет, а ПРОПУСКАЕТСЯ, и защита ветки
  # засчитывает пропущенное как пройденное: в норме агрегатор зелёный и ничего
  # не решает, а в аварии разрешает слияние ровно тогда, когда обязан запретить.
  # Поэтому работа доходит до вердикта при любом исходе соседей и сверяет их
  # результаты явно.
  check-pr:
    name: check PR
    needs: [quality, tests, data, attribution, link, journal]
    if: always()
    runs-on: ubuntu-latest
    steps:
      # След отказа кладётся в СВОДКУ ПРОГОНА, а не только в логи (правило 151).
      # Логи открывает не всякий, кто чинит: у облачного окна доступ к ним
      # зависит от посредника, а сводку видит всякий, кто открыл прогон.
      - name: Свести вердикты обязательных работ
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import sys

          needs = json.loads(os.environ["NEEDS"])
          summary = os.environ.get("GITHUB_STEP_SUMMARY")

          def trace(lines: list[str]) -> None:
              """Положить след туда, где его увидит чинящий."""
              print("\n".join(lines))
              if summary:
                  with open(summary, "a", encoding="utf-8") as report:
                      report.write("\n".join(lines) + "\n")

          # Пустой вход — ошибка входа, а не успех: агрегатор без зависимостей
          # зеленел бы всегда и не проверял бы ничего.
          if not needs:
              trace(["### Свод не отработал", "", "обязательных работ не найдено"])
              sys.exit("обязательных работ не найдено — проверять нечего")

          failed = {
              name: outcome["result"]
              for name, outcome in needs.items()
              if outcome["result"] != "success"
          }
          heading = "### Обязательные работы не прошли" if failed else "### Всё зелено"
          table = ["| Работа | Исход |", "| --- | --- |"] + [
              f"| `{name}` | {outcome['result']} |"
              for name, outcome in sorted(needs.items())
          ]
          trace([heading, "", *table, ""])

          if failed:
              listed = ", ".join(f"{n} → {r}" for n, r in sorted(failed.items()))
              sys.exit(f"обязательные работы не прошли: {listed}")

          print(f"все {len(needs)} обязательные работы зелёные")
          PY
