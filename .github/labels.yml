# Метки репозитория: объявленный набор.
#
# Метка — вход механизма, а не украшение (правило каталога 064). Шаблоны задач
# и dependabot проставляют метки автоматически, и метка, которой в репозитории
# нет, не создаётся сама: классификация просто не доезжает, молча и без
# красного. Поэтому набор объявлен здесь, а tests/test_labels.py не даёт
# шаблону раздавать метку, которой тут не названо.
#
# ГРАНИЦА, КОТОРУЮ ОТСЮДА НЕ ЗАКРЫТЬ. Этот файл — объявление, а не состояние
# площадки: что метка ЗАВЕДЕНА в репозитории, из дерева не следует, и проверить
# это можно только обращением к API. Гейт держит согласованность дерева с самим
# собой, и вторая половина названа здесь, а не подразумевается (правило 056).

