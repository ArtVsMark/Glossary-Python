name: Публикация витрины

on:
  push:
    branches: [main]
    paths:
      - python_glossary.html
      - .github/workflows/pages.yml
  workflow_dispatch:

# Одновременно выполняется только одна публикация; уже начатую не отменяем,
# чтобы не оставить Pages в промежуточном состоянии.
concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    name: GitHub Pages
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5

      - name: Подготовка каталога публикации
        run: |
          mkdir -p _site
          cp python_glossary.html _site/index.html
          cp data/glossary.json _site/glossary.json

      # enablement: true — действие само включает Pages, если он ещё не включён.
      # Без него прогон зависит от настройки вне дерева: репозиторий с
      # выключенным Pages даёт «Get Pages site failed: Not Found», и починить
      # это можно только руками в настройках. Инструмент, который умеет сделать
      # шаг сам, делает его, а не советует.
      - uses: actions/configure-pages@v6
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v5
