name: Showcase

on:
  push:
    branches: [main]
    paths:
      - site/python_glossary.html
      # Страницы карточек собираются из сборки и экспортёра (#227): правка
      # любого из них меняет опубликованное, хотя витрина та же.
      - data/glossary.json
      - src/glossary/exporters/pages.py
      - .github/workflows/pages.yml
  workflow_dispatch:
  # Страховка: слияние штатным токеном не будит push (см. automerge.yml), и без
  # расписания витрина стояла бы до ручного запуска. Публикация идемпотентна.
  schedule:
    - cron: "41 4 * * *"

# Одновременно выполняется только одна публикация; уже начатую не отменяем,
# чтобы не оставить Pages в промежуточном состоянии.
concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    timeout-minutes: 10
    name: GitHub Pages
    runs-on: ubuntu-26.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - name: Подготовка каталога публикации
        run: |
          mkdir -p _site
          cp site/python_glossary.html _site/index.html
          cp data/glossary.json _site/glossary.json

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      # Страница на карточку рядом с витриной и sitemap.xml (#227). Команда сама
      # сверяет число страниц на диске со сборкой и краснеет на расхождении.
      - name: Страницы карточек
        run: |
          python -m pip install -e .
          python -m glossary pages -o _site

      # enablement: true — действие само включает Pages, если он ещё не включён.
      # Без него прогон зависит от настройки вне дерева: репозиторий с
      # выключенным Pages даёт «Get Pages site failed: Not Found», и починить
      # это можно только руками в настройках. Инструмент, который умеет сделать
      # шаг сам, делает его, а не советует.
      - uses: actions/configure-pages@v6
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v5
