# Установка: pre-commit install
# Разовый прогон по всем файлам: pre-commit run --all-files
default_language_version:
  python: python3.11

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-added-large-files
        args: [--maxkb=1024]
      - id: check-merge-conflict
      - id: check-toml
      - id: check-yaml
      - id: end-of-file-fixer
        exclude: ^python_glossary\.html$
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: trailing-whitespace
        exclude: ^python_glossary\.html$

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.14.2
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.18.2
    hooks:
      - id: mypy
        additional_dependencies: [pytest>=8.2]
        args: [--config-file=pyproject.toml]
        pass_filenames: false

  - repo: local
    hooks:
      - id: glossary-validate
        name: Проверка качества данных глоссария
        entry: python -m glossary validate
        language: system
        pass_filenames: false
        files: ^data/glossary\.json$

      - id: glossary-build-check
        name: Витрина синхронна с данными
        entry: python -m glossary build --check
        language: system
        pass_filenames: false
        files: ^(data/glossary\.json|src/glossary/templates/.*|python_glossary\.html)$
