x)\nprint(result)  # → [1,1,3,4,5]\n# Binary insertion sort\nimport bisect\ndef bin_ins_sort(arr):\n    result = []\n    for x in arr:\n        bisect.insort(result, x)\n    return result\nprint(bin_ins_sort([5,3,1,4,2]))  # → [1,2,3,4,5]\n# Скорость на почти отсортированных данных\nimport random\narr = list(range(100))\narr[50] = -1  # один элемент не на месте\nprint(insertion_sort(arr[:])[:5])  # → [−1,0,1,2,3]","version":null,"docs":"https://docs.python.org/3/"},{"id":"стек-stack","name":"Стек (stack)","group":"Алгоритмы и структуры данных","subcat":"структуры","cg":"op","description":"LIFO — последний вошёл, первый вышел. Реализуется через list. Применения: скобки, история, DFS.","syntax":"stack = []\nstack.append(x)  # push\nstack.pop()      # pop","examples":"# Базовые операции\nstack = []\nstack.append(1)\nstack.append(2)\nstack.append(3)\nprint(stack[-1])  # peek → 3\nprint(stack.pop())  # → 3\nprint(stack)  # → [1,2]\n# Проверка правильности скобок\ndef is_balanced(s):\n    stack = []\n    pairs = {')':'(',']':'[','}':'{'}\n    for ch in s:\n        if ch in '([{':\n            stack.append(ch)\n        elif ch in ')]}':\n            if not stack or stack[-1] != pairs[ch]:\n                return False\n            stack.pop()\n    return len(stack) == 0\nprint(is_balanced('({[]})'))  # → True\nprint(is_balanced('([)]'))    # → False\n# Обращение строки через стек\ndef reverse_string(s):\n    stack = list(s)\n    result = []\n    while stack:\n        result.append(stack.pop())\n    return ''.join(result)\nprint(reverse_string('hello'))  # → olleh\n# Перевод в двоичную систему\ndef to_binary(n):\n    if n == 0: return '0'\n    stack = []\n    while n > 0:\n        stack.append(n % 2)\n        n //= 2\n    return ''.join(str(b) for b in reversed(stack))\nprint(to_binary(10))   # → 1010\nprint(to_binary(255))  # → 11111111\n# Вычисление постфиксного выражения\ndef eval_postfix(tokens):\n    stack = []\n    for t in tokens:\n        if t.lstrip('-').isdigit():\n            stack.append(int(t))\n        else:\n            b, a = stack.pop(), stack.pop()\n            if t=='+': stack.append(a+b)\n            elif t=='-': stack.append(a-b)\n            elif t=='*': stack.append(a*b)\n            elif t=='/': stack.append(a//b)\n    return stack[0]\nprint(eval_postfix(['3','4','+','2','*']))  # → 14\n# Минимальный стек (O(1) min)\nclass MinStack:\n    def __init__(self):\n        self.stack = []; self.min_stack = []\n    def push(self, x):\n        self.stack.append(x)\n        m = min(x, self.min_stack[-1]) if self.min_stack else x\n        self.min_stack.append(m)\n    def pop(self):\n        self.min_stack.pop(); return self.stack.pop()\n    def get_min(self): return self.min_stack[-1]\nms = MinStack()\nfor v in [3,1,4,1,5]: ms.push(v)\nprint(ms.get_min())  # → 1","version":null,"docs":"https://docs.python.org/3/"},{"id":"очередь-queue","name":"Очередь (queue)","group":"Алгоритмы и структуры данных","subcat":"структуры","cg":"op","description":"FIFO — первый вошёл, первый вышел. Реализуется через deque. Применения: BFS, задачи планирования.","syntax":"from collections import deque\nqueue = deque()\nqueue.append(x)   # enqueue\nqueue.popleft()   # dequeue","examples":"from collections import deque\nqueue = deque()\nqueue.append('a')\nqueue.append('b')\nqueue.append('c')\nprint(queue.popleft())  # → a\nprint(queue.popleft())  # → b\nprint(queue)  # → deque(['c'])\n# BFS обход графа\ndef bfs(graph, start):\n    visited = set([start])\n    queue = deque([start])\n    order = []\n    while queue:\n        node = queue.popleft()\n        order.append(node)\n        for neighbor in graph.get(node, []):\n            if neighbor not in visited:\n                visited.add(neighbor)\n                queue.append(neighbor)\n    return order\ng = {1:[2,3],2:[4],3:[4],4:[]}\nprint(bfs(g, 1))  # → [1,2,3,4]\n# queue.Queue (потокобезопасный)\nimport queue\nq = queue.Queue()\nq.put(1); q.put(2)\nprint(q.get())  # → 1\nprint(q.qsize())  # → 1\n# Скользящее окно максимума\nfrom collections import deque\ndef max_sliding_window(nums, k):\n    dq = deque()\n    result = []\n    for i, x in enumerate(nums):\n        while dq and nums[dq[-1]] <= x:\n            dq.pop()\n        dq.append(i)\n        if dq[0] <= i-k: dq.popleft()\n        if i >= k-1: result.append(nums[dq[0]])\n    return result\nprint(max_sliding_window([1,3,-1,-3,5,3,6,7], 3))  # → [3,3,5,5,6,7]\n# Задача Джозефуса\ndef josephus(n, k):\n    queue = deque(range(1, n+1))\n    while len(queue) > 1:\n        for _ in range(k-1):\n            queue.append(queue.popleft())\n        queue.popleft()\n    return queue[0]\nprint(josephus(7, 3))  # → 4","version":null,"docs":"https://docs.python.org/3/"},{"id":"хеш-таблица-dict","name":"Хеш-таблица (dict)","group":"Алгоритмы и структуры данных","subcat":"структуры","cg":"op","description":"Dict в Python — хеш-таблица. O(1) в среднем для get/set/del. Применения: подсчёт, кэш, индексирование.","syntax":"d = {}\nd[key] = value\nd.get(key, default)","examples":"# Подсчёт частоты\nfrom collections import Counter\nwords = 'the cat sat on the mat the cat sat'.split()\nc = Counter(words)\nprint(c.most_common(3))  # → [('the',3),('cat',2),('sat',2)]\n# Анаграммы\ndef are_anagrams(s1, s2):\n    return Counter(s1) == Counter(s2)\nprint(are_anagrams('listen', 'silent'))  # → True\nprint(are_anagrams('hello', 'world'))   # → False\n# Первый неповторяющийся символ\ndef first_unique(s):\n    count = {}\n    for ch in s:\n        count[ch] = count.get(ch, 0) + 1\n    for ch in s:\n        if count[ch] == 1:\n            return ch\n    return None\nprint(first_unique('leetcode'))  # → l\n# Two Sum с хеш-таблицей O(n)\ndef two_sum_hash(nums, target):\n    seen = {}\n    for i, x in enumerate(nums):\n        if target-x in seen:\n            return [seen[target-x], i]\n        seen[x] = i\n    return []\nprint(two_sum_hash([2,7,11,15], 9))  # → [0,1]\n# Кэш с defaultdict\nfrom collections import defaultdict\ngraph = defaultdict(list)\ngraph[1].append(2)\ngraph[1].append(3)\ngraph[2].append(4)\nprint(dict(graph))  # → {1:[2,3], 2:[4]}","version":null,"docs":"https://docs.python.org/3/"},{"id":"префиксные-суммы","name":"Префиксные суммы","group":"Алгоритмы и структуры данных","subcat":"техники","cg":"op","description":"Массив prefix[i] = sum(arr[0..i]). Позволяет за O(1) найти сумму на отрезке [l, r].","syntax":"prefix[i] = prefix[i-1] + arr[i]\nsum(l, r) = prefix[r] - prefix[l-1]","examples":"def build_prefix(arr):\n    prefix = [0] * (len(arr) + 1)\n    for i, x in enumerate(arr):\n        prefix[i+1] = prefix[i] + x\n    return prefix\ndef range_sum(prefix, l, r):\n    return prefix[r+1] - prefix[l]\narr = [1,2,3,4,5]\np = build_prefix(arr)\nprint(range_sum(p, 1, 3))  # → 9 (2+3+4)\narr2 = [3,-1,4,1,5,-9,2,6]\np2 = build_prefix(arr2)\nprint(range_sum(p2, 0, 7))  # → 11 (вся сумма)\nprint(range_sum(p2, 2, 4))  # → 10 (4+1+5)\n# Количество подмасивов с нулевой суммой\nfrom collections import Counter\ndef count_zero_sum(arr):\n    prefix = 0\n    counts = Counter({0: 1})\n    result = 0\n    for x in arr:\n        prefix += x\n        result += counts[prefix]\n        counts[prefix] += 1\n    return result\nprint(count_zero_sum([1,-1,2,-2,3]))  # → 4\n# 2D префиксные суммы\nmatrix = [[1,2,3],[4,5,6],[7,8,9]]\ndef build_2d_prefix(mat):\n    n, m = len(mat), len(mat[0])\n    p = [[0]*(m+1) for _ in range(n+1)]\n    for i in range(1,n+1):\n        for j in range(1,m+1):\n            p[i][j] = mat[i-1][j-1]+p[i-1][j]+p[i][j-1]-p[i-1][j-1]\n    return p\np2d = build_2d_prefix(matrix)\nprint(p2d[-1][-1])  # → 45 (сумма всей матрицы)\n# Скользящее окно с prefix\narr3 = [1,2,3,4,5,6,7,8]\np3 = build_prefix(arr3)\nk = 3\nmax_sum = max(range_sum(p3,i,i+k-1) for i in range(len(arr3)-k+1))\nprint(max_sum)  # → 21 (6+7+8)\n# Среднее на подмассиве\nprint(range_sum(p, 0, 4) / 5)  # → 3.0","version":null,"docs":"https://docs.python.org/3/"},{"id":"два-указателя-two-pointers","name":"Два указателя (two pointers)","group":"Алгоритмы и структуры данных","subcat":"техники","cg":"op","description":"Два индекса движутся навстречу друг другу или в одном направлении. O(n) для задач на отсортированных массивах.","syntax":"lo, hi = 0, len(arr)-1\nwhile lo < hi: ...","examples":"# Сумма двух чисел в отсортированном массиве\ndef two_sum_sorted(arr, target):\n    lo, hi = 0, len(arr)-1\n    while lo < hi:\n        s = arr[lo] + arr[hi]\n        if s == target: return (lo, hi)\n        elif s < target: lo += 1\n        else: hi -= 1\n    return None\nprint(two_sum_sorted([1,2,3,4,6], 6))  # → (1, 3) → 2+4\n# Проверка палиндрома\ndef is_palindrome(s):\n    lo, hi = 0, len(s)-1\n    while lo < hi:\n        if s[lo] != s[hi]: return False\n        lo += 1; hi -= 1\n    return True\nprint(is_palindrome('racecar'))  # → True\nprint(is_palindrome('hello'))    # → False\n# Удаление дубликатов in-place\ndef remove_dups(arr):\n    if not arr: return 0\n    slow = 0\n    for fast in range(1, len(arr)):\n        if arr[fast] != arr[slow]:\n            slow += 1\n            arr[slow] = arr[fast]\n    return slow + 1\narr = [1,1,2,3,3,4]\nk = remove_dups(arr)\nprint(arr[:k])  # → [1,2,3,4]\n# Слияние двух отсортированных массивов\ndef merge_sorted(a, b):\n    i = j = 0; result = []\n    while i < len(a) and j < len(b):\n        if a[i] <= b[j]: result.append(a[i]); i+=1\n        else: result.append(b[j]); j+=1\n    result.extend(a[i:]); result.extend(b[j:])\n    return result\nprint(merge_sorted([1,3,5],[2,4,6]))  # → [1,2,3,4,5,6]\n# Контейнер с наибольшим объёмом\ndef max_area(heights):\n    lo, hi = 0, len(heights)-1\n    best = 0\n    while lo < hi:\n        area = (hi-lo) * min(heights[lo],heights[hi])\n        best = max(best, area)\n        if heights[lo] < heights[hi]: lo+=1\n        else: hi-=1\n    return best\nprint(max_area([1,8,6,2,5,4,8,3,7]))  # → 49","version":null,"docs":"https://docs.python.org/3/"},{"id":"string.ascii_letters","name":"string.ascii_letters","group":"Модуль string","subcat":"буквы","cg":"module","description":"Строка из всех ASCII-букв: строчных и прописных (a-z + A-Z). Удобна для генерации паролей и валидации.","syntax":"string.ascii_letters  # 'abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ'","examples":"import string\nprint(string.ascii_letters)  # → abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ\nprint(len(string.ascii_letters))  # → 52\nimport random\npwd = ''.join(random.choices(string.ascii_letters, k=8))  # → случайный пароль 8 символов\nall_alpha = [c for c in 'Hello1' if c in string.ascii_letters]  # → ['H','e','l','l','o']\nprint('a' in string.ascii_letters)  # → True","version":null,"docs":"https://docs.python.org/3/library/string.html"},{"id":"string.ascii_lowercase","name":"string.ascii_lowercase","group":"Модуль string","subcat":"буквы","cg":"module","description":"Строка 'abcdefghijklmnopqrstuvwxyz'. string.ascii_uppercase — 'ABCDEFGHIJKLMNOPQRSTUVWXYZ'.","syntax":"string.ascii_lowercase  # 'abcdefghijklmnopqrstuvwxyz'\nstring.ascii_uppercase  # 'ABCDEFGHIJKLMNOPQRSTUVWXYZ'","examples":"import string\nprint(string.ascii_lowercase)  # → abcdefghijklmnopqrstuvwxyz\nprint(string.ascii_uppercase)  # → ABCDEFGHIJKLMNOPQRSTUVWXYZ\nprint(len(string.ascii_lowercase))  # → 26\nlower_only = [c for c in 'Hello' if c in string.ascii_lowercase]  # → ['e','l','l','o']\nupper_only = [c for c in 'Hello' if c in string.ascii_uppercase]  # → ['H']","version":null,"docs":"https://docs.python.org/3/library/string.html"},{"id":"string.punctuation","name":"string.punctuation","group":"Модуль string","subcat":"спецсимволы","cg":"module","description":"Строка стандартных знаков пунктуации ASCII. Используется при фильтрации или проверке текста.","syntax":"string.punctuation  # '!\"#$%&\\'()*+,-./:;<=>?@[\\\\]^_`{|}~'","examples":"import string\nprint(len(string.punctuation))  # → 32\nno_punct = ''.join(c for c in 'Hello, world!' if c not in string.punctuation)  # → 'Hello world'\nprint('!' in string.punctuation)  # → True\nhas_punct = any(c in string.punctuation for c in 'abc!')  # → True\nonly_punct = [c for c in 'Hi! :)' if c in string.punctuation]  # → ['!', ':', ')']","version":null,"docs":"https://docs.python.org/3/library/string.html"},{"id":"string.whitespace","name":"string.whitespace","group":"Модуль string","subcat":"спецсимволы","cg":"module","description":"Строка из пробельных символов: пробел, таб, новая строка, возврат каретки, вертикальный таб, перевод страницы.","syntax":"string.whitespace  # ' \\t\\n\\r\\x0b\\x0c'","examples":"import string\nprint(repr(string.whitespace))  # → ' \\t\\n\\r\\x0b\\x0c'\nprint(len(string.whitespace))  # → 6\nno_ws = ''.join(c for c in 'a b\\tc' if c not in string.whitespace)  # → 'abc'\nprint(' ' in string.whitespace)  # → True\nprint('\\t' in string.whitespace)  # → True","version":null,"docs":"https://docs.python.org/3/library/string.html"},{"id":"string.printable","name":"string.printable","group":"Модуль string","subcat":"спецсимволы","cg":"module","description":"Строка всех печатаемых символов: digits + ascii_letters + punctuation + whitespace. Длина — 100 символов.","syntax":"string.printable  # digits + letters + punctuation + whitespace","examples":"import string\nprint(len(string.printable))  # → 100\nprint(string.printable[:10])  # → 0123456789\nnon_printable = [c for c in 'hello\\x00world' if c not in string.printable]  # → ['\\x00']\nprint('A' in string.printable)  # → True\nprint('\\x01' in string.printable)  # → False","version":null,"docs":"https://docs.python.org/3/library/string.html"},{"id":"string.capwords","name":"string.capwords()","group":"Модуль string","subcat":"функции","cg":"module","description":"Разбивает строку по пробелам, делает каждое слово с заглавной буквы, склеивает обратно. Аналог title(), но убирает лишние пробелы.","syntax":"string.capwords(s, sep=None)","examples":"import string\nprint(string.capwords('hello world'))  # → Hello World\nprint(string.capwords('  hello   world  '))  # → Hello World\nprint(string.capwords('it\\'s a test'))  # → It\\'s A Test\nprint(string.capwords('one,two,three', ','))  # → One,Two,Three\nprint(string.capwords('UPPER lower'))  # → Upper Lower","version":null,"docs":"https://docs.python.org/3/library/string.html"},{"id":"string.digits","name":"string.digits","group":"Модуль string","subcat":"цифры","cg":"module","description":"Строка '0123456789'. Используется для проверки цифровых символов и генерации числовых кодов.","syntax":"string.digits  # '0123456789'","examples":"import string\nprint(string.digits)  # → 0123456789\nprint('5' in string.digits)  # → True\ndigits_only = [c for c in 'abc123' if c in string.digits]  # → ['1','2','3']\nimport random\npin = ''.join(random.choices(string.digits, k=4))  # → '4-значный PIN'\nprint(len(string.digits))  # → 10","version":null,"docs":"https://docs.python.org/3/library/string.html"},{"id":"string.hexdigits","name":"string.hexdigits","group":"Модуль string","subcat":"цифры","cg":"module","description":"Строка '0123456789abcdefABCDEF'. string.octdigits — '01234567'. Применяются при парсинге шестнадцатеричных/восьмеричных чисел.","syntax":"string.hexdigits  # '0123456789abcdefABCDEF'\nstring.octdigits  # '01234567'","examples":"import string\nprint(string.hexdigits)  # → 0123456789abcdefABCDEF\nprint(string.octdigits)  # → 01234567\nis_hex = all(c in string.hexdigits for c in 'ff00AA')  # → True\nis_oct = all(c in string.octdigits for c in '0755')  # → True\nprint(len(string.hexdigits))  # → 22","version":null,"docs":"https://docs.python.org/3/library/string.html"},{"id":"string.template","name":"string.Template","group":"Модуль string","subcat":"шаблоны","cg":"module","description":"Шаблон строки с подстановкой через $var или ${var}. Безопаснее % и format() для пользовательского ввода. Методы: substitute(), safe_substitute().","syntax":"string.Template(template_string)\nt.substitute(mapping, **kwargs)\nt.safe_substitute(mapping, **kwargs)","examples":"import string\nt = string.Template('Hello, $name!')\nprint(t.substitute(name='Alice'))  # → Hello, Alice!\nt2 = string.Template('${item} costs $price USD')\nprint(t2.substitute(item='apple', price=1.5))  # → apple costs 1.5 USD\nprint(t2.safe_substitute(item='apple'))  # → apple costs $price USD\nt3 = string.Template('Dear $who, thank you.')\nprint(t3.substitute({'who': 'Bob'}))  # → Dear Bob, thank you.","version":null,"docs":"https://docs.python.org/3/library/string.html"},{"id":"os.path.join","name":"os.path.join()","group":"Модуль os","subcat":"os.path","cg":"module","description":"Объединяет компоненты пути с учётом ОС. Абсолютный компонент сбрасывает предыдущие части.","syntax":"os.path.join(path, *paths) -> str","examples":"import os\nprint(os.path.join('home', 'user', 'file.txt'))  # → home/user/file.txt\nprint(os.path.join('/etc', 'nginx', 'conf'))  # → /etc/nginx/conf\nbase = '/var/log'\nprint(os.path.join(base, 'app.log'))  # → /var/log/app.log\nprint(os.path.join('a/b', '../c'))  # → a/b/../c\nprint(os.path.join('a', '/abs'))  # → /abs  (абсолютный сбрасывает)","version":null,"docs":"https://docs.python.org/3/library/os.html"},{"id":"os.path.exists-os.path.isfile-os.path.is","name":"os.path.exists() / os.path.isfile() / os.path.isdir()","group":"Модуль os","subcat":"os.path","cg":"module","description":"os.path.exists() — путь существует. os.path.isfile() — это файл. os.path.isdir() — это папка.","syntax":"os.path.exists(path) -> bool\nos.path.isfile(path) -> bool\nos.path.isdir(path) -> bool","examples":"import os\nprint(os.path.exists('/tmp'))  # → True\nprint(os.path.isfile('/tmp'))  # → False\nprint(os.path.isdir('/tmp'))  # → True\nprint(os.path.isfile('/etc/hosts'))  # → True\nprint(os.path.exists('/nonexistent'))  # → False","version":null,"docs":"https://docs.python.org/3/library/os.html"},{"id":"os.path.dirname-os.path.basename-os.path","name":"os.path.dirname() / os.path.basename() / os.path.split()","group":"Модуль os","subcat":"os.path","cg":"module","description":"dirname() — директория пути. basename() — имя файла/папки. split() — кортеж (dirname, basename).","syntax":"os.path.dirname(path) -> str\nos.path.basename(path) -> str\nos.path.split(path) -> (head, tail)","examples":"import os\npath = '/home/user/file.txt'\nprint(os.path.dirname(path))  # → /home/user\nprint(os.path.basename(path))  # → file.txt\nprint(os.path.split(path))  # → ('/home/user', 'file.txt')\nprint(os.path.basename('/home/user/'))  # → '' (пустой хвост)\nprint(os.path.dirname('file.txt'))  # → ''","version":null,"docs":"https://docs.python.org/3/library/os.html"},{"id":"os.path.splitext","name":"os.path.splitext()","group":"Модуль os","subcat":"os.path","cg":"module","description":"Разбивает путь на пару (root, ext), где ext — расширение файла с точкой. Удобно для смены расширения.","syntax":"os.path.splitext(path) -> (root, ext)","examples":"import os\nprint(os.path.splitext('report.pdf'))  # → ('report', '.pdf')\nprint(os.path.splitext('archive.tar.gz'))  # → ('archive.tar', '.gz')\nprint(os.path.splitext('no_extension'))  # → ('no_extension', '')\nname, ext = os.path.splitext('data.csv')\nprint(name + '.xlsx')  # → data.xlsx\nprint(os.path.splitext('/home/user/file.py'))  # → ('/home/user/file', '.py')","version":null,"docs":"https://docs.python.org/3/library/os.html"},{"id":"os.listdir","name":"os.listdir()","group":"Модуль os","subcat":"директории","cg":"module","description":"Возвращает список имён файлов и папок в указанной директории (без сортировки). По умолчанию — текущая директория.","syntax":"os.listdir(path='.') -> list[str]","examples":"import os\nfiles = os.listdir('.')  # → ['file.py', 'data.csv', ...]\npy_files = [f for f in os.listdir('.') if f.endswith('.py')]  # → все .py файлы\nprint(os.listdir('/tmp'))  # → содержимое /tmp\nprint(len(os.listdir('.')))  # → кол-во объектов в директории\nsorted_files = sorted(os.listdir('.'))  # → отсортированный список","version":null,"docs":"https://docs.python.org/3/library/os.html"},{"id":"os.makedirs-os.rmdir","name":"os.makedirs() / os.rmdir()","group":"Модуль os","subcat":"директории","cg":"module","description":"os.makedirs() создаёт папку включая промежуточные. os.rmdir() удаляет пустую папку.","syntax":"os.makedirs(path, mode=0o777, exist_ok=False)\nos.rmdir(path)","examples":"import os\nos.makedirs('a/b/c', exist_ok=True)  # → создаёт вложенные папки\nos.makedirs('new_dir', exist_ok=True)  # → не ошибка если папка уже есть\nos.rmdir('a/b/c')  # → удаляет только пустую c\nprint(os.path.isdir('a/b'))  # → True\nos.makedirs('/tmp/test_dir', exist_ok=True)  # → создаёт в /tmp","version":null,"docs":"https://docs.python.org/3/library/os.html"},{"id":"os.sep-os.linesep-os.pathsep","name":"os.sep / os.linesep / os.pathsep","group":"Модуль os","subcat":"константы","cg":"module","description":"Системные разделители: sep — разделитель пути ('/' или '\\\\'), linesep — перевод строки, pathsep — разделитель PATH (':' или ';').","syntax":"os.sep      # '/' на Unix, '\\\\' на Windows\nos.linesep  # '\\n' на Unix, '\\r\\n' на Windows\nos.pathsep  # ':' на Unix, ';' на Windows","examples":"import os\nprint(repr(os.sep))  # → '/'\nprint(repr(os.linesep))  # → '\\n'\nprint(repr(os.pathsep))  # → ':'\npaths = os.environ['PATH'].split(os.pathsep)  # → список директорий PATH\nfull_path = 'home' + os.sep + 'user'  # → 'home/user'","version":null,"docs":"https://docs.python.org/3/library/os.html"},{"id":"os.getcwd-os.chdir","name":"os.getcwd() / os.chdir()","group":"Модуль os","subcat":"навигация","cg":"module","description":"os.getcwd() возвращает текущую рабочую директорию. os.chdir(path) меняет её.","syntax":"os.getcwd() -> str\nos.chdir(path: str) -> None","examples":"import os\nprint(os.getcwd())  # → '/home/user/workspace'\nos.chdir('/tmp')\nprint(os.getcwd())  # → '/tmp'\nos.chdir('/home/user/workspace')\nprint(os.getcwd())  # → '/home/user/workspace'\nprint(type(os.getcwd()))  # → <class 'str'>","version":null,"docs":"https://docs.python.org/3/library/os.html"},{"id":"os.walk","name":"os.walk()","group":"Модуль os","subcat":"обход","cg":"module","description":"Генератор обхода дерева директорий. Для каждой папки возвращает (dirpath, dirnames, filenames).","syntax":"os.walk(top, topdown=True, onerror=None, followlinks=False)","examples":"import os\nfor root, dirs, files in os.walk('.'):\n    print(root)  # → текущая папка\nall_py = []\nfor root, dirs, files in os.walk('.'):\n    for f in files:\n        if f.endswith('.py'):\n            all_py.append(os.path.join(root, f))  # → все .py файлы рекурсивно\ntotal = sum(len(files) for _, _, files in os.walk('.'))  # → общее число файлов\nprint(total)  # → кол-во файлов","version":null,"docs":"https://docs.python.org/3/library/os.html"},{"id":"os.environ","name":"os.environ","group":"Модуль os","subcat":"окружение","cg":"module","description":"Словарь переменных окружения. Поддерживает get(), setitem, pop(). Изменения влияют на дочерние процессы.","syntax":"os.environ  # os._Environ (MutableMapping)\nos.environ.get(key, default=None)\nos.environ[key] = value","examples":"import os\nprint(os.environ.get('HOME'))  # → /home/user\nprint(os.environ.get('MISSING', 'default'))  # → default\npath = os.environ['PATH']  # → строка PATH\nos.environ['MY_VAR'] = 'hello'  # → установка переменной\nprint('MY_VAR' in os.environ)  # → True","version":null,"docs":"https://docs.python.org/3/library/os.html"},{"id":"os.getpid","name":"os.getpid()","group":"Модуль os","subcat":"процесс","cg":"module","description":"Возвращает PID (идентификатор) текущего процесса. Полезно для логирования и создания временных файлов с уникальными именами.","syntax":"os.getpid() -> int","examples":"import os\nprint(os.getpid())  # → 12345  (PID текущего процесса)\ntmp_name = f'/tmp/app_{os.getpid()}.tmp'  # → уникальное временное имя\nprint(type(os.getpid()))  # → <class 'int'>\nprint(os.getpid() > 0)  # → True\npid = os.getpid()\nprint(f'Process ID: {pid}')  # → Process ID: 12345","version":null,"docs":"https://docs.python.org/3/library/os.html"},{"id":"os.remove-os.rename","name":"os.remove() / os.rename()","group":"Модуль os","subcat":"файлы","cg":"module","description":"os.remove() удаляет файл. os.rename() переименовывает файл или папку. Для рекурсивного удаления папок — shutil.rmtree().","syntax":"os.remove(path)\nos.rename(src, dst)","examples":"import os\nos.remove('old_file.txt')  # → удаляет файл\nos.rename('old.txt', 'new.txt')  # → переименование\nos.rename('file.txt', '/tmp/file.txt')  # → перемещение\nif os.path.exists('temp.txt'):\n    os.remove('temp.txt')  # → безопасное удаление\nos.rename('folder_a', 'folder_b')  # → переименование папки","version":null,"docs":"https://docs.python.org/3/library/os.html"},{"id":"sys.argv","name":"sys.argv","group":"Модуль sys","subcat":"аргументы","cg":"module","description":"Список аргументов командной строки. sys.argv[0] — имя скрипта, остальные — переданные аргументы.","syntax":"sys.argv  # list[str]","examples":"import sys\nprint(sys.argv)  # → ['script.py', 'arg1', 'arg2']\nscript_name = sys.argv[0]  # → 'script.py'\nif len(sys.argv) > 1:\n    first_arg = sys.argv[1]  # → первый аргумент\nfor arg in sys.argv[1:]:\n    print(arg)  # → вывод всех аргументов\nprint(len(sys.argv))  # → кол-во аргументов включая имя скрипта","version":null,"docs":"https://docs.python.org/3/library/sys.html"},{"id":"sys.version-sys.platform-sys.implementat","name":"sys.version / sys.platform / sys.implementation","group":"Модуль sys","subcat":"информация","cg":"module","description":"sys.version — строка версии Python. sys.platform — ОС ('linux', 'win32', 'darwin'). sys.implementation — детали реализации (CPython и т.д.).","syntax":"sys.version        # str\nsys.version_info   # named tuple (major, minor, micro)\nsys.platform       # str\nsys.implementation # namespace","examples":"import sys\nprint(sys.version)  # → '3.11.0 (default, ...)'\nprint(sys.version_info)  # → sys.version_info(major=3, minor=11, ...)\nprint(sys.version_info.major)  # → 3\nprint(sys.platform)  # → 'linux'\nprint(sys.implementation.name)  # → 'cpython'","version":null,"docs":"https://docs.python.org/3/library/sys.html"},{"id":"sys.path","name":"sys.path","group":"Модуль sys","subcat":"модули","cg":"module","description":"Список директорий, в которых Python ищет модули при импорте. Можно модифицировать для добавления своих путей.","syntax":"sys.path  # list[str]","examples":"import sys\nprint(sys.path)  # → ['', '/usr/lib/python3...', ...]\nsys.path.append('/my/modules')  # → добавить путь\nsys.path.insert(0, '/priority/path')  # → приоритетный путь\nprint(sys.path[0])  # → '' (текущая директория)\nprint('/usr' in ''.join(sys.path))  # → True (обычно)","version":null,"docs":"https://docs.python.org/3/library/sys.html"},{"id":"sys.modules","name":"sys.modules","group":"Модуль sys","subcat":"модули","cg":"module","description":"Словарь всех загруженных модулей {имя: module}. Кэш импортов Python. Можно удалить модуль для перезагрузки.","syntax":"sys.modules  # dict[str, ModuleType]","examples":"import sys\nimport os\nprint('os' in sys.modules)  # → True\nprint(type(sys.modules['os']))  # → <class 'module'>\nprint(len(sys.modules))  # → кол-во загруженных модулей\ndel sys.modules['os']  # → принудительная выгрузка\nimport os  # → повторная загрузка","version":null,"docs":"https://docs.python.org/3/library/sys.html"},{"id":"sys.getsizeof","name":"sys.getsizeof()","group":"Модуль sys","subcat":"память","cg":"module","description":"Возвращает размер объекта в байтах (без учёта вложенных объектов). Использует __sizeof__ плюс служебные данные GC.","syntax":"sys.getsizeof(object, default=...) -> int","examples":"import sys\nprint(sys.getsizeof(0))  # → 28\nprint(sys.getsizeof(''))  # → 49\nprint(sys.getsizeof([]))  # → 56\nprint(sys.getsizeof({'a': 1}))  # → 232\nprint(sys.getsizeof(list(range(100))))  # → 920","version":null,"docs":"https://docs.python.org/3/library/sys.html"},{"id":"sys.stdin-sys.stdout-sys.stderr","name":"sys.stdin / sys.stdout / sys.stderr","group":"Модуль sys","subcat":"потоки","cg":"module","description":"Стандартные потоки ввода/вывода/ошибок. Можно перенаправлять для тестирования или записи в файл.","syntax":"sys.stdin   # TextIOWrapper (чтение)\nsys.stdout  # TextIOWrapper (запись)\nsys.stderr  # TextIOWrapper (ошибки)","examples":"import sys\nsys.stdout.write('hello\\n')  # → hello\nsys.stderr.write('error!\\n')  # → error! (в stderr)\nprint('msg', file=sys.stderr)  # → msg в поток ошибок\nprint(sys.stdin.encoding)  # → 'utf-8'\nprint(sys.stdout.encoding)  # → 'utf-8'","version":null,"docs":"https://docs.python.org/3/library/sys.html"},{"id":"sys.getrecursionlimit-sys.setrecursionli","name":"sys.getrecursionlimit() / sys.setrecursionlimit()","group":"Модуль sys","subcat":"рекурсия","cg":"module","description":"Получение и установка максимальной глубины рекурсии. По умолчанию 1000. Превышение вызывает RecursionError.","syntax":"sys.getrecursionlimit() -> int\nsys.setrecursionlimit(limit: int) -> None","examples":"import sys\nprint(sys.getrecursionlimit())  # → 1000\nsys.setrecursionlimit(5000)  # → установка нового лимита\nprint(sys.getrecursionlimit())  # → 5000\ntry:\n    def f(): return f()\n    f()\nexcept RecursionError:\n    print('RecursionError')  # → RecursionError\nsys.setrecursionlimit(1000)  # → возврат к стандарту","version":null,"docs":"https://docs.python.org/3/library/sys.html"},{"id":"sys.intern","name":"sys.intern()","group":"Модуль sys","subcat":"строки","cg":"module","description":"Интернирует строку — гарантирует, что идентичные строки используют один объект в памяти. Ускоряет сравнение через 'is'.","syntax":"sys.intern(string: str) -> str","examples":"import sys\na = sys.intern('hello')\nb = sys.intern('hello')\nprint(a is b)  # → True\nc = 'hel' + 'lo'\nprint(sys.intern(c) is a)  # → True\nwords = [sys.intern(w) for w in ['apple', 'banana', 'apple']]\nprint(words[0] is words[2])  # → True\nprint(type(sys.intern('x')))  # → <class 'str'>","version":null,"docs":"https://docs.python.org/3/library/sys.html"},{"id":"sys.exit","name":"sys.exit()","group":"Модуль sys","subcat":"управление","cg":"module","description":"Завершает программу. Аргумент 0 — успешное завершение, не-0 — ошибка. Поднимает SystemExit.","syntax":"sys.exit(status=0)\n# status: int или str","examples":"import sys\ntry:\n    sys.exit(0)\nexcept SystemExit as e:\n    print(e.code)  # → 0\ntry:\n    sys.exit(1)\nexcept SystemExit as e:\n    print(e.code)  # → 1\ntry:\n    sys.exit('Error!')\nexcept SystemExit as e:\n    print(e.code)  # → Error!\nprint(isinstance(SystemExit(), BaseException))  # → True","version":null,"docs":"https://docs.python.org/3/library/sys.html"},{"id":"collections.chainmap","name":"collections.ChainMap","group":"Модуль collections","subcat":"chainmap","cg":"module","description":"Объединяет несколько словарей в один вид. Поиск идёт по порядку. maps — список словарей, new_child() — новый дочерний уровень, parents — все кроме первого.","syntax":"collections.ChainMap(*maps)\n.new_child(m=None)\n.parents","examples":"from collections import ChainMap\ndefaults = {'color': 'red', 'size': 10}\nuser = {'color': 'blue'}\nchain = ChainMap(user, defaults)\nprint(chain['color'])  # → blue  (из user)\nprint(chain['size'])  # → 10  (из defaults)\nprint(chain.maps)  # → [{'color': 'blue'}, {'color': 'red', 'size': 10}]\nchild = chain.new_child({'size': 20})\nprint(child['size'])  # → 20","version":null,"docs":"https://docs.python.org/3/library/collections.html"},{"id":"collections.counter","name":"collections.Counter","group":"Модуль collections","subcat":"counter","cg":"module","description":"Словарь для подсчёта элементов. Методы: most_common(n), elements(), поддерживает +, -, &, |.","syntax":"collections.Counter(iterable_or_mapping=None)","examples":"from collections import Counter\nc = Counter('abracadabra')\nprint(c)  # → Counter({'a': 5, 'b': 2, 'r': 2, 'c': 1, 'd': 1})\nprint(c.most_common(2))  # → [('a', 5), ('b', 2)]\nc2 = Counter({'a': 1, 'b': 2})\nprint(c + c2)  # → сложение счётчиков\nprint(list(c.elements()))  # → все элементы с повторениями","version":null,"docs":"https://docs.python.org/3/library/collections.html"},{"id":"collections.defaultdict","name":"collections.defaultdict","group":"Модуль collections","subcat":"defaultdict","cg":"module","description":"Словарь с фабрикой значений по умолчанию. При обращении к отсутствующему ключу создаёт значение через фабрику.","syntax":"collections.defaultdict(default_factory, ...)","examples":"from collections import defaultdict\nd = defaultdict(int)\nd['a'] += 1  # → {'a': 1}, не KeyError\nd2 = defaultdict(list)\nd2['x'].append(1)  # → {'x': [1]}\nd3 = defaultdict(set)\nd3['k'].add('v')  # → {'k': {'v'}}\nprint(d['missing'])  # → 0 (int())","version":null,"docs":"https://docs.python.org/3/library/collections.html"},{"id":"collections.deque-1","name":"collections.deque","group":"Модуль collections","subcat":"deque","cg":"module","description":"Двусторонняя очередь. appendleft/popleft — O(1). rotate() сдвигает элементы. maxlen ограничивает длину.","syntax":"collections.deque(iterable=(), maxlen=None)\n.appendleft(x) / .popleft()\n.rotate(n)","examples":"from collections import deque\nd = deque([1, 2, 3])\nd.appendleft(0)  # → deque([0, 1, 2, 3])\nd.popleft()  # → 0, deque([1, 2, 3])\nd.rotate(1)  # → deque([3, 1, 2])\nbuf = deque(maxlen=3)\nfor i in range(5): buf.append(i)\nprint(buf)  # → deque([2, 3, 4], maxlen=3)","version":null,"docs":"https://docs.python.org/3/library/collections.html"},{"id":"collections.namedtuple","name":"collections.namedtuple","group":"Модуль collections","subcat":"namedtuple","cg":"module","description":"Создаёт подкласс tuple с именованными полями. Поддерживает _replace() (копия с изменёнными полями) и _asdict() (в словарь).","syntax":"collections.namedtuple(typename, field_names)","examples":"from collections import namedtuple\nPoint = namedtuple('Point', ['x', 'y'])\np = Point(1, 2)\nprint(p.x, p.y)  # → 1 2\nprint(p._asdict())  # → {'x': 1, 'y': 2}\np2 = p._replace(x=10)  # → Point(x=10, y=2)\nprint(p2)  # → Point(x=10, y=2)","version":null,"docs":"https://docs.python.org/3/library/collections.html"},{"id":"collections.ordereddict","name":"collections.OrderedDict","group":"Модуль collections","subcat":"ordereddict","cg":"module","description":"Словарь, запоминающий порядок вставки. move_to_end() перемещает ключ в начало или конец.","syntax":"collections.OrderedDict(items=...)\nodict.move_to_end(key, last=True)","examples":"from collections import OrderedDict\nod = OrderedDict([('a', 1), ('b', 2), ('c', 3)])\nod.move_to_end('a')  # → 'a' в конец\nprint(list(od.keys()))  # → ['b', 'c', 'a']\nod.move_to_end('c', last=False)  # → 'c' в начало\nprint(list(od.keys()))  # → ['c', 'b', 'a']\nprint(od.popitem(last=True))  # → ('a', 1)","version":null,"docs":"https://docs.python.org/3/library/collections.html"},{"id":"collections.userdict-userlist-userstring","name":"collections.UserDict / UserList / UserString","group":"Модуль collections","subcat":"user-классы","cg":"module","description":"Обёртки для встроенных типов, предназначенные для наследования и расширения. Данные хранятся в атрибуте .data.","syntax":"collections.UserDict(dict=None)\ncollections.UserList(initlist=None)\ncollections.UserString(seq='')","examples":"from collections import UserDict, UserList, UserString\nclass UpperDict(UserDict):\n    def __setitem__(self, key, val):\n        self.data[key.upper()] = val\nud = UpperDict()\nud['hello'] = 1\nprint(ud)  # → {'HELLO': 1}\nclass LimitedList(UserList):\n    def append(self, item):\n        if len(self.data) < 3: self.data.append(item)\nll = LimitedList([1, 2])\nll.append(3)\nprint(ll)  # → [1, 2, 3]\nll.append(4)\nprint(len(ll))  # → 3  (не добавился)\nus = UserString('hello')\nprint(us.upper())  # → HELLO","version":null,"docs":"https://docs.python.org/3/library/collections.html"},{"id":"functools.wraps","name":"functools.wraps","group":"Модуль functools","subcat":"декораторы","cg":"module","description":"Копирует метаданные декорируемой функции (__name__, __doc__, __annotations__) в функцию-обёртку. Обязателен при написании декораторов.","syntax":"@functools.wraps(wrapped)","examples":"from functools import wraps\ndef my_decorator(func):\n    @wraps(func)\n    def wrapper(*args, **kwargs):\n        return func(*args, **kwargs)\n    return wrapper\n@my_decorator\ndef greet(name):\n    \"\"\"Say hello.\"\"\"\n    return f'Hello, {name}'\nprint(greet.__name__)  # → greet\nprint(greet.__doc__)  # → Say hello.\nprint(greet('Alice'))  # → Hello, Alice!\nprint(greet.__wrapped__)  # → <function greet>","version":null,"docs":"https://docs.python.org/3/library/functools.html"},{"id":"functools.singledispatch","name":"functools.singledispatch","group":"Модуль functools","subcat":"диспетчеризация","cg":"module","description":"Декоратор для создания обобщённых функций с диспетчеризацией по типу первого аргумента. Регистрация через @func.register.","syntax":"@functools.singledispatch\n@func.register(type)","examples":"from functools import singledispatch\n@singledispatch\ndef process(arg):\n    return f'unknown: {arg}'\n@process.register(int)\ndef _(arg): return f'int: {arg * 2}'\n@process.register(str)\ndef _(arg): return f'str: {arg.upper()}'\nprint(process(5))  # → int: 10\nprint(process('hi'))  # → str: HI\nprint(process(3.14))  # → unknown: 3.14\nprint(process([1, 2]))  # → unknown: [1, 2]","version":null,"docs":"https://docs.python.org/3/library/functools.html"},{"id":"functools.lru_cache-functools.cache-1","name":"functools.lru_cache / functools.cache","group":"Модуль functools","subcat":"кэширование","cg":"module","description":"lru_cache кэширует результаты вызовов (LRU, ограниченный размер). cache — то же без ограничения (Python 3.9+). Только для хешируемых аргументов.","syntax":"@functools.lru_cache(maxsize=128)\n@functools.cache","examples":"from functools import lru_cache, cache\n@lru_cache(maxsize=128)\ndef fib(n):\n    return n if n < 2 else fib(n-1) + fib(n-2)\nprint(fib(10))  # → 55\nprint(fib.cache_info())  # → CacheInfo(hits=8, misses=11, maxsize=128, currsize=11)\nfib.cache_clear()  # → очистка кэша\n@cache\ndef fact(n): return 1 if n == 0 else n * fact(n-1)\nprint(fact(5))  # → 120","version":"3.9+","docs":"https://docs.python.org/3/library/functools.html"},{"id":"functools.cached_property","name":"functools.cached_property","group":"Модуль functools","subcat":"кэширование","cg":"module","description":"Вычисляет значение свойства один раз и сохраняет в __dict__ экземпляра. При повторном обращении возвращает кэш без вызова метода.","syntax":"@functools.cached_property","examples":"from functools import cached_property\nclass Circle:\n    def __init__(self, r): self.r = r\n    @cached_property\n    def area(self):\n        return 3.14159 * self.r ** 2\nc = Circle(5)\nprint(c.area)  # → 78.53975\nprint(c.area)  # → 78.53975  (без вычисления)\nprint('area' in c.__dict__)  # → True\nprint(type(c.__dict__['area']))  # → <class 'float'>","version":null,"docs":"https://docs.python.org/3/library/functools.html"},{"id":"functools.reduce","name":"functools.reduce","group":"Модуль functools","subcat":"сворачивание","cg":"module","description":"Сворачивает итерируемое применяя функцию накопительно слева направо. Необязательный initializer — начальное значение.","syntax":"functools.reduce(function, iterable[, initializer])","examples":"from functools import reduce\nprint(reduce(lambda a, b: a + b, [1, 2, 3, 4]))  # → 10\nprint(reduce(lambda a, b: a * b, range(1, 6)))  # → 120\nprint(reduce(lambda a, b: a + b, [], 0))  # → 0  (с initializer)\nprint(reduce(max, [3, 1, 4, 1, 5]))  # → 5\nprint(reduce(lambda a, b: a + [b], [1, 2, 3], []))  # → [1, 2, 3]","version":null,"docs":"https://docs.python.org/3/library/functools.html"},{"id":"functools.total_ordering","name":"functools.total_ordering","group":"Модуль functools","subcat":"сравнение","cg":"module","description":"Декоратор класса. Дополняет недостающие операторы сравнения (<, <=, >, >=) при наличии __eq__ и хотя бы одного из них.","syntax":"@functools.total_ordering","examples":"from functools import total_ordering\n@total_ordering\nclass Version:\n    def __init__(self, v): self.v = v\n    def __eq__(self, o): return self.v == o.v\n    def __lt__(self, o): return self.v < o.v\nv1, v2 = Version(1), Version(2)\nprint(v1 < v2)  # → True\nprint(v1 > v2)  # → False\nprint(v1 <= v1)  # → True\nprint(v2 >= v1)  # → True","version":null,"docs":"https://docs.python.org/3/library/functools.html"},{"id":"functools.partial-1","name":"functools.partial","group":"Модуль functools","subcat":"частичное","cg":"module","description":"Создаёт новую функцию с частично заполненными аргументами. Полезно для создания специализированных версий функций.","syntax":"functools.partial(func, /, *args, **kwargs) -> partial","examples":"from functools import partial\ndef power(base, exp): return base ** exp\nsquare = partial(power, exp=2)\nprint(square(5))  # → 25\ncube = partial(power, exp=3)\nprint(cube(3))  # → 27\nhex_int = partial(int, base=16)\nprint(hex_int('ff'))  # → 255\nprint(hex_int('1a'))  # → 26","version":null,"docs":"https://docs.python.org/3/library/functools.html"},{"id":"any-1","name":"Any","group":"Аннотации и typing","subcat":"any","cg":"typing","description":"Специальный тип: совместим с любым типом. Отключает проверку типов. Используется при миграции кода или для действительно динамических значений.","syntax":"from typing import Any\nx: Any = ...","examples":"from typing import Any\ndef log(value: Any) -> None:\n    print(value)\nlog(42)  # → 42\nlog('text')  # → text\nlog([1, 2, 3])  # → [1, 2, 3]\ndata: list[Any] = [1, 'a', None, 3.14]  # → смешанный список\nprint(type(data[0]))  # → <class 'int'>","version":null,"docs":"https://docs.python.org/3/library/typing.html"},{"id":"callable-arg-ret","name":"Callable[[arg], ret]","group":"Аннотации и typing","subcat":"callable","cg":"typing","description":"Аннотация для callable-объектов. Callable[[A1, A2], R] — принимает A1, A2, возвращает R. Callable[..., R] — любые аргументы.","syntax":"from typing import Callable\nCallable[[ArgType, ...], ReturnType]","examples":"from typing import Callable\ndef apply(f: Callable[[int], int], x: int) -> int:\n    return f(x)\nprint(apply(lambda x: x * 2, 5))  # → 10\ndef run(cb: Callable[[], None]) -> None:\n    cb()\nrun(lambda: print('called'))  # → called\ndef transform(data: list, fn: Callable[[int], int]) -> list:\n    return [fn(x) for x in data]\nprint(transform([1, 2, 3], lambda x: x ** 2))  # → [1, 4, 9]\nprint(callable(print))  # → True","version":null,"docs":"https://docs.python.org/3/library/typing.html"},{"id":"typevar","name":"TypeVar","group":"Аннотации и typing","subcat":"generics","cg":"typing","description":"Переменная типа для создания обобщённых функций и классов. Ограничения задаются через bound= или явный список типов.","syntax":"from typing import TypeVar\nT = TypeVar('T')\nT = TypeVar('T', bound=SomeType)\nT = TypeVar('T', int, str)","examples":"from typing import TypeVar\nT = TypeVar('T')\ndef first(lst: list[T]) -> T:\n    return lst[0]\nprint(first([1, 2, 3]))  # → 1\nprint(first(['a', 'b']))  # → 'a'\nN = TypeVar('N', int, float)\ndef double(x: N) -> N:\n    return x * 2\nprint(double(3))  # → 6\nprint(double(1.5))  # → 3.0","version":null,"docs":"https://docs.python.org/3/library/typing.html"},{"id":"generic-t","name":"Generic[T]","group":"Аннотации и typing","subcat":"generics","cg":"typing","description":"Базовый класс для создания обобщённых пользовательских классов. Параметры типа задаются через TypeVar.","syntax":"from typing import Generic, TypeVar\nT = TypeVar('T')\nclass MyClass(Generic[T]): ...","examples":"from typing import Generic, TypeVar\nT = TypeVar('T')\nclass Stack(Generic[T]):\n    def __init__(self): self._items: list[T] = []\n    def push(self, item: T) -> None: self._items.append(item)\n    def pop(self) -> T: return self._items.pop()\ns: Stack[int] = Stack()\ns.push(1)\ns.push(2)\nprint(s.pop())  # → 2\nprint(len(s._items))  # → 1\ns.push(10)\nprint(s.pop())  # → 10\nprint(len(s._items))  # → 1","version":null,"docs":"https://docs.python.org/3/library/typing.html"},{"id":"namedtuple","name":"NamedTuple","group":"Аннотации и typing","subcat":"namedtuple","cg":"typing","description":"Типизированный именованный кортеж через наследование. Синтаксис класса с аннотациями.","syntax":"from typing import NamedTuple\nclass MyTuple(NamedTuple):\n    field: type","examples":"from typing import NamedTuple\nclass Point(NamedTuple):\n    x: float\n    y: float\n    label: str = ''\np = Point(1.0, 2.0, 'A')\nprint(p.x)  # → 1.0\nprint(p.label)  # → A\nprint(p._asdict())  # → {'x': 1.0, 'y': 2.0, 'label': 'A'}\nprint(p._replace(x=5.0))  # → Point(x=5.0, y=2.0, label='A')","version":null,"docs":"https://docs.python.org/3/library/typing.html"},{"id":"typeddict","name":"TypedDict","group":"Аннотации и typing","subcat":"typeddict","cg":"typing","description":"Словарь с фиксированными типизированными ключами. Только для статического анализа; в рантайме — обычный dict.","syntax":"from typing import TypedDict\nclass MyDict(TypedDict):\n    key: type","examples":"from typing import TypedDict\nclass Point(TypedDict):\n    x: float\n    y: float\np: Point = {'x': 1.0, 'y': 2.0}\nprint(p['x'])  # → 1.0\nprint(p['y'])  # → 2.0\nclass User(TypedDict, total=False):\n    name: str\n    age: int\nu: User = {'name': 'Alice'}  # → age необязателен\nprint(u)  # → {'name': 'Alice'}","version":null,"docs":"https://docs.python.org/3/library/typing.html"},{"id":"classvar","name":"ClassVar","group":"Аннотации и typing","subcat":"атрибуты","cg":"typing","description":"Указывает, что переменная является переменной класса, а не экземпляра. Не должна присваиваться через self.","syntax":"from typing import ClassVar\nclass MyClass:\n    attr: ClassVar[type] = value","examples":"from typing import ClassVar\nclass Counter:\n    count: ClassVar[int] = 0\n    def __init__(self): Counter.count += 1\nc1 = Counter()\nc2 = Counter()\nprint(Counter.count)  # → 2\nclass Config:\n    debug: ClassVar[bool] = False\n    host: str = 'localhost'\nprint(Config.debug)  # → False\nprint(Config.host)  # → localhost\nConfig.debug = True\nprint(Config.debug)  # → True","version":null,"docs":"https://docs.python.org/3/library/typing.html"},{"id":"int-str-list-dict-аннотации","name":"int / str / list / dict (аннотации)","group":"Аннотации и typing","subcat":"встроенные","cg":"typing","description":"С Python 3.9+ встроенные типы используются как обобщения напрямую: list[int], dict[str, int]. Ранее нужен был typing.List, typing.Dict.","syntax":"x: int = 5\ns: str = 'hi'\nitems: list[int] = [1, 2, 3]\nmapping: dict[str, int] = {'a': 1}","examples":"def greet(name: str) -> str:\n    return f'Hello, {name}'\nprint(greet('Alice'))  # → Hello, Alice!\ndef total(nums: list[int]) -> int:\n    return sum(nums)\nprint(total([1, 2, 3]))  # → 6\ncoords: tuple[float, float] = (1.0, 2.0)  # → аннотация кортежа\nmatrix: list[list[int]] = [[1, 2], [3, 4]]  # → вложенные типы","version":"3.9+","docs":"https://docs.python.org/3/library/typing.html"},{"id":"type_checking","name":"TYPE_CHECKING","group":"Аннотации и typing","subcat":"импорт","cg":"typing","description":"Булева константа, True только при статическом анализе (mypy, pyright). Позволяет импортировать типы лишь для аннотаций, избегая циклических импортов в рантайме.","syntax":"from typing import TYPE_CHECKING\nif TYPE_CHECKING:\n    from module import SomeType","examples":"from typing import TYPE_CHECKING\nprint(TYPE_CHECKING)  # → False  (в рантайме)\nif TYPE_CHECKING:\n    from collections import OrderedDict\ndef process(path: 'str') -> None:\n    print(path)  # → строковая аннотация\nprocess('test')  # → test\nprint(bool(TYPE_CHECKING))  # → False","version":null,"docs":"https://docs.python.org/3/library/typing.html"},{"id":"final","name":"Final","group":"Аннотации и typing","subcat":"константы","cg":"typing","description":"Обозначает переменную как константу — не должна переназначаться после инициализации. Только для статического анализа.","syntax":"from typing import Final\nX: Final = value\nX: Final[type] = value","examples":"from typing import Final\nMAX_SIZE: Final = 100\nPI: Final[float] = 3.14159\nprint(MAX_SIZE)  # → 100\nprint(PI)  # → 3.14159\nclass Config:\n    HOST: Final = 'localhost'\n    PORT: Final[int] = 8080\nprint(Config.HOST)  # → localhost\nprint(Config.PORT)  # → 8080","version":null,"docs":"https://docs.python.org/3/library/typing.html"},{"id":"literal-v1-v2","name":"Literal[v1, v2]","group":"Аннотации и typing","subcat":"литерал","cg":"typing","description":"Тип, допускающий только конкретные литеральные значения. Позволяет mypy/pyright проверить, что передаётся допустимое значение.","syntax":"from typing import Literal\nLiteral['read', 'write']\nLiteral[1, 2, 3]","examples":"from typing import Literal\nMode = Literal['r', 'w', 'a']\ndef open_file(path: str, mode: Mode) -> None:\n    print(f'open {path} as {mode}')\nopen_file('f.txt', 'r')  # → open f.txt as r\nopen_file('f.txt', 'w')  # → open f.txt as w\nDirection = Literal['N', 'S', 'E', 'W']\ndef move(d: Direction) -> str:\n    return f'Moving {d}'\nprint(move('N'))  # → Moving N\nprint(move('S'))  # → Moving S","version":null,"docs":"https://docs.python.org/3/library/typing.html"},{"id":"union-x-y-x-y","name":"Union[X, Y] / X | Y","group":"Аннотации и typing","subcat":"объединение","cg":"typing","description":"Union[X, Y] — значение может быть типа X или Y. С Python 3.10+ поддерживается сокращённая запись X | Y.","syntax":"from typing import Union\nUnion[int, str]   # int или str\n# Python 3.10+: int | str","examples":"from typing import Union\ndef double(x: Union[int, float]) -> Union[int, float]:\n    return x * 2\nprint(double(3))  # → 6\nprint(double(1.5))  # → 3.0\ndef parse(val: int | str) -> str:\n    return str(val)\nprint(parse(42))  # → '42'\nprint(parse('hi'))  # → 'hi'","version":"3.10+","docs":"https://docs.python.org/3/library/typing.html"},{"id":"optional-x-x-none","name":"Optional[X] / X | None","group":"Аннотации и typing","subcat":"опциональный","cg":"typing","description":"Optional[X] означает X | None. С Python 3.10+ можно писать X | None напрямую. Применяется для значений, которые могут отсутствовать.","syntax":"from typing import Optional\nOptional[X]  # эквивалентно X | None\n# Python 3.10+: X | None","examples":"from typing import Optional\ndef find(name: str) -> Optional[str]:\n    return name if name else None\nprint(find('Alice'))  # → Alice\nprint(find(''))  # → None\nresult: Optional[int] = None  # → допустимо\ndef greet(name: str | None = None) -> str:\n    return f'Hi, {name or \"stranger\"}'\nprint(greet())  # → Hi, stranger","version":"3.10+","docs":"https://docs.python.org/3/library/typing.html"},{"id":"protocol","name":"Protocol","group":"Аннотации и typing","subcat":"протокол","cg":"typing","description":"Определяет интерфейс через структуру (duck typing). Класс считается совместимым, если реализует все методы Protocol, без явного наследования.","syntax":"from typing import Protocol\nclass MyProtocol(Protocol):\n    def method(self) -> type: ...","examples":"from typing import Protocol\nclass Drawable(Protocol):\n    def draw(self) -> None: ...\nclass Circle:\n    def draw(self) -> None: print('O')\nclass Square:\n    def draw(self) -> None: print('[]')\ndef render(shape: Drawable) -> None:\n    shape.draw()\nrender(Circle())  # → O\nrender(Square())  # → []\nprint(isinstance(Circle(), object))  # → True\nprint(hasattr(Circle(), 'draw'))  # → True","version":null,"docs":"https://docs.python.org/3/library/typing.html"},{"id":"re.group-re.groups","name":"re.group() / re.groups()","group":"Модуль re","subcat":"группы","cg":"module","description":"Методы объекта Match для доступа к захваченным группам. group(0) — всё совпадение, group(n) — n-я группа.","syntax":"m.group(n=0)\nm.groups(default=None)\nm.groupdict()","examples":"import re\nm = re.match(r'(\\w+)@(\\w+)', 'user@host')\nm.group() # → 'user@host'\nm.group(1) # → 'user'\nm.group(2) # → 'host'\nm.groups() # → ('user', 'host')\nm2 = re.match(r'(?P<y>\\d{4})-(?P<m>\\d{2})', '2024-01')\nm2.groupdict() # → {'y': '2024', 'm': '01'}","version":null,"docs":"https://docs.python.org/3/library/re.html"},{"id":"группы-в-паттернах","name":"Группы в паттернах","group":"Модуль re","subcat":"группы","cg":"module","description":"Расширенные конструкции групп: именованные, не захватывающие, lookahead и lookbehind.","syntax":"(?P<name>...) именованная\n(?:...) не захватывающая\n(?=...) lookahead\n(?!...) negative lookahead\n(?<=...) lookbehind","examples":"import re\nre.search(r'(?P<d>\\d+)', 'x42').group('d') # → '42'\nre.findall(r'(?:\\d+)', '1 2') # → ['1', '2'] без захвата\nre.findall(r'\\d+(?= руб)', '5 руб 3 кг') # → ['5']\nre.findall(r'\\d+(?! руб)', '5 руб 3 кг') # → ['3']\nre.findall(r'(?<=@)\\w+', 'user@host') # → ['host']","version":null,"docs":"https://docs.python.org/3/library/re.html"},{"id":"re.sub-re.subn","name":"re.sub() / re.subn()","group":"Модуль re","subcat":"замена","cg":"module","description":"re.sub() заменяет совпадения строкой или функцией. re.subn() дополнительно возвращает число замен.","syntax":"re.sub(pattern, repl, string, count=0, flags=0)\nre.subn(pattern, repl, string, count=0, flags=0)","examples":"import re\nre.sub(r'\\s+', '_', 'hello world') # → 'hello_world'\nre.sub(r'\\d', 'X', 'abc123', count=2) # → 'abcXX3'\nre.subn(r'[aeiou]', '*', 'hello') # → ('h*ll*', 2)\nre.sub(r'(\\w+)', lambda m: m.group().upper(), 'hi') # → 'HI'\nre.sub(r'(?P<y>\\d{4})-(?P<m>\\d{2})', r'\\g<m>/\\g<y>', '2024-01') # → '01/2024'","version":null,"docs":"https://docs.python.org/3/library/re.html"},{"id":"re.compile","name":"re.compile()","group":"Модуль re","subcat":"компиляция","cg":"module","description":"Компилирует паттерн в объект RegexObject для повторного использования. Ускоряет многократные операции.","syntax":"re.compile(pattern, flags=0)","examples":"import re\npat = re.compile(r'\\d+')\npat.findall('a1 b22') # → ['1', '22']\npat.sub('X', 'a1b2') # → 'aXbX'\npat.match('123abc').group() # → '123'\npat2 = re.compile(r'hello', re.IGNORECASE)\nbool(pat2.search('Hello World')) # → True","version":null,"docs":"https://docs.python.org/3/library/re.html"},{"id":"спецсимволы-паттернов","name":"Спецсимволы паттернов","group":"Модуль re","subcat":"паттерны","cg":"module","description":"Специальные символы регулярных выражений: метасимволы, классы, квантификаторы, якоря.","syntax":". ^ $ * + ? {n,m} [] | () \\ \\d \\w \\s","examples":"import re\nre.findall(r'.', 'ab') # → ['a', 'b']  . любой символ\nre.findall(r'\\d+', 'x12y3') # → ['12', '3']  \\d цифры\nre.findall(r'\\w+', 'hi_2!') # → ['hi_2']  \\w буквы/цифры/_\nre.findall(r'a{2,3}', 'a aa aaa') # → ['aa', 'aaa']\nre.findall(r'cat|dog', 'cat and dog') # → ['cat', 'dog']","version":null,"docs":"https://docs.python.org/3/library/re.html"},{"id":"re.match","name":"re.match()","group":"Модуль re","subcat":"поиск","cg":"module","description":"Проверяет совпадение паттерна с начала строки. Возвращает объект Match или None.","syntax":"re.match(pattern, string, flags=0)","examples":"import re\nm = re.match(r'\\d+', '123abc') # → <Match '123'>\nm.group() # → '123'\nre.match(r'\\d+', 'abc123') # → None\nm2 = re.match(r'[a-z]+', 'hello world') # → <Match 'hello'>\nm2.end() # → 5","version":null,"docs":"https://docs.python.org/3/library/re.html"},{"id":"re.search","name":"re.search()","group":"Модуль re","subcat":"поиск","cg":"module","description":"Ищет первое совпадение паттерна в любом месте строки. Возвращает Match или None.","syntax":"re.search(pattern, string, flags=0)","examples":"import re\nm = re.search(r'\\d+', 'abc123def') # → <Match '123'>\nm.group() # → '123'\nm.start() # → 3\nre.search(r'cat', 'the cat sat') # → <Match 'cat'>\nre.search(r'dog', 'the cat sat') # → None","version":null,"docs":"https://docs.python.org/3/library/re.html"},{"id":"re.fullmatch","name":"re.fullmatch()","group":"Модуль re","subcat":"поиск","cg":"module","description":"Проверяет совпадение паттерна со всей строкой целиком. Возвращает Match или None.","syntax":"re.fullmatch(pattern, string, flags=0)","examples":"import re\nre.fullmatch(r'\\d+', '12345') # → <Match '12345'>\nre.fullmatch(r'\\d+', '123abc') # → None\nre.fullmatch(r'[a-z]+', 'hello') # → <Match 'hello'>\nre.fullmatch(r'[a-z]+', 'Hello') # → None\nre.fullmatch(r'[a-z]+', 'Hello', re.IGNORECASE) # → <Match 'Hello'>","version":null,"docs":"https://docs.python.org/3/library/re.html"},{"id":"re.findall","name":"re.findall()","group":"Модуль re","subcat":"поиск","cg":"module","description":"Возвращает список всех совпадений паттерна в строке. Если есть группы — список кортежей.","syntax":"re.findall(pattern, string, flags=0)","examples":"import re\nre.findall(r'\\d+', 'a1 b22 c333') # → ['1', '22', '333']\nre.findall(r'[aeiou]', 'hello world') # → ['e', 'o', 'o']\nre.findall(r'(\\w+)=(\\w+)', 'x=1 y=2') # → [('x', '1'), ('y', '2')]\nre.findall(r'cat|dog', 'cat and dog') # → ['cat', 'dog']","version":null,"docs":"https://docs.python.org/3/library/re.html"},{"id":"re.finditer","name":"re.finditer()","group":"Модуль re","subcat":"поиск","cg":"module","description":"Возвращает итератор объектов Match для всех совпадений. Экономит память при большом тексте.","syntax":"re.finditer(pattern, string, flags=0)","examples":"import re\nfor m in re.finditer(r'\\d+', 'a1 b22 c333'):\n    print(m.group(), m.start()) # → 1 1, 22 3, 333 6\nmatches = list(re.finditer(r'[A-Z]', 'Hello World'))\nlen(matches) # → 2\nmatches[0].group() # → 'H'","version":null,"docs":"https://docs.python.org/3/library/re.html"},{"id":"re.split","name":"re.split()","group":"Модуль re","subcat":"разбивка","cg":"module","description":"Разбивает строку по совпадениям с паттерном. Группы в паттерне включаются в результат.","syntax":"re.split(pattern, string, maxsplit=0, flags=0)","examples":"import re\nre.split(r'\\s+', 'one two  three') # → ['one', 'two', 'three']\nre.split(r'[,;]', 'a,b;c') # → ['a', 'b', 'c']\nre.split(r'(\\d+)', 'a1b2c') # → ['a', '1', 'b', '2', 'c']\nre.split(r',', 'a,b,c', maxsplit=1) # → ['a', 'b,c']","version":null,"docs":"https://docs.python.org/3/library/re.html"},{"id":"флаги-re","name":"Флаги re","group":"Модуль re","subcat":"флаги","cg":"module","description":"Флаги изменяют поведение паттерна: регистр, многострочность, совпадение точки с \\n, подробный синтаксис.","syntax":"re.IGNORECASE (re.I), re.MULTILINE (re.M), re.DOTALL (re.S), re.VERBOSE (re.X)","examples":"import re\nre.findall(r'hello', 'Hello HELLO', re.I) # → ['Hello', 'HELLO']\nre.findall(r'^\\d', '1\\n2\\n3', re.M) # → ['1', '2', '3']\nre.match(r'.+', 'a\\nb', re.S).group() # → 'a\\nb'\npat = re.compile(r'''\n    \\d+   # цифры\n    [a-z] # буква\n''', re.X)\npat.findall('1a 2b 3') # → ['1a', '2b']","version":null,"docs":"https://docs.python.org/3/library/re.html"},{"id":"re.escape","name":"re.escape()","group":"Модуль re","subcat":"экранирование","cg":"module","description":"Экранирует все спецсимволы в строке, чтобы использовать её как литеральный паттерн.","syntax":"re.escape(pattern)","examples":"import re\nre.escape('1+1=2') # → '1\\\\+1\\\\=2'\nre.escape('file.txt') # → 'file\\\\.txt'\nq = 'price (USD)'\nre.findall(re.escape(q), 'price (USD) today') # → ['price (USD)']\nre.escape('a|b|c') # → 'a\\\\|b\\\\|c'","version":null,"docs":"https://docs.python.org/3/library/re.html"},{"id":"contextlib.contextmanager","name":"contextlib.contextmanager","group":"Модуль contextlib","subcat":"декоратор","cg":"module","description":"Декоратор для создания контекстного менеджера из генераторной функции с yield.","syntax":"@contextlib.contextmanager\ndef my_cm(): ...; yield value; ...","examples":"from contextlib import contextmanager\n@contextmanager\ndef greet(name):\n    print('enter')\n    yield f'hi {name}'\n    print('exit')\nwith greet('Bob') as msg:\n    print(msg) # → hi Bob\n# enter/exit печатаются автоматически\n@contextmanager\ndef tmp_dir(path):\n    import os; os.makedirs(path, exist_ok=True)\n    yield path  # cleanup можно в finally","version":null,"docs":"https://docs.python.org/3/library/contextlib.html"},{"id":"contextlib.exitstack","name":"contextlib.ExitStack","group":"Модуль contextlib","subcat":"динамический","cg":"module","description":"Позволяет динамически регистрировать произвольное число контекстных менеджеров и колбэков.","syntax":"with contextlib.ExitStack() as stack:\n    cm = stack.enter_context(some_cm())","examples":"from contextlib import ExitStack\nfiles = ['a.txt', 'b.txt']\nwith ExitStack() as stack:\n    fds = [stack.enter_context(open(f, 'w')) for f in files]\n    # все файлы закроются при выходе\nstack2 = ExitStack()\nstack2.callback(print, 'done')\nstack2.close() # → done","version":null,"docs":"https://docs.python.org/3/library/contextlib.html"},{"id":"contextlib.nullcontext","name":"contextlib.nullcontext","group":"Модуль contextlib","subcat":"заглушка","cg":"module","description":"Контекстный менеджер-заглушка, ничего не делающий. Полезен для условного использования КМ (Python 3.7+).","syntax":"contextlib.nullcontext(enter_result=None)","examples":"from contextlib import nullcontext\nwith nullcontext('value') as v:\n    print(v) # → 'value'\ndef process(cm=None):\n    with cm or nullcontext():\n        return 42\nprocess() # → 42\nprocess(nullcontext()) # → 42","version":null,"docs":"https://docs.python.org/3/library/contextlib.html"},{"id":"contextlib.closing","name":"contextlib.closing","group":"Модуль contextlib","subcat":"закрытие","cg":"module","description":"Оборачивает объект, чтобы его метод close() вызывался автоматически при выходе из блока with.","syntax":"contextlib.closing(thing)","examples":"from contextlib import closing\nfrom urllib.request import urlopen\nwith closing(urlopen('http://example.com')) as page:\n    data = page.read()  # page.close() вызовется автоматически\nclass Res:\n    def close(self): print('closed')\nwith closing(Res()) as r:\n    pass # → closed","version":null,"docs":"https://docs.python.org/3/library/contextlib.html"},{"id":"contextlib.suppress-1","name":"contextlib.suppress","group":"Модуль contextlib","subcat":"исключения","cg":"module","description":"Контекстный менеджер, который молча подавляет указанные типы исключений.","syntax":"contextlib.suppress(*exceptions)","examples":"from contextlib import suppress\nwith suppress(FileNotFoundError):\n    open('nope.txt') # → не вызывает ошибку\nwith suppress(KeyError, ValueError):\n    d = {}; d['x'] # → подавлено\nx = 10\nwith suppress(ZeroDivisionError):\n    x = 1 / 0  # x остаётся 10\nprint(x) # → 10","version":null,"docs":"https://docs.python.org/3/library/contextlib.html"},{"id":"contextlib.redirect_stdout-redirect_stde","name":"contextlib.redirect_stdout / redirect_stderr","group":"Модуль contextlib","subcat":"перенаправление","cg":"module","description":"Временно перенаправляет sys.stdout или sys.stderr в другой файлоподобный объект.","syntax":"contextlib.redirect_stdout(new_target)\ncontextlib.redirect_stderr(new_target)","examples":"from contextlib import redirect_stdout\nimport io\nbuf = io.StringIO()\nwith redirect_stdout(buf):\n    print('hello')\nbuf.getvalue() # → 'hello\\n'\nfrom contextlib import redirect_stderr\nerr = io.StringIO()\nwith redirect_stderr(err):\n    import sys; print('err', file=sys.stderr)\nerr.getvalue() # → 'err\\n'","version":null,"docs":"https://docs.python.org/3/library/contextlib.html"},{"id":"copy.deepcopy-1","name":"copy.deepcopy()","group":"Модуль copy","subcat":"глубокая","cg":"module","description":"Рекурсивно копирует объект и все вложенные объекты. Изменения в копии не затрагивают оригинал.","syntax":"copy.deepcopy(obj, memo=None)","examples":"import copy\na = [1, [2, 3]]\nb = copy.deepcopy(a)\nb[1].append(99)\nprint(a) # → [1, [2, 3]]  оригинал не изменён\nd = {'x': {'y': 1}}\nd2 = copy.deepcopy(d)\nd2['x'] is d['x'] # → False\nd2['x']['y'] = 999\nd['x']['y'] # → 1","version":null,"docs":"https://docs.python.org/3/library/copy.html"},{"id":"__copy__-__deepcopy__","name":"__copy__() / __deepcopy__()","group":"Модуль copy","subcat":"кастомизация","cg":"module","description":"Методы для настройки поведения copy.copy() и copy.deepcopy() в пользовательских классах.","syntax":"def __copy__(self): ...\ndef __deepcopy__(self, memo): ...","examples":"import copy\nclass MyObj:\n    def __init__(self, v): self.v = v\n    def __copy__(self):\n        return MyObj(self.v)\n    def __deepcopy__(self, memo):\n        return MyObj(copy.deepcopy(self.v, memo))\nobj = MyObj([1,2])\nc = copy.copy(obj)\nc.v is obj.v # → True  (shallow)\nd = copy.deepcopy(obj)\nd.v is obj.v # → False","version":null,"docs":"https://docs.python.org/3/library/copy.html"},{"id":"ловушки-копирования","name":"Ловушки копирования","group":"Модуль copy","subcat":"ловушки","cg":"module","description":"Типичные ошибки: mutable default arguments, циклические ссылки, shared state при shallow copy.","syntax":"# Используй copy/deepcopy для безопасного копирования мутируемых объектов","examples":"import copy\n# Mutable default — антипаттерн:\ndef bad(lst=[]):\n    lst.append(1); return lst\nbad(); bad() # → [1, 1]  один объект!\n# Циклическая ссылка:\na = []\na.append(a)\nb = copy.deepcopy(a)  # deepcopy справляется\nb is a # → False\n# Shallow: одинаковые вложенные объекты\nx = [[0]*3]*3\ny = copy.copy(x)\ny[0][0] = 9\nprint(x) # → [[9,0,0],[9,0,0],[9,0,0]]","version":null,"docs":"https://docs.python.org/3/library/copy.html"},{"id":"copy.copy","name":"copy.copy()","group":"Модуль copy","subcat":"поверхностная","cg":"module","description":"Создаёт поверхностную копию объекта: новый объект, но вложенные объекты остаются общими.","syntax":"copy.copy(obj)","examples":"import copy\na = [1, [2, 3]]\nb = copy.copy(a)\nb.append(4)\nprint(a) # → [1, [2, 3]]\nb[1].append(99)\nprint(a) # → [1, [2, 3, 99]]  вложенный общий!\nd = {'x': [1, 2]}\nd2 = copy.copy(d)\nd2['x'] is d['x'] # → True","version":null,"docs":"https://docs.python.org/3/library/copy.html"},{"id":"io.bytesio","name":"io.BytesIO","group":"Модуль io","subcat":"байты","cg":"module","description":"Файлоподобный объект для бинарных данных в памяти. Аналог StringIO для байтов.","syntax":"io.BytesIO(initial_bytes=b'')","examples":"import io\nbuf = io.BytesIO()\nbuf.write(b'\\x00\\x01\\x02')\nbuf.getvalue() # → b'\\x00\\x01\\x02'\nbuf.seek(0)\nbuf.read(1) # → b'\\x00'\nb = io.BytesIO(b'data')\nb.read() # → b'data'\nlen(io.BytesIO(b'abc').getvalue()) # → 3","version":null,"docs":"https://docs.python.org/3/library/io.html"},{"id":"буферизация","name":"Буферизация","group":"Модуль io","subcat":"буферизация","cg":"module","description":"Буферизованный ввод-вывод накапливает данные в памяти перед записью. flush() принудительно сбрасывает буфер.","syntax":"open(file, buffering=-1)  # -1 авто, 0 без буфера (только binary), 1 строчный\nstream.flush()","examples":"import io\nbuf = io.StringIO()\nbuf.write('text')\nbuf.getvalue() # → 'text'  StringIO не нуждается в flush\nf = open('/tmp/test_io.txt', 'w', buffering=1)\nf.write('line\\n')\nf.flush()  # строки сразу сбрасываются\nf.close()\nopen('/tmp/test_io.txt').read() # → 'line\\n'","version":null,"docs":"https://docs.python.org/3/library/io.html"},{"id":"io.textiowrapper","name":"io.TextIOWrapper","group":"Модуль io","subcat":"обёртка","cg":"module","description":"Оборачивает бинарный поток, добавляя кодирование/декодирование текста. Используется в open() внутри.","syntax":"io.TextIOWrapper(buffer, encoding=None, errors=None, newline=None)","examples":"import io\nraw = io.BytesIO(b'hello')\nwrapper = io.TextIOWrapper(raw, encoding='utf-8')\nwrapper.read() # → 'hello'\n# Запись:\nbuf = io.BytesIO()\ntw = io.TextIOWrapper(buf, encoding='utf-8')\ntw.write('мир')\ntw.flush()\nbuf.getvalue() # → b'\\xd0\\xbc\\xd0\\xb8\\xd1\\x80'","version":null,"docs":"https://docs.python.org/3/library/io.html"},{"id":"io.stringio","name":"io.StringIO","group":"Модуль io","subcat":"строки","cg":"module","description":"Файлоподобный объект, хранящий строковые данные в памяти. Удобен для тестирования и буферизации.","syntax":"io.StringIO(initial_value='', newline='\\n')","examples":"import io\nbuf = io.StringIO()\nbuf.write('hello\\n')\nbuf.write('world')\nbuf.getvalue() # → 'hello\\nworld'\nbuf.seek(0)\nbuf.read() # → 'hello\\nworld'\ns = io.StringIO('line1\\nline2')\nlist(s) # → ['line1\\n', 'line2']","version":null,"docs":"https://docs.python.org/3/library/io.html"},{"id":"auto","name":"auto()","group":"Модуль enum","subcat":"auto","cg":"module","description":"Автоматически назначает значения элементам перечисления (по умолчанию — последовательные числа).","syntax":"from enum import auto\nclass X(Enum):\n    A = auto()","examples":"from enum import Enum, auto\nclass Dir(Enum):\n    NORTH = auto()\n    SOUTH = auto()\n    EAST = auto()\n    WEST = auto()\nDir.NORTH.value # → 1\nDir.SOUTH.value # → 2\nlist(Dir) # → [<Dir.NORTH:1>, <Dir.SOUTH:2>, ...]","version":null,"docs":"https://docs.python.org/3/library/enum.html"},{"id":".name-.value","name":".name / .value","group":"Модуль enum","subcat":"атрибуты","cg":"module","description":"Каждый элемент перечисления имеет атрибуты .name (строка) и .value (заданное значение).","syntax":"member.name  # → 'RED'\nmember.value # → 1","examples":"from enum import Enum\nclass Color(Enum):\n    RED = 1; GREEN = 2\nColor.RED.name # → 'RED'\nColor.RED.value # → 1\nColor(1).name # → 'RED'\nfor c in Color:\n    print(c.name, c.value) # RED 1, GREEN 2","version":null,"docs":"https://docs.python.org/3/library/enum.html"},{"id":"enum","name":"Enum","group":"Модуль enum","subcat":"базовый","cg":"module","description":"Базовый класс для создания именованных перечислений. Каждый элемент — уникальный символьный объект.","syntax":"from enum import Enum\nclass Color(Enum):\n    RED = 1","examples":"from enum import Enum\nclass Color(Enum):\n    RED = 1; GREEN = 2; BLUE = 3\nColor.RED # → <Color.RED: 1>\nColor(2) # → <Color.GREEN: 2>\nColor['BLUE'] # → <Color.BLUE: 3>\ntype(Color.RED) # → <enum 'Color'>\nColor.RED == Color.RED # → True","version":null,"docs":"https://docs.python.org/3/library/enum.html"},{"id":"intenum-strenum","name":"IntEnum / StrEnum","group":"Модуль enum","subcat":"базовый","cg":"module","description":"IntEnum — перечисление, совместимое с int. StrEnum — совместимое со str (Python 3.11+).","syntax":"class X(IntEnum): ...\nclass Y(StrEnum): ...","examples":"from enum import IntEnum\nclass Prio(IntEnum):\n    LOW = 1; MED = 2; HIGH = 3\nPrio.HIGH > Prio.LOW # → True\nPrio.MED + 1 # → 3\nfrom enum import StrEnum\nclass Status(StrEnum):\n    OK = 'ok'; ERR = 'error'\nStatus.OK == 'ok' # → True\nf'status: {Status.ERR}' # → 'status: error'","version":"3.11+","docs":"https://docs.python.org/3/library/enum.html"},{"id":"итерация-и-сравнение-enum","name":"Итерация и сравнение Enum","group":"Модуль enum","subcat":"базовый","cg":"module","description":"Перечисления поддерживают итерацию по list(MyEnum) и сравнение через is / ==. IntEnum поддерживает <, >.","syntax":"list(MyEnum)  # все элементы\nfor m in MyEnum: ...\nmember is MyEnum.X","examples":"from enum import Enum\nclass Day(Enum):\n    MON=1; TUE=2; WED=3\nlist(Day) # → [<Day.MON:1>, <Day.TUE:2>, <Day.WED:3>]\nDay.MON is Day.MON # → True\nDay.MON == Day.MON # → True\nDay.MON == 1 # → False (Enum не совместим с int)\nDay.MON in Day # → True","version":null,"docs":"https://docs.python.org/3/library/enum.html"},{"id":"_missing_","name":"_missing_()","group":"Модуль enum","subcat":"обработка","cg":"module","description":"Классовый метод _missing_() вызывается, когда значение не найдено в перечислении (через Enum(value)).","syntax":"@classmethod\ndef _missing_(cls, value): ...","examples":"from enum import Enum\nclass Color(Enum):\n    RED = 1; GREEN = 2\n    @classmethod\n    def _missing_(cls, value):\n        return cls.RED  # значение по умолчанию\nColor(99) # → <Color.RED: 1>\nColor(0) # → <Color.RED: 1>\nColor(1) # → <Color.RED: 1>","version":null,"docs":"https://docs.python.org/3/library/enum.html"},{"id":"unique","name":"@unique","group":"Модуль enum","subcat":"проверка","cg":"module","description":"Декоратор @unique запрещает дублирование значений в перечислении — вызывает ValueError при нарушении.","syntax":"from enum import unique\n@unique\nclass X(Enum): ...","examples":"from enum import Enum, unique\n@unique\nclass Status(Enum):\n    ACTIVE = 1; INACTIVE = 2\n# @unique\n# class Bad(Enum):\n#     A = 1; B = 1  # → ValueError!\nStatus.ACTIVE.value # → 1\nStatus.INACTIVE.value # → 2","version":null,"docs":"https://docs.python.org/3/library/enum.html"},{"id":"flag-intflag","name":"Flag / IntFlag","group":"Модуль enum","subcat":"флаги","cg":"module","description":"Flag и IntFlag поддерживают битовые операции: объединение через |, проверку через &.","syntax":"from enum import Flag, IntFlag\nclass Perm(Flag):\n    R = 1; W = 2; X = 4","examples":"from enum import Flag, auto\nclass Perm(Flag):\n    READ = auto()\n    WRITE = auto()\n    EXEC = auto()\nrw = Perm.READ | Perm.WRITE\nPerm.READ in rw # → True\nPerm.EXEC in rw # → False\nrw & Perm.WRITE # → <Perm.WRITE: 2>","version":null,"docs":"https://docs.python.org/3/library/enum.html"},{"id":"field","name":"field()","group":"Модуль dataclasses","subcat":"field","cg":"module","description":"Функция field() задаёт дополнительные параметры поля: значение по умолчанию, фабрику, участие в repr/compare/init.","syntax":"dataclasses.field(*, default=MISSING, default_factory=MISSING, repr=True, hash=None, compare=True, init=True)","examples":"from dataclasses import dataclass, field\n@dataclass\nclass Bag:\n    items: list = field(default_factory=list)\n    _id: int = field(default=0, repr=False, compare=False)\nb = Bag()\nb.items.append(1)\nrepr(b) # → 'Bag(items=[1])'\nBag() == Bag() # → True","version":null,"docs":"https://docs.python.org/3/library/dataclasses.html"},{"id":"dataclasses.fields","name":"dataclasses.fields()","group":"Модуль dataclasses","subcat":"field","cg":"module","description":"Возвращает кортеж объектов Field с метаданными каждого поля датакласса.","syntax":"dataclasses.fields(class_or_instance)","examples":"from dataclasses import dataclass, fields\n@dataclass\nclass Pt:\n    x: int; y: int = 0\nfor f in fields(Pt):\n    print(f.name, f.type) # x int, y int\nfields(Pt)[0].name # → 'x'\nfields(Pt)[1].default # → 0","version":null,"docs":"https://docs.python.org/3/library/dataclasses.html"},{"id":"dataclass-1","name":"@dataclass","group":"Модуль dataclasses","subcat":"базовый","cg":"module","description":"Декоратор, автоматически генерирующий __init__, __repr__, __eq__ на основе аннотаций полей класса.","syntax":"@dataclass\nclass Name:\n    field: type = default","examples":"from dataclasses import dataclass\n@dataclass\nclass Point:\n    x: float\n    y: float = 0.0\np = Point(1.0, 2.0)\nrepr(p) # → 'Point(x=1.0, y=2.0)'\nPoint(1.0) == Point(1.0) # → True\np.x # → 1.0","version":null,"docs":"https://docs.python.org/3/library/dataclasses.html"},{"id":"dataclass-frozen-true","name":"@dataclass(frozen=True)","group":"Модуль dataclasses","subcat":"базовый","cg":"module","description":"frozen=True делает экземпляры неизменяемыми (аналог namedtuple) и хэшируемыми.","syntax":"@dataclass(frozen=True)\nclass Pt:\n    x: int; y: int","examples":"from dataclasses import dataclass\n@dataclass(frozen=True)\nclass Pt:\n    x: int; y: int\np = Pt(1, 2)\np.x # → 1\nhash(p) # → работает (объект хэшируем)\n# p.x = 5  # → FrozenInstanceError\nd = {p: 'origin'}\nd[Pt(1, 2)] # → 'origin'","version":null,"docs":"https://docs.python.org/3/library/dataclasses.html"},{"id":"dataclass-order-true","name":"@dataclass(order=True)","group":"Модуль dataclasses","subcat":"базовый","cg":"module","description":"order=True добавляет методы __lt__, __le__, __gt__, __ge__ на основе кортежа полей.","syntax":"@dataclass(order=True)\nclass X:\n    a: int; b: int","examples":"from dataclasses import dataclass\n@dataclass(order=True)\nclass Version:\n    major: int\n    minor: int\nv1 = Version(1, 0)\nv2 = Version(2, 0)\nv1 < v2 # → True\nsorted([Version(2,0), Version(1,5)]) # → [Version(1,5), Version(2,0)]","version":null,"docs":"https://docs.python.org/3/library/dataclasses.html"},{"id":"__post_init__","name":"__post_init__","group":"Модуль dataclasses","subcat":"инициализация","cg":"module","description":"Метод __post_init__ вызывается автоматически после __init__ для дополнительной валидации или обработки.","syntax":"def __post_init__(self): ...","examples":"from dataclasses import dataclass\n@dataclass\nclass Circle:\n    radius: float\n    def __post_init__(self):\n        if self.radius < 0:\n            raise ValueError('radius < 0')\n        self.area = 3.14 * self.radius ** 2\nc = Circle(3.0)\nc.area # → 28.26\n# Circle(-1) # → ValueError","version":null,"docs":"https://docs.python.org/3/library/dataclasses.html"},{"id":"dataclasses.asdict-astuple","name":"dataclasses.asdict() / astuple()","group":"Модуль dataclasses","subcat":"конвертация","cg":"module","description":"asdict() рекурсивно конвертирует датакласс в словарь, astuple() — в кортеж.","syntax":"dataclasses.asdict(obj)\ndataclasses.astuple(obj)","examples":"from dataclasses import dataclass, asdict, astuple\n@dataclass\nclass Point:\n    x: int; y: int\np = Point(1, 2)\nasdict(p) # → {'x': 1, 'y': 2}\nastuple(p) # → (1, 2)\nimport json\njson.dumps(asdict(p)) # → '{\"x\": 1, \"y\": 2}'","version":null,"docs":"https://docs.python.org/3/library/dataclasses.html"},{"id":"dataclasses.replace","name":"dataclasses.replace()","group":"Модуль dataclasses","subcat":"копирование","cg":"module","description":"Создаёт новый экземпляр датакласса на основе существующего, заменяя указанные поля.","syntax":"dataclasses.replace(obj, **changes)","examples":"from dataclasses import dataclass, replace\n@dataclass\nclass Point:\n    x: int; y: int\np = Point(1, 2)\np2 = replace(p, x=10)\np2 # → Point(x=10, y=2)\np # → Point(x=1, y=2)\nreplace(p, x=0, y=0) # → Point(x=0, y=0)","version":null,"docs":"https://docs.python.org/3/library/dataclasses.html"},{"id":"heapq.nlargest-heapq.nsmallest","name":"heapq.nlargest() / heapq.nsmallest()","group":"Модуль heapq","subcat":"выборка","cg":"module","description":"Возвращает N наибольших или наименьших элементов последовательности. Работает с key-функцией.","syntax":"heapq.nlargest(n, iterable, key=None)\nheapq.nsmallest(n, iterable, key=None)","examples":"import heapq\ndata = [3, 1, 4, 1, 5, 9, 2, 6]\nheapq.nlargest(3, data) # → [9, 6, 5]\nheapq.nsmallest(3, data) # → [1, 1, 2]\nrecords = [{'v': 5}, {'v': 1}, {'v': 9}]\nheapq.nlargest(2, records, key=lambda x: x['v'])\n# → [{'v': 9}, {'v': 5}]","version":null,"docs":"https://docs.python.org/3/library/heapq.html"},{"id":"heapq.heappush-heapq.heappop","name":"heapq.heappush() / heapq.heappop()","group":"Модуль heapq","subcat":"операции","cg":"module","description":"heappush() добавляет элемент в кучу, heappop() извлекает и возвращает наименьший элемент.","syntax":"heapq.heappush(heap, item)\nheapq.heappop(heap)","examples":"import heapq\nh = []\nheapq.heappush(h, 3)\nheapq.heappush(h, 1)\nheapq.heappush(h, 2)\nheapq.heappop(h) # → 1\nheapq.heappop(h) # → 2\nh # → [3]","version":null,"docs":"https://docs.python.org/3/library/heapq.html"},{"id":"heapq.heapify","name":"heapq.heapify()","group":"Модуль heapq","subcat":"операции","cg":"module","description":"Преобразует произвольный список в min-heap за O(n). Изменяет список на месте.","syntax":"heapq.heapify(x)","examples":"import heapq\ndata = [5, 2, 8, 1, 4]\nheapq.heapify(data)\ndata[0] # → 1  (минимальный элемент)\nheapq.heappop(data) # → 1\nheapq.heappop(data) # → 2\ndata # → [4, 5, 8]","version":null,"docs":"https://docs.python.org/3/library/heapq.html"},{"id":"heapq.heapreplace-heapq.heappushpop","name":"heapq.heapreplace() / heapq.heappushpop()","group":"Модуль heapq","subc
