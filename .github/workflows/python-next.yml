# Предварительная версия Python: будет ли проект работать на следующей.
#
# ПОЧЕМУ ОТДЕЛЬНЫЙ ФАЙЛ, А НЕ РАБОТА В ci.yml (Glossary-Python#53). Значок
# workflow/status показывает исход всего прогона. Живи 3.15 работой внутри
# ci.yml с continue-on-error, значок ci оставался бы зелёным при красном 3.15 и
# ответа о 3.15 не давал бы. Здесь красное честное: ответ на вопрос и есть цвет
# прогона, поэтому continue-on-error нет.
#
# ПОЧЕМУ НЕ НА ИЗМЕНЕНИИ. Необязательный канал слияния не держит (правило
# каталога 084): красное на 3.15 значит «на 3.15 пока не заработает», а не
# «изменение сломано». Поэтому pull_request здесь нет вовсе.
#
# ПОЧЕМУ РАСПИСАНИЕ. Слияния делает автомерж токеном прогона, а его пуш новых
# прогонов не будит: без расписания этот прогон не шёл бы никогда. Ежедневно, а
# не еженедельно: недельный прогон сообщал о поломке с опозданием до семи дней.
#
# ПОЧЕМУ ТРЕВОГА ЗАДАЧЕЙ (#154). Красное здесь честное, но его никто не видел:
# с 05.10 прогон красный, а значок не будит — его надо пойти и посмотреть.
# Работа alarm держит одну задачу с меткой python-next открытой, пока прогон
# красный, и закрывает её на зелёном (scripts/next_alarm.py).
#
# ЗАМЕР ЯЗЫКА 3.15 — не здесь: инвентарь снимается работой preview в
# badges.yml, где он нужен разности версий.
name: python-next

on:
  push:
    branches: [main]
  schedule:
    # Ежедневно; минута не 0 — не в пик.
    - cron: "41 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: python-next-${{ github.sha }}
  cancel-in-progress: true

jobs:
  tests:
    name: Тесты (Python 3.15, предварительная)
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    outputs:
      version: ${{ steps.py.outputs.python-version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true

      # Без allow-prereleases setup-python предрелиз не ставит. Пометка — о
      # чужом календаре (правило каталога 203): с выходом 3.15 её снимают, а
      # следующей предварительной становится 3.16.
      - id: py
        uses: actions/setup-python@v7
        with:
          python-version: "3.15"
          allow-prereleases: true

      - name: Установка зависимостей
        run: python -m pip install -e ".[dev]"

      - name: Тесты
        run: pytest -q

      # Карточки обещают работу и на следующей версии, пока её removed не
      # наступил: исчезнувший вызов или сменившийся вывод виден здесь (#154).
      - name: Примеры карточек на предварительной версии
        if: always()
        run: python scripts/check_examples.py

  # Права на задачи — только здесь: тестам писать в репозиторий незачем.
  alarm:
    name: Тревога о красном на предварительной версии
    needs: tests
    # Только main: красное на ручном прогоне ветки — вопрос её автора.
    if: always() && github.ref == 'refs/heads/main'
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Задача-тревога сведена с исходом прогона
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.tests.outputs.version || '3.15' }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python scripts/next_alarm.py \
            --outcome "${{ needs.tests.result }}" \
            --version "$VERSION" --run-url "$RUN_URL"
