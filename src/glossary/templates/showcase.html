<!DOCTYPE html>
<html lang="ru" data-theme="light" data-lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="light dark">
<title>Python Glossary — справочник стандартной библиотеки</title>
<style>
/* Шрифты системные: страницу скачивают и открывают без сети,
   а веб-шрифт с CDN превратил бы её в наполовину загруженную. */
:root{
  --bg:#f4f2ec; --surface:#fff; --surface-2:#faf9f5; --surface-3:#f2efe7;
  --border:#e6e2d8; --border-strong:#d6d0c2;
  --text:#161b26; --muted:#666e7d; --faint:#98a0ad;
  --accent:#2f54eb; --accent-soft:#e9edfd; --accent-ink:#1c39a8;
  --code-bg:#f7f5ef; --code-border:#eae5d9; --mark-bg:#ffe27a; --mark-ink:#4d3d00;
  --ok:#0d9f6e;
  --shadow:0 1px 2px rgba(22,27,38,.05), 0 3px 12px rgba(22,27,38,.05);
  --shadow-lg:0 12px 44px rgba(22,27,38,.16);
  --radius:15px; --radius-sm:10px; --radius-xs:7px;
  --c-builtin:#3b82f6; --c-str:#0d9f6e; --c-seq:#8b5cf6; --c-mapset:#6366f1;
  --c-oop:#ec4899;   --c-exc:#ef4444; --c-module:#e0850b; --c-iter:#06b6d4;
  --c-op:#64748b;    --c-typing:#9173f0;
  --kw:#a626a4; --str:#0d9f6e; --num:#b8860b; --com:#98a0ad; --bi:#0184bc; --fn:#3f78f0;
}
[data-theme="dark"]{
  --bg:#0d1220; --surface:#151c2c; --surface-2:#1a2234; --surface-3:#202a3e;
  --border:#273148; --border-strong:#394764;
  --text:#e7ebf3; --muted:#95a1b6; --faint:#65718a;
  --accent:#6b8cff; --accent-soft:#1b2646; --accent-ink:#adc0ff;
  --code-bg:#0f1626; --code-border:#273148; --mark-bg:#6a5713; --mark-ink:#ffe27a;
  --ok:#34d399;
  --shadow:0 1px 2px rgba(0,0,0,.32), 0 3px 14px rgba(0,0,0,.36);
  --shadow-lg:0 14px 48px rgba(0,0,0,.55);
  --c-builtin:#60a5fa; --c-str:#34d399; --c-seq:#a78bfa; --c-mapset:#818cf8;
  --c-oop:#f472b6;   --c-exc:#f87171; --c-module:#fbbf24; --c-iter:#22d3ee;
  --c-op:#94a3b8;    --c-typing:#b39cf7;
  --kw:#c678dd; --str:#98c379; --num:#d19a66; --com:#5c6678; --bi:#56b6c2; --fn:#61afef;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  margin:0; background:var(--bg); color:var(--text);
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  font-size:15px; line-height:1.58; -webkit-font-smoothing:antialiased;
}
code,pre,.mono{font-family:ui-monospace,"SF Mono","JetBrains Mono",Menlo,Consolas,monospace}
a{color:inherit}
::selection{background:var(--accent-soft);color:var(--accent-ink)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* ---------- шапка ---------- */
.site-header{
  position:sticky;top:0;z-index:60;border-bottom:1px solid var(--border);
  background:color-mix(in srgb,var(--surface) 86%,transparent);
  backdrop-filter:blur(16px) saturate(1.5);
}
.header-inner{max-width:1520px;margin:0 auto;padding:12px 26px;display:flex;align-items:center;gap:16px}
.brand{display:flex;align-items:center;gap:12px;flex-shrink:0}
.logo{
  width:40px;height:40px;border-radius:11px;position:relative;display:grid;place-items:center;
  background:linear-gradient(145deg,var(--accent),color-mix(in srgb,var(--accent) 60%,#7c3aed));
  box-shadow:0 5px 16px color-mix(in srgb,var(--accent) 38%,transparent);
}
.logo b{color:#fff;font-family:ui-monospace,monospace;font-weight:700;font-size:17px;letter-spacing:-1px}
.logo i{position:absolute;right:-3px;top:-3px;width:9px;height:9px;border-radius:50%;background:#ffd43b;border:2px solid var(--surface)}
.brand h1{margin:0;font-size:17px;font-weight:800;letter-spacing:-.35px;line-height:1.15}
.brand p{margin:0;font-size:12px;color:var(--muted);letter-spacing:.1px}
.header-spacer{flex:1}
.counter{font-size:13px;color:var(--muted);white-space:nowrap}
.counter b{color:var(--text);font-variant-numeric:tabular-nums}
.hbtn{
  height:36px;min-width:36px;padding:0 11px;border:1px solid var(--border-strong);
  background:var(--surface);color:var(--text);border-radius:var(--radius-sm);
  display:inline-flex;align-items:center;justify-content:center;gap:7px;
  font:inherit;font-size:13px;font-weight:600;cursor:pointer;
  transition:background .16s,border-color .16s,transform .16s;
}
.hbtn:hover{background:var(--surface-3);border-color:var(--accent)}
.hbtn:active{transform:translateY(1px)}
.hbtn svg{width:17px;height:17px;flex-shrink:0}
.hbtn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.hbtn.primary:hover{background:var(--accent-ink);border-color:var(--accent-ink)}
.hbtn.done{background:var(--ok);border-color:var(--ok);color:#fff}
.langs{display:inline-flex;border:1px solid var(--border-strong);border-radius:var(--radius-sm);overflow:hidden;height:36px}
.langs button{
  border:0;background:var(--surface);color:var(--muted);font:inherit;font-size:12px;font-weight:700;
  letter-spacing:.4px;padding:0 11px;cursor:pointer;transition:background .16s,color .16s;
}
.langs button+button{border-left:1px solid var(--border)}
.langs button[aria-pressed="true"]{background:var(--accent);color:#fff}
[data-theme="light"] .theme-sun,[data-theme="dark"] .theme-moon{display:none}

/* ---------- панель фильтров ---------- */
.toolbar{
  position:sticky;top:61px;z-index:50;border-bottom:1px solid var(--border);
  background:color-mix(in srgb,var(--bg) 90%,transparent);backdrop-filter:blur(14px);
}
.toolbar-inner{max-width:1520px;margin:0 auto;padding:12px 26px 13px;display:flex;flex-direction:column;gap:10px}
.search-row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.search-wrap{position:relative;flex:1;min-width:230px}
.search-wrap .s-ico{position:absolute;left:13px;top:50%;transform:translateY(-50%);width:17px;height:17px;color:var(--faint);pointer-events:none}
#search{
  width:100%;height:42px;padding:0 78px 0 40px;border:1px solid var(--border-strong);
  border-radius:var(--radius-sm);background:var(--surface);color:var(--text);
  font:inherit;font-size:14.5px;transition:border-color .16s,box-shadow .16s;
}
#search:focus{outline:0;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
#search::placeholder{color:var(--faint)}
.kbd-hint{
  position:absolute;right:38px;top:50%;transform:translateY(-50%);pointer-events:none;
  font-size:11px;color:var(--faint);border:1px solid var(--border);border-radius:5px;
  padding:1px 5px;background:var(--surface-2);
}
#search:not(:placeholder-shown)~.kbd-hint{display:none}
.search-clear{
  position:absolute;right:8px;top:50%;transform:translateY(-50%);width:24px;height:24px;
  border:0;border-radius:50%;background:var(--surface-3);color:var(--muted);cursor:pointer;
  display:none;place-items:center;font-size:15px;line-height:1;
}
#search:not(:placeholder-shown)~.search-clear{display:grid}
.seg{display:inline-flex;border:1px solid var(--border-strong);border-radius:var(--radius-sm);overflow:hidden;background:var(--surface)}
.seg button{
  border:0;background:transparent;color:var(--muted);font:inherit;font-size:12.5px;font-weight:600;
  padding:0 13px;height:40px;cursor:pointer;white-space:nowrap;transition:background .16s,color .16s;
}
.seg button+button{border-left:1px solid var(--border)}
.seg button:hover{background:var(--surface-3);color:var(--text)}
.seg button.active{background:var(--accent-soft);color:var(--accent-ink)}
.filters{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.fil-label{font-size:11px;font-weight:700;letter-spacing:.7px;text-transform:uppercase;color:var(--faint);margin-right:3px}
.chip{
  display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 11px;
  border:1px solid var(--border);border-radius:99px;background:var(--surface);
  color:var(--muted);font:inherit;font-size:12.5px;font-weight:600;cursor:pointer;
  transition:border-color .16s,color .16s,background .16s;
}
.chip:hover{border-color:var(--border-strong);color:var(--text)}
.chip.active{background:var(--accent-soft);border-color:var(--accent);color:var(--accent-ink)}
.chip .dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.chip .cnt{font-size:11px;color:var(--faint);font-variant-numeric:tabular-nums}
.chip.active .cnt{color:var(--accent-ink)}
.dd{position:relative}
.dd-menu{
  position:absolute;top:calc(100% + 6px);left:0;z-index:70;min-width:265px;max-height:60vh;overflow:auto;
  background:var(--surface);border:1px solid var(--border-strong);border-radius:var(--radius-sm);
  box-shadow:var(--shadow-lg);padding:5px;display:none;
}
.dd-menu.open{display:block}
.dd-menu button{
  display:flex;width:100%;align-items:center;justify-content:space-between;gap:10px;
  border:0;background:transparent;color:var(--text);font:inherit;font-size:13px;
  padding:7px 9px;border-radius:var(--radius-xs);cursor:pointer;text-align:left;
}
.dd-menu button:hover{background:var(--surface-3)}
.dd-menu button.active{background:var(--accent-soft);color:var(--accent-ink);font-weight:700}
.dd-menu .cnt{font-size:11px;color:var(--faint);font-variant-numeric:tabular-nums}

/* ---------- раскладка ---------- */
.layout{max-width:1520px;margin:0 auto;padding:22px 26px 80px;display:flex;gap:16px;align-items:flex-start}
.az-rail{
  position:sticky;top:172px;flex-shrink:0;display:flex;flex-direction:column;gap:1px;
  padding:7px 5px;background:var(--surface);border:1px solid var(--border);border-radius:99px;
  /* В глоссарии два алфавита сразу, и рельса перерастает экран.
     Прокрутка внутри неё дешевле, чем спрятанные буквы. */
  max-height:calc(100vh - 196px);overflow-y:auto;scrollbar-width:none;
}
.az-rail::-webkit-scrollbar{display:none}
.az-rail button{
  width:21px;height:19px;border:0;background:transparent;color:var(--faint);
  font:inherit;font-size:10.5px;font-weight:700;cursor:pointer;border-radius:5px;
}
.az-rail button:hover:not(:disabled){background:var(--accent-soft);color:var(--accent-ink)}
.az-rail button:disabled{opacity:.28;cursor:default}
.main{flex:1;min-width:0}
.sec-head{
  grid-column:1/-1;display:flex;align-items:baseline;gap:11px;
  margin:18px 2px 2px;padding-bottom:7px;border-bottom:1px solid var(--border);
}
.sec-head:first-child{margin-top:0}
.sec-head h2{margin:0;font-size:15.5px;font-weight:800;letter-spacing:-.2px}
.sec-head span{font-size:12px;color:var(--faint);font-variant-numeric:tabular-nums}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(345px,1fr));gap:13px;align-items:start}

/* ---------- карточка ---------- */
.card{
  position:relative;display:flex;flex-direction:column;
  background:var(--surface);border:1px solid var(--border);
  border-radius:var(--radius);padding:15px 16px 14px 19px;box-shadow:var(--shadow);
  overflow:hidden;transition:border-color .18s,box-shadow .18s,transform .18s;
}
.card::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--cg,var(--c-op))}
.card:hover{border-color:var(--border-strong);box-shadow:var(--shadow-lg);transform:translateY(-2px)}
.card:target{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft),var(--shadow-lg)}
.card-top{display:flex;align-items:flex-start;gap:9px;margin-bottom:3px}
.card-name{
  flex:1;min-width:0;font-family:ui-monospace,monospace;font-size:15.5px;font-weight:700;
  letter-spacing:-.3px;word-break:break-word;
}
.badges{display:flex;flex-wrap:wrap;gap:4px;justify-content:flex-end;flex-shrink:0}
.badge{
  font-size:10.5px;font-weight:700;letter-spacing:.25px;padding:2px 7px;border-radius:99px;
  background:var(--surface-3);color:var(--muted);white-space:nowrap;
}
.badge.cg{background:color-mix(in srgb,var(--cg) 14%,transparent);color:var(--cg)}
.badge.ver{background:color-mix(in srgb,var(--accent) 13%,transparent);color:var(--accent-ink)}
.subcat{font-size:11.5px;color:var(--faint);margin-bottom:9px}
.summary{font-size:14px;color:var(--text);margin-bottom:11px}
.field-label{
  font-size:10px;font-weight:800;letter-spacing:.85px;text-transform:uppercase;
  color:var(--faint);margin-bottom:4px;
}
.syntax{
  font-family:ui-monospace,monospace;font-size:12.5px;background:var(--code-bg);
  border:1px solid var(--code-border);border-radius:var(--radius-xs);padding:7px 10px;
  overflow-x:auto;white-space:pre;margin-bottom:11px;
}
.untranslated{
  display:inline-flex;align-items:center;gap:5px;font-size:11.5px;color:var(--faint);
  border:1px dashed var(--border-strong);border-radius:var(--radius-xs);padding:3px 8px;margin-bottom:11px;
}
.card-foot{display:flex;align-items:center;gap:9px;flex-wrap:wrap;padding-top:10px;border-top:1px solid var(--border)}
.expand{
  border:1px solid var(--border-strong);background:var(--surface);color:var(--muted);
  font:inherit;font-size:12px;font-weight:600;height:28px;padding:0 11px;border-radius:var(--radius-xs);
  cursor:pointer;display:inline-flex;align-items:center;gap:6px;transition:background .16s,color .16s,border-color .16s;
}
.expand:hover{background:var(--surface-3);color:var(--text);border-color:var(--accent)}
.expand svg{width:13px;height:13px;transition:transform .2s}
.card.open .expand svg{transform:rotate(180deg)}
.docs-link{
  margin-left:auto;display:inline-flex;align-items:center;gap:5px;font-size:12px;
  color:var(--muted);text-decoration:none;transition:color .16s;
}
.docs-link:hover{color:var(--accent)}
.docs-link svg{width:13px;height:13px}
.details{display:none;margin-top:12px;padding-top:12px;border-top:1px solid var(--border)}
.card.open .details{display:block}
.body-text{font-size:13.5px;color:var(--text);margin-bottom:13px;white-space:pre-wrap}
.ex-head{display:flex;align-items:center;justify-content:space-between;gap:9px;margin-bottom:4px}
.copy-btn{
  border:1px solid var(--border);background:var(--surface);color:var(--muted);font:inherit;
  font-size:11px;font-weight:600;height:24px;padding:0 8px;border-radius:6px;cursor:pointer;
  display:inline-flex;align-items:center;gap:5px;
}
.copy-btn:hover{border-color:var(--accent);color:var(--accent)}
.copy-btn.done{border-color:var(--ok);color:var(--ok)}
.copy-btn svg{width:12px;height:12px}
.examples{
  margin:0 0 13px;font-size:12.5px;line-height:1.62;background:var(--code-bg);
  border:1px solid var(--code-border);border-radius:var(--radius-xs);padding:10px 12px;
  overflow-x:auto;white-space:pre;
}
.related{display:flex;flex-wrap:wrap;gap:5px}
.related a{
  font-size:11.5px;font-family:ui-monospace,monospace;text-decoration:none;
  border:1px solid var(--border);border-radius:99px;padding:2px 9px;color:var(--muted);
  transition:border-color .16s,color .16s;
}
.related a:hover{border-color:var(--accent);color:var(--accent)}
.tok-kw{color:var(--kw)}.tok-str{color:var(--str)}.tok-num{color:var(--num)}
.tok-com{color:var(--com);font-style:italic}.tok-bi{color:var(--bi)}.tok-fn{color:var(--fn)}
.tok-com b{color:var(--text);font-style:normal;font-weight:600}
mark{background:var(--mark-bg);color:var(--mark-ink);border-radius:3px;padding:0 1px}

.empty{display:none;text-align:center;padding:80px 20px;color:var(--muted)}
.empty.show{display:block}
.empty .big{font-size:44px;margin-bottom:12px;opacity:.55}
.empty h3{margin:0 0 5px;font-size:17px;color:var(--text)}
.sentinel{height:1px}
.site-footer{
  max-width:1520px;margin:0 auto;padding:26px;border-top:1px solid var(--border);
  font-size:12.5px;color:var(--faint);display:flex;gap:14px;flex-wrap:wrap;align-items:center;
}
.site-footer a{color:var(--muted)}
@media (max-width:900px){
  .az-rail{display:none}
  .header-inner,.toolbar-inner,.layout,.site-footer{padding-left:15px;padding-right:15px}
  .brand p{display:none}
  .counter{display:none}
  .grid{grid-template-columns:1fr}
}
@media print{
  .site-header,.toolbar,.az-rail,.card-foot,.site-footer{display:none}
  .card{break-inside:avoid;box-shadow:none}
  .card .details{display:block}
}
</style>
</head>
<body>

<header class="site-header">
  <div class="header-inner">
    <div class="brand">
      <div class="logo"><b>py</b><i></i></div>
      <div>
        <h1 data-i18n="title">Python Glossary</h1>
        <p data-i18n="subtitle">Справочник стандартной библиотеки</p>
      </div>
    </div>
    <div class="header-spacer"></div>
    <div class="counter" id="counter"></div>
    <div class="langs" role="group" aria-label="Language">
      <button type="button" data-lang="ru" aria-pressed="true">RU</button>
      <button type="button" data-lang="en" aria-pressed="false">EN</button>
    </div>
    <button class="hbtn" id="themeBtn" type="button" data-i18n-title="theme" title="Сменить тему">
      <svg class="theme-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
      <svg class="theme-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/></svg>
    </button>
    <button class="hbtn primary" id="downloadBtn" type="button">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="M7 10l5 5 5-5"/><path d="M12 15V3"/></svg>
      <span data-i18n="download">Скачать</span>
    </button>
  </div>
</header>

<div class="toolbar">
  <div class="toolbar-inner">
    <div class="search-row">
      <div class="search-wrap">
        <svg class="s-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
        <input id="search" type="search" autocomplete="off" spellcheck="false" placeholder=" ">
        <span class="kbd-hint">/</span>
        <button class="search-clear" id="searchClear" type="button" aria-label="clear">×</button>
      </div>
      <div class="seg" id="sortGroup">
        <button type="button" data-sort="az" class="active">A→Z</button>
        <button type="button" data-sort="za">Z→A</button>
        <button type="button" data-sort="sec" data-i18n="bySection">По разделам</button>
      </div>
    </div>
    <div class="filters" id="kindFilters"></div>
    <div class="filters" id="groupFilters"></div>
  </div>
</div>

<div class="layout">
  <nav class="az-rail" id="azRail" aria-label="A-Z"></nav>
  <main class="main">
    <div class="grid" id="grid"></div>
    <div class="sentinel" id="sentinel"></div>
    <div class="empty" id="empty">
      <div class="big">🔍</div>
      <h3 data-i18n="emptyTitle">Ничего не найдено</h3>
      <p data-i18n="emptyHint">Попробуйте другой запрос или снимите фильтры.</p>
    </div>
  </main>
</div>

<footer class="site-footer">
  <span id="footStats"></span>
  <span>·</span>
  <a href="https://github.com/ArtVsMark/Glossary-Python" target="_blank" rel="noopener">ArtVsMark/Glossary-Python</a>
</footer>

<script id="glossary-data" type="application/json">{{GLOSSARY_DATA}}</script>
<script>
"use strict";

/* Чистый снимок страницы — до того, как скрипт что-либо в ней поменяет.
   Кнопка «Скачать» отдаёт именно его: сохранять текущий DOM значило бы
   раздавать файл с чужим поиском, открытыми карточками и чужой темой. */
const PRISTINE = "<!DOCTYPE html>\n" + document.documentElement.outerHTML;

const DATA = JSON.parse(document.getElementById("glossary-data").textContent);
const CG = ["builtin","str","seq","mapset","oop","exc","module","iter","op","typing"];
const CG_VAR = Object.fromEntries(CG.map(g => [g, "var(--c-" + g + ")"]));

/* ---------- язык интерфейса ---------- */
const I18N = {
  ru:{
    title:"Python Glossary", subtitle:"Справочник стандартной библиотеки",
    download:"Скачать", downloaded:"Готово", theme:"Сменить тему",
    search:"Поиск по имени, синонимам, ключевым словам…",
    bySection:"По разделам", kind:"Вид", group:"Группа", modules:"Модули",
    all:"Все", shown:"Показано", of:"из",
    term:"понятие", function:"функция", exception:"исключение", construct:"конструкция",
    syntax:"Синтаксис", examples:"Примеры", copy:"Копировать", copied:"Скопировано",
    details:"Подробнее", collapse:"Свернуть", seeAlso:"См. также",
    noTranslation:"Нет перевода на этот язык — показан русский текст",
    emptyTitle:"Ничего не найдено", emptyHint:"Попробуйте другой запрос или снимите фильтры.",
    stats:(n,s)=>`${n} карточек · ${s} разделов`
  },
  en:{
    title:"Python Glossary", subtitle:"Standard library reference",
    download:"Download", downloaded:"Saved", theme:"Toggle theme",
    search:"Search by name, alias, keyword…",
    bySection:"By section", kind:"Kind", group:"Group", modules:"Modules",
    all:"All", shown:"Showing", of:"of",
    term:"term", function:"function", exception:"exception", construct:"construct",
    syntax:"Syntax", examples:"Examples", copy:"Copy", copied:"Copied",
    details:"Details", collapse:"Collapse", seeAlso:"See also",
    noTranslation:"No translation for this language — showing Russian",
    emptyTitle:"Nothing found", emptyHint:"Try another query or clear the filters.",
    stats:(n,s)=>`${n} entries · ${s} sections`
  }
};
let LANG = "ru";
const t = k => I18N[LANG][k];

/* Текст карточки на выбранном языке; пустой перевод — не «пусто», а откат
   на русский с честной пометкой: пустая карточка выглядит сломанной. */
function txt(field){ return (field && field[LANG]) || ""; }
function txtOr(field){ return txt(field) || (field && field.ru) || ""; }
function isTranslated(d){ return LANG === "ru" || Boolean(d.summary && d.summary.en); }

/* ---------- подсветка Python (без сети) ---------- */
const PY_KW = new Set("False None True and as assert async await break class continue def del elif else except finally for from global if import in is lambda nonlocal not or pass raise return try while with yield match case".split(" "));
const PY_BI = new Set("print len range int str float bool list dict set tuple type input open sum min max abs round sorted reversed enumerate zip map filter isinstance issubclass hasattr getattr setattr delattr id hash repr format next iter super object bytes bytearray frozenset complex divmod pow all any ord chr hex oct bin vars dir help slice memoryview callable".split(" "));
const esc = s => String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");

function hlLine(line){
  let code = line, comment = null, inS = null;
  for(let i=0;i<line.length;i++){
    const c = line[i];
    if(inS){ if(c === inS && line[i-1] !== "\\") inS = null; }
    else if(c === '"' || c === "'"){ inS = c; }
    else if(c === "#"){ code = line.slice(0,i); comment = line.slice(i); break; }
  }
  let out = "";
  const re = /("""[\s\S]*?"""|'''[\s\S]*?'''|"(?:\\.|[^"\\])*"|'(?:\\.|[^'\\])*'|\b\d+\.?\d*(?:[eE][+-]?\d+)?\b|[A-Za-z_]\w*|\s+|[^\sA-Za-z_])/g;
  let m;
  while((m = re.exec(code))){
    const tok = m[0];
    if(/^["']/.test(tok)) out += '<span class="tok-str">' + esc(tok) + "</span>";
    else if(/^\d/.test(tok)) out += '<span class="tok-num">' + esc(tok) + "</span>";
    else if(/^[A-Za-z_]\w*$/.test(tok)){
      if(PY_KW.has(tok)) out += '<span class="tok-kw">' + tok + "</span>";
      else if(PY_BI.has(tok)) out += '<span class="tok-bi">' + tok + "</span>";
      else if(/^\s*\(/.test(code.slice(re.lastIndex))) out += '<span class="tok-fn">' + esc(tok) + "</span>";
      else out += esc(tok);
    }
    else out += esc(tok);
  }
  if(comment !== null){
    out += '<span class="tok-com">' +
      esc(comment).replace(/(#\s*(?:→|-&gt;)\s*)(.*)$/, "$1<b>$2</b>") + "</span>";
  }
  return out;
}
const highlightPy = code => code.split("\n").map(hlLine).join("\n");

/* ---------- индекс ---------- */
const BY_ID = new Map(DATA.map(d => [d.id, d]));
const SECTIONS = [];
DATA.forEach(d => { if(!SECTIONS.includes(d.section)) SECTIONS.push(d.section); });
const SECTION_COUNT = Object.create(null);
DATA.forEach(d => { SECTION_COUNT[d.section] = (SECTION_COUNT[d.section]||0) + 1; });
const CG_COUNT = Object.create(null);
DATA.forEach(d => { CG_COUNT[d.color_group] = (CG_COUNT[d.color_group]||0) + 1; });
const KIND_COUNT = Object.create(null);
DATA.forEach(d => { KIND_COUNT[d.kind] = (KIND_COUNT[d.kind]||0) + 1; });
const MODULE_SECTIONS = SECTIONS.filter(s => /^Модул/i.test(s)).sort((a,b) => a.localeCompare(b,"ru"));

/* Строка поиска считается один раз на карточку и язык: пересборка её на
   каждое нажатие клавиши превращала бы 1349 карточек в заметную паузу. */
const HAY = new Map();
function haystack(d){
  const key = d.id + "|" + LANG;
  let s = HAY.get(key);
  if(s === undefined){
    s = [d.title, d.id, txtOr(d.summary), ...(d.aliases||[]), ...(d.keywords||[]), d.section, d.subcat]
      .filter(Boolean).join(" ").toLowerCase();
    HAY.set(key, s);
  }
  return s;
}

/* ---------- состояние ---------- */
const state = { q:"", kind:"", cg:"", section:"", sort:"az" };
let visible = [];
let drawn = 0;
const CHUNK = 48;

const $ = sel => document.querySelector(sel);
const grid = $("#grid"), empty = $("#empty"), counter = $("#counter");

function matches(d){
  if(state.kind && d.kind !== state.kind) return false;
  if(state.cg && d.color_group !== state.cg) return false;
  if(state.section && d.section !== state.section) return false;
  if(state.q && !haystack(d).includes(state.q)) return false;
  return true;
}

const collator = new Intl.Collator("ru", {sensitivity:"base", numeric:true});
function sorted(list){
  const byTitle = (a,b) => collator.compare(a.title, b.title);
  if(state.sort === "az") return list.slice().sort(byTitle);
  if(state.sort === "za") return list.slice().sort((a,b) => byTitle(b,a));
  return list.slice().sort((a,b) =>
    SECTIONS.indexOf(a.section) - SECTIONS.indexOf(b.section) || byTitle(a,b));
}

function mark(text){
  const safe = esc(text);
  if(!state.q) return safe;
  const needle = esc(state.q).replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
  return safe.replace(new RegExp("(" + needle + ")", "gi"), "<mark>$1</mark>");
}

const ICON_CHEVRON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>';
const ICON_DOC = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><path d="M15 3h6v6"/><path d="M10 14 21 3"/></svg>';
const ICON_COPY = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/></svg>';

function cardHtml(d){
  const cgv = CG_VAR[d.color_group] || "var(--c-op)";
  const ver = d.version ? `<span class="badge ver">Python ${esc(d.version)}</span>` : "";
  const section = esc(d.section.replace(/^Модуль /, "mod · "));
  const syntax = d.syntax
    ? `<div class="field-label">${t("syntax")}</div><div class="syntax">${highlightPy(d.syntax)}</div>` : "";
  const hint = isTranslated(d) ? ""
    : `<div class="untranslated">⚑ ${t("noTranslation")}</div>`;
  const hasDetails = txtOr(d.body) || (d.examples && d.examples.length) || (d.related && d.related.length);
  return `<article class="card" id="${esc(d.id)}" style="--cg:${cgv}">
  <div class="card-top">
    <div class="card-name">${mark(d.title)}</div>
    <div class="badges">
      ${ver}<span class="badge cg">${section}</span><span class="badge">${t(d.kind) || esc(d.kind)}</span>
    </div>
  </div>
  ${d.subcat ? `<div class="subcat">${esc(d.subcat)}</div>` : ""}
  ${hint}
  <div class="summary">${mark(txtOr(d.summary))}</div>
  ${syntax}
  <div class="card-foot">
    ${hasDetails ? `<button class="expand" type="button"><span>${t("details")}</span>${ICON_CHEVRON}</button>` : ""}
    ${d.docs_url ? `<a class="docs-link" href="${esc(d.docs_url)}" target="_blank" rel="noopener">${ICON_DOC} docs.python.org</a>` : ""}
  </div>
  <div class="details" data-lazy="1"></div>
</article>`;
}

/* Тяжёлая часть карточки собирается при раскрытии: подсветка примеров для
   1349 карточек сразу — это секунды на пустом месте, потому что почти ничего
   из этого читатель не откроет. */
function detailsHtml(d){
  const body = txtOr(d.body);
  const parts = [];
  if(body) parts.push(`<div class="body-text">${mark(body)}</div>`);
  if(d.examples && d.examples.length){
    parts.push(`<div class="ex-head"><div class="field-label">${t("examples")}</div>
      <button class="copy-btn" type="button">${ICON_COPY}<span>${t("copy")}</span></button></div>
      <pre class="examples"><code>${highlightPy(d.examples.join("\n"))}</code></pre>`);
  }
  const links = (d.related || []).filter(id => BY_ID.has(id));
  if(links.length){
    parts.push(`<div class="field-label">${t("seeAlso")}</div><div class="related">` +
      links.map(id => `<a href="#${esc(id)}">${esc(BY_ID.get(id).title)}</a>`).join("") + "</div>");
  }
  return parts.join("");
}

function drawChunk(){
  if(drawn >= visible.length) return;
  const slice = visible.slice(drawn, drawn + CHUNK);
  let html = "";
  let prev = drawn > 0 ? visible[drawn-1].section : null;
  for(const d of slice){
    if(state.sort === "sec" && d.section !== prev){
      html += `<div class="sec-head"><h2>${esc(d.section)}</h2><span>${SECTION_COUNT[d.section]}</span></div>`;
      prev = d.section;
    }
    html += cardHtml(d);
  }
  grid.insertAdjacentHTML("beforeend", html);
  drawn += slice.length;
}

function render(){
  visible = sorted(DATA.filter(matches));
  grid.innerHTML = "";
  drawn = 0;
  drawChunk();
  empty.classList.toggle("show", visible.length === 0);
  counter.innerHTML = `${t("shown")}: <b>${visible.length}</b> ${t("of")} ${DATA.length}`;
  updateRail();
}

new IntersectionObserver(entries => {
  if(entries.some(e => e.isIntersecting)) drawChunk();
}, {rootMargin:"600px"}).observe($("#sentinel"));

/* ---------- фильтры ---------- */
function chip(label, active, count, color){
  const dot = color ? `<span class="dot" style="background:${color}"></span>` : "";
  const cnt = count === undefined ? "" : `<span class="cnt">${count}</span>`;
  return `<button class="chip${active ? " active" : ""}" type="button">${dot}${label}${cnt}</button>`;
}

function buildKindFilters(){
  const box = $("#kindFilters");
  const kinds = Object.keys(KIND_COUNT).sort((a,b) => KIND_COUNT[b] - KIND_COUNT[a]);
  box.innerHTML = `<span class="fil-label">${t("kind")}</span>` +
    chip(t("all"), state.kind === "", DATA.length) +
    kinds.map(k => chip(t(k) || k, state.kind === k, KIND_COUNT[k])).join("");
  box.querySelectorAll(".chip").forEach((b,i) => {
    b.onclick = () => { state.kind = i === 0 ? "" : kinds[i-1]; buildKindFilters(); render(); };
  });
}

function buildGroupFilters(){
  const box = $("#groupFilters");
  const groups = CG.filter(g => CG_COUNT[g]);
  const modLabel = state.section ? state.section.replace(/^Модуль /, "") : t("modules");
  box.innerHTML = `<span class="fil-label">${t("group")}</span>` +
    chip(t("all"), state.cg === "" && state.section === "", DATA.length) +
    groups.map(g => chip(g, state.cg === g, CG_COUNT[g], CG_VAR[g])).join("") +
    `<span class="dd"><button class="chip${state.section ? " active" : ""}" id="ddBtn" type="button" aria-expanded="false">
       <span class="dot" style="background:var(--c-module)"></span>${esc(modLabel)} ▾</button>
     <div class="dd-menu" id="ddMenu"></div></span>`;

  const plain = Array.from(box.querySelectorAll(".chip")).filter(b => b.id !== "ddBtn");
  plain.forEach((b,i) => {
    b.onclick = () => {
      state.section = "";
      state.cg = i === 0 ? "" : groups[i-1];
      buildGroupFilters(); render();
    };
  });

  const menu = $("#ddMenu"), btn = $("#ddBtn");
  menu.innerHTML = MODULE_SECTIONS.map(s =>
    `<button type="button" class="${state.section === s ? "active" : ""}">
       <span>${esc(s.replace(/^Модуль /, ""))}</span><span class="cnt">${SECTION_COUNT[s]}</span></button>`).join("");
  btn.onclick = e => {
    e.stopPropagation();
    const open = menu.classList.toggle("open");
    btn.setAttribute("aria-expanded", String(open));
  };
  menu.querySelectorAll("button").forEach((b,i) => {
    b.onclick = () => {
      const s = MODULE_SECTIONS[i];
      state.section = state.section === s ? "" : s;
      state.cg = "";
      menu.classList.remove("open");
      buildGroupFilters(); render();
    };
  });
}
document.addEventListener("click", () => {
  const m = $("#ddMenu"); if(m) m.classList.remove("open");
});

/* ---------- буквенная рельса ---------- */
/* Алфавит собирается из самих карточек: в глоссарии соседствуют латинские
   имена API и русские названия понятий, и жёсткая латиница просто спрятала
   бы вторые. */
const initial = d => (d.title[0] || "").toUpperCase();
const RAIL = Array.from(new Set(DATA.map(initial))).filter(ch => /\p{L}/u.test(ch))
  .sort((a,b) => collator.compare(a,b));
function updateRail(){
  const present = new Set(visible.map(initial));
  $("#azRail").innerHTML = RAIL
    .map(ch => `<button type="button"${present.has(ch) ? "" : " disabled"}>${ch}</button>`).join("");
  $("#azRail").querySelectorAll("button").forEach((b,i) => {
    b.onclick = () => {
      const idx = visible.findIndex(d => initial(d) === RAIL[i]);
      if(idx < 0) return;
      while(drawn <= idx) drawChunk();
      const el = document.getElementById(visible[idx].id);
      if(el) el.scrollIntoView({block:"start"});
    };
  });
}

/* ---------- события карточек ---------- */
grid.addEventListener("click", e => {
  const exp = e.target.closest(".expand");
  if(exp){
    const card = exp.closest(".card");
    const box = card.querySelector(".details");
    if(box.dataset.lazy){ box.innerHTML = detailsHtml(BY_ID.get(card.id)); delete box.dataset.lazy; }
    const open = card.classList.toggle("open");
    exp.querySelector("span").textContent = open ? t("collapse") : t("details");
    return;
  }
  const copy = e.target.closest(".copy-btn");
  if(copy){
    const code = copy.closest(".details").querySelector(".examples code");
    navigator.clipboard.writeText(code.textContent).then(() => {
      copy.classList.add("done");
      copy.querySelector("span").textContent = t("copied");
      setTimeout(() => {
        copy.classList.remove("done");
        copy.querySelector("span").textContent = t("copy");
      }, 1400);
    }).catch(() => {});
  }
});

/* Ссылка «см. также» ведёт на карточку, которой может не быть в текущей
   выборке: фильтр снимается, иначе переход молча никуда не приводит. */
window.addEventListener("hashchange", revealHash);
function revealHash(){
  const id = decodeURIComponent(location.hash.slice(1));
  if(!id || !BY_ID.has(id)) return;
  if(!visible.some(d => d.id === id)){
    state.q = ""; state.kind = ""; state.cg = ""; state.section = "";
    $("#search").value = "";
    buildKindFilters(); buildGroupFilters(); render();
  }
  const idx = visible.findIndex(d => d.id === id);
  while(drawn <= idx) drawChunk();
  const el = document.getElementById(id);
  if(el) el.scrollIntoView({block:"center"});
}

/* ---------- панель ---------- */
let timer;
$("#search").addEventListener("input", e => {
  clearTimeout(timer);
  const value = e.target.value.trim().toLowerCase();
  timer = setTimeout(() => { state.q = value; render(); }, 130);
});
$("#searchClear").onclick = () => {
  $("#search").value = ""; state.q = ""; render(); $("#search").focus();
};
$("#sortGroup").querySelectorAll("button").forEach(b => {
  b.onclick = () => {
    $("#sortGroup").querySelectorAll("button").forEach(x => x.classList.remove("active"));
    b.classList.add("active");
    state.sort = b.dataset.sort;
    render();
  };
});
document.addEventListener("keydown", e => {
  if(e.key === "/" && document.activeElement !== $("#search")){ e.preventDefault(); $("#search").focus(); }
  if(e.key === "Escape" && document.activeElement === $("#search")){ $("#searchClear").click(); }
});

/* ---------- тема ---------- */
function setTheme(name){
  document.documentElement.dataset.theme = name;
  try{ localStorage.setItem("glossary-theme", name); }catch(_){}
}
$("#themeBtn").onclick = () =>
  setTheme(document.documentElement.dataset.theme === "dark" ? "light" : "dark");

/* ---------- язык ---------- */
function applyLang(lang){
  LANG = lang;
  document.documentElement.dataset.lang = lang;
  document.documentElement.lang = lang;
  document.querySelectorAll("[data-i18n]").forEach(el => { el.textContent = t(el.dataset.i18n); });
  document.querySelectorAll("[data-i18n-title]").forEach(el => { el.title = t(el.dataset.i18nTitle); });
  document.querySelectorAll(".langs button").forEach(b =>
    b.setAttribute("aria-pressed", String(b.dataset.lang === lang)));
  $("#search").placeholder = t("search");
  $("#footStats").textContent = I18N[lang].stats(DATA.length, SECTIONS.length);
  buildKindFilters(); buildGroupFilters(); render();
  try{ localStorage.setItem("glossary-lang", lang); }catch(_){}
}
document.querySelectorAll(".langs button").forEach(b => {
  b.onclick = () => applyLang(b.dataset.lang);
});

/* ---------- скачивание страницы ---------- */
$("#downloadBtn").onclick = () => {
  const blob = new Blob([PRISTINE], {type:"text/html;charset=utf-8"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = "python-glossary.html";
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
  const btn = $("#downloadBtn"), label = btn.querySelector("span");
  btn.classList.add("done"); label.textContent = t("downloaded");
  setTimeout(() => { btn.classList.remove("done"); label.textContent = t("download"); }, 1600);
};

/* ---------- старт ---------- */
try{
  const savedTheme = localStorage.getItem("glossary-theme");
  if(savedTheme) document.documentElement.dataset.theme = savedTheme;
  else if(matchMedia("(prefers-color-scheme: dark)").matches) document.documentElement.dataset.theme = "dark";
}catch(_){}
let savedLang = "ru";
try{ savedLang = localStorage.getItem("glossary-lang") || "ru"; }catch(_){}
applyLang(savedLang === "en" ? "en" : "ru");
revealHash();
</script>
</body>
</html>
