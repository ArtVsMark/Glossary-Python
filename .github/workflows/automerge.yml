# Автомерж: изменение уезжает в main само, когда проверки позеленели.
#
# ЕДИНСТВЕННЫЙ ВЫЗОВ ЧЕРЕЗ GRAPHQL ВО ВСЁМ РЕПОЗИТОРИИ, И ОН НАЗВАН ПОИМЁННО.
# Правило каталога 001 требует REST по умолчанию: одна операция GraphQL стоит
# около трёхсот единиц часовой квоты против одной у REST. Оно же называет
# закрытый список операций, у которых REST-эквивалента НЕТ ВОВСЕ, и включение
# авто-мержа стоит в этом списке первым: мутация enablePullRequestAutoMerge.
# Мутация здесь ровно одна, вызывается один раз на изменение, и других
# обращений к GraphQL в дереве нет — это стережёт tests/test_automerge.py.
#
# ЧЕГО ЭТОТ ПРОГОН НЕ ДЕЛАЕТ. Он не сливает. Он ставит изменение в очередь
# площадки и уходит; сливает площадка, когда обязательные проверки позеленели
# и конфликта нет. Поэтому здесь нет ни повторов, ни ожидания, ни расхода
# квоты на опрос.
#
# ЧТО НУЖНО ВКЛЮЧИТЬ РУКАМИ ОДИН РАЗ. Настройка репозитория «Allow auto-merge»
# живёт вне дерева, и включить её из прогона нельзя: у GITHUB_TOKEN нет прав
# на настройки. Пока она выключена, мутация отвечает отказом — и шаг ниже
# печатает это словами, а не молчит (правило 158).
#
# ЧЬИМ ТОКЕНОМ СТАВИТСЯ В ОЧЕРЕДЬ — ТЕМ ИМЕНЕМ ПЛОЩАДКА И СЛИВАЕТ. Слияние,
# поставленное штатным GITHUB_TOKEN, делает github-actions[bot], а толчок от
# этого токена площадка не превращает в событие push: после слияния не
# просыпаются ни CI на main, ни публикация витрины, ни значки. Замер 07.10:
# витрина стояла на коммите часовой давности, пока в main уехало пять
# изменений. Поэтому токен берётся из секрета AUTOMERGE_TOKEN (PAT владельца,
# права contents и pull requests на запись), а без него — штатный, с
# предупреждением в прогоне: ставить в очередь он умеет, будить main — нет.
name: automerge

on:
  # Набор событий назван явно: умолчание площадки — opened, synchronize,
  # reopened — снятия черновика НЕ включает, а именно оно и есть согласие
  # (правило 104).
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, labeled, unlabeled]

  # У событийной автоматики всегда есть ручная кнопка: события теряются.
  workflow_dispatch:
    inputs:
      pull_request:
        description: Номер изменения, которое поставить в очередь
        required: true

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: automerge-${{ github.event.pull_request.number || inputs.pull_request }}
  cancel-in-progress: false

jobs:
  arm:
    name: Поставить в очередь площадки
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    # Секрет в условии шага недоступен, переменная работы — доступна.
    env:
      OWN_TOKEN: ${{ secrets.AUTOMERGE_TOKEN }}
    # Черновик согласия не выражает, а метка hold его отзывает: ни то, ни другое
    # в очередь не ставится. ГРАНИЦА: hold, поставленный ПОСЛЕ постановки в
    # очередь, её не отменяет — снятие автомержа это вторая мутация GraphQL, а
    # список исключений закрыт одной (правило 001). Сняли hold — событие
    # unlabeled поставит изменение в очередь заново.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (!github.event.pull_request.draft &&
       !contains(github.event.pull_request.labels.*.name, 'hold'))
    steps:
      - uses: actions/checkout@v7

      # Код дерева исполняется на планке, а не системным python раннера (217):
      # без этого шага число версии не объявлено вовсе, и сверять нечего.
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Слияние разбудит main, только если токен не штатный
        if: ${{ env.OWN_TOKEN == '' }}
        run: >
          echo "::warning title=Слияние не разбудит main::секрета AUTOMERGE_TOKEN нет —
          изменение поставлено штатным токеном, и после слияния push-прогоны
          (CI на main, витрина, значки) не запустятся до своего расписания"

      - name: Включить автомерж
        env:
          GH_TOKEN: ${{ secrets.AUTOMERGE_TOKEN || secrets.GITHUB_TOKEN }}
          NUMBER: ${{ github.event.pull_request.number || inputs.pull_request }}
        run: python scripts/automerge.py "$NUMBER"
