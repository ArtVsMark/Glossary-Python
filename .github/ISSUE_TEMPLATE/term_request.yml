name: Новая карточка / New card
description: Предложить термин, которого нет в глоссарии / Propose a term the glossary does not have
title: "[Карточка / Card]: "
labels: ["контент", "новая карточка"]
body:
  - type: markdown
    attributes:
      value: |
        Поля ниже повторяют структуру `data/glossary.json` — заполненную заявку
        можно перенести в данные почти без правок.

        The fields below follow the structure of `data/glossary.json` — a filled-in
        request can be moved into the data almost without edits.

  - type: input
    id: name
    attributes:
      label: Имя термина / Term name
      description: Так карточка будет называться в витрине. / The card's title in the showcase.
      placeholder: "str.removeprefix()"
    validations:
      required: true

  - type: input
    id: group
    attributes:
      label: Раздел / Section
      description: Существующий раздел глоссария или предложение нового. / An existing glossary section or a proposal for a new one.
      placeholder: "Строки (str) / Strings (str)"
    validations:
      required: true

  - type: dropdown
    id: cg
    attributes:
      label: Цветовая группа / Colour group
      options:
        - builtin — встроенные функции / built-in functions
        - str — строки / strings
        - seq — последовательности / sequences
        - mapset — словари и множества / dicts and sets
        - oop — ООП / OOP
        - exc — исключения / exceptions
        - module — модули стандартной библиотеки / standard library modules
        - iter — итераторы и генераторы / iterators and generators
        - op — операторы / operators
        - typing — аннотации типов / type annotations
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Описание / Description
      description: >
        Не меньше 60 символов. Объясните не только что делает конструкция,
        но и зачем она нужна на практике. / At least 60 characters. Explain not
        only what the construct does but also why it is needed in practice.
    validations:
      required: true

  - type: input
    id: syntax
    attributes:
      label: Синтаксис / Syntax
      placeholder: "str.removeprefix(prefix, /) -> str"
    validations:
      required: true

  - type: textarea
    id: examples
    attributes:
      label: Примеры / Examples
      description: Исполняемый код с ожидаемым результатом в комментариях. / Runnable code with the expected result in comments.
      render: python
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Минимальная версия Python / Minimum Python version
      description: Канонический вид — `3.9+`. Оставьте пустым, если ограничения нет. / Canonical form is `3.9+`. Leave empty if there is no restriction.
      placeholder: "3.9+"

  - type: input
    id: docs
    attributes:
      label: Ссылка на документацию / Documentation link
      description: Конкретный раздел или якорь, а не корень docs.python.org. / A specific section or anchor, not the docs.python.org root.
      placeholder: "https://docs.python.org/3/library/stdtypes.html#str.removeprefix"
    validations:
      required: true
