version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: "ci"
    labels: ["зависимости", "ci"]

  - package-ecosystem: pip
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: "build"
    labels: ["зависимости"]
    groups:
      dev-tools:
        patterns: ["ruff", "mypy", "pytest*"]
